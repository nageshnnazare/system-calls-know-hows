<h2 id="143-decoding-wstatus-wif-macros">1.4.3 Decoding wstatus: WIF* macros</h2>
<p>Never inspect <code>wstatus</code> with raw bit tests — use <code>&lt;sys/wait.h&gt;</code> macros:</p>
<pre><code class="language-c">#include &lt;sys/wait.h&gt;

if (WIFEXITED(status)) {
    int code = WEXITSTATUS(status);   /* 0–255 from exit()/return */
}
if (WIFSIGNALED(status)) {
    int sig  = WTERMSIG(status);      /* signal that killed child */
    int core = WCOREDUMP(status);     /* core dumped? */
}
if (WIFSTOPPED(status)) {
    int sig  = WSTOPSIG(status);      /* job control / ptrace stop */
}
if (WIFCONTINUED(status)) {
    /* child resumed by SIGCONT */
}
</code></pre>
<pre><code>   wstatus layout (simplified; use macros!)
   ┌──────────────────────────────────────┐
   │  low byte: exit code (if exited)      │
   │  or signal number (if signaled)       │
   │  flag bits: exited / signaled / stopped│
   └──────────────────────────────────────┘
</code></pre>
<p><strong>Pitfall ▸</strong> Only <strong><code>WEXITSTATUS</code></strong> is valid if <strong><code>WIFEXITED</code></strong> is true.
Reading exit code when the child was killed by <code>SIGKILL</code> is undefined — check
<code>WIFSIGNALED</code> first.</p>
<hr />
<h2 id="144-zombies-unreaped-children">1.4.4 Zombies: unreaped children</h2>
<p>A <strong>zombie</strong> (<code>Z</code> in <code>ps</code>, <code>&lt;defunct&gt;</code>) is a process that has <strong>exited</strong> but whose
parent has not <strong><code>wait()</code>ed</strong>:</p>
<pre><code>   parent busy / buggy                kernel
   ┌─────────────┐                   ┌──────────────┐
   │  parent     │  never wait()     │ zombie child │
   │  PID 1000   │◀── SIGCHLD ───────│ PID 1001, Z  │
   └─────────────┘                   │ exit code: 42│
                                     └──────────────┘
                                           │
                                     holds PID slot
</code></pre>
<p>Why it matters:</p>
<ul>
<li>Each zombie consumes a <strong><code>task_struct</code></strong> and a <strong>PID</strong> until reaped.</li>
<li>
<p>They use negligible RAM (no mappings), but <strong>thousands of zombies exhaust
  <code>pid_max</code></strong> — new <code>fork()</code> fails with <code>EAGAIN</code>.</p>
</li>
<li>
<p>Fix: parent must <strong><code>wait()</code></strong> (or ignore children with <code>SIG_IGN</code> — see below).</p>
</li>
</ul>
<hr />
<h2 id="145-orphans-and-pid-1">1.4.5 Orphans and PID 1</h2>
<p>If the <strong>parent exits before the child</strong>, the child becomes an <strong>orphan</strong>:</p>
<pre><code>   parent exits (no wait)     child still running
         │                         │
         ▼                         ▼
   removed from tree          reparented to init (PID 1)
                              systemd adopts, will wait() on exit
</code></pre>
<blockquote>
<p><strong>Under the hood ▸</strong> The kernel walks the process tree and reassigns orphans to
<strong>PID 1</strong> (<code>systemd</code> on modern Linux). PID 1 is written to <strong><code>wait()</code></strong> in a
loop so orphans never accumulate as zombies system-wide.</p>
</blockquote>
<p><strong>Trade-offs ▸</strong> Double-fork daemon pattern (Part 1.5) ensures the long-lived
daemon&rsquo;s parent is PID 1 immediately — so daemon children aren&rsquo;t tied to a
shell session.</p>
<hr />
<h2 id="146-sigchld-and-automatic-reap">1.4.6 SIGCHLD and automatic reap</h2>
<p>When a child terminates, the kernel may send <strong><code>SIGCHLD</code></strong> to the parent. Default
action is <strong>ignore</strong>, but a waiting <code>wait()</code> still works. With a <strong><code>SIGCHLD</code> handler</strong>,
use <strong><code>waitpid(-1, &amp;st, WNOHANG)</code> in a loop</strong> — multiple children may exit before
one signal:</p>
<pre><code class="language-c">#define _POSIX_C_SOURCE 200809L
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;unistd.h&gt;
#include &lt;sys/types.h&gt;
#include &lt;sys/wait.h&gt;
#include &lt;signal.h&gt;
#include &lt;errno.h&gt;

static volatile sig_atomic_t got_sigchld;

static void on_sigchld(int sig) {
    (void)sig;
    got_sigchld = 1;
}

static void reap_children(void) {
    int status;
    pid_t pid;

    while ((pid = waitpid(-1, &amp;status, WNOHANG)) &gt; 0) {
        if (WIFEXITED(status))
            fprintf(stderr, &quot;reaped PID %d, exit %d\\n&quot;,
                    pid, WEXITSTATUS(status));
        else if (WIFSIGNALED(status))
            fprintf(stderr, &quot;reaped PID %d, signal %d\\n&quot;,
                    pid, WTERMSIG(status));
    }
    if (pid == -1 &amp;&amp; errno != ECHILD)
        perror(&quot;waitpid&quot;);
}

int main(void) {
    struct sigaction sa = { .sa_handler = on_sigchld, .sa_flags = SA_RESTART };
    sigemptyset(&amp;sa.sa_mask);
    if (sigaction(SIGCHLD, &amp;sa, NULL) == -1) {
        perror(&quot;sigaction&quot;);
        exit(1);
    }

    for (int i = 0; i &lt; 3; i++) {
        pid_t pid = fork();
        if (pid == -1) { perror(&quot;fork&quot;); exit(1); }
        if (pid == 0) {
            sleep(1);
            _exit(i + 10);
        }
    }

    while (got_sigchld == 0)
        pause();   /* wait for signal; SA_RESTART handles EINTR on some syscalls */

    reap_children();
    return 0;
}
</code></pre>
<p>Setting <strong><code>signal(SIGCHLD, SIG_IGN)</code></strong> (or <code>sa_handler = SIG_IGN</code> with
<code>SA_NOCLDWAIT</code> on Linux) tells the kernel to <strong>auto-reap</strong> children — useful for
worker pools where you don&rsquo;t need exit status.</p>
<p><strong>Pitfall ▸</strong> Calling non-async-signal-safe functions (e.g. <code>printf</code>) inside a
<code>SIGCHLD</code> handler is unsafe (Part 4.2). Set a flag and reap in the main loop, as
above.</p>
<hr />
<h2 id="147-_exit-vs-exit-in-children-after-fork">1.4.7 _exit vs exit in children after fork</h2>
<p>After <code>fork()</code>, only one branch should call <strong><code>exit()</code></strong> from libc — it flushes
stdio buffers shared with the parent. Children should use <strong><code>_exit()</code></strong> / <strong><code>_Exit()</code></strong>
to terminate without duplicate output or double-free of libc state.</p>

<p><strong><code>wait</code>/<code>waitpid</code>/<code>wait4</code>/<code>waitid</code></strong> block (or poll with <code>WNOHANG</code>) for child
  state changes and reap zombies.</p>
</li>
<li>
<p>Use <strong><code>WIFEXITED</code>/<code>WEXITSTATUS</code>/<code>WIFSIGNALED</code></strong> macros — never raw bit hacks.</p>
</li>
<li><strong>Zombies</strong> hold PIDs until reaped; fix the parent, not the zombie.</li>

</ul>

<p>A <strong>process group</strong> is a set of processes that share one <strong>PGID</strong> (process group ID).

spikes, priority inversion symptoms, and why real-time policies can freeze a machine.</p>

<h2 id="161-who-runs-next">1.6.1 Who runs next?</h2>
<pre><code>   runnable tasks (per-CPU runqueues, simplified)

<p><strong>Under the hood ▸</strong> Linux 2.6+ uses <strong>CFS (Completely Fair Scheduler)</strong> for
<code>SCHED_OTHER</code>. Each runnable task accumulates <strong>virtual runtime (<code>vruntime</code>)</strong>;
the task with the smallest vruntime runs next. <strong>Nice</strong> adjusts how fast
vruntime grows — lower nice → slower growth → more CPU time.</p>
</blockquote>
<p>Blocking syscalls (<code>read</code>, <code>futex</code>, etc.) remove the task from the run queue until
the event completes (Part 0.1). <strong><code>sched_yield()</code></strong> voluntarily gives up the
remainder of the time slice.</p>

<code>\`\`
Returns the **new nice value** on success; on error returns **-1** and sets</code>errno<code>.
(Ambiguous if nice was already -1 — check</code>errno\`.)</p>
<p><strong>The call ▸</strong>
\`\`\`c</p>

**0 (highest) to 19 (lowest)** — *not* the same sign as</code>nice\` (-20..19) but

<table>

<th>Nice</th>
<th>Meaning</th>

<table>
<thead>

<th><code>errno</code></th>

<tbody>

on the core.</p>

<h2 id="163-scheduling-policies-sched_setscheduler">1.6.3 Scheduling policies: sched_setscheduler</h2>
<blockquote>
<p><strong>The call ▸</strong>

<table>
<thead>
<tr>
<th>Policy</th>
<th>Behavior</th>

<tbody>
<tr>

<tr>

<pre><code>   one SCHED_FIFO task at priority 50 in a busy loop

audited RT threads — not for making a web server &ldquo;faster.&rdquo; Always bound work, use
the lowest sufficient RT priority, and pin sparingly.</p>

<strong><code>SCHED_IDLE</code></strong> is ideal for low-priority background crunch (indexers, backups).</p>

<h2 id="166-sched_yield">1.6.6 sched_yield</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>

<ul>

<p><code>open()</code> is the front door to the kernel&rsquo;s file layer: you pass a pathname and a
set of flags, and the kernel returns a <strong>file descriptor</strong> — a small integer that
indexes your process&rsquo;s open-file table (Part 0.5). Every subsequent <code>read()</code>,
<code>write()</code>, <code>lseek()</code>, or <code>fcntl()</code> on that fd goes through the same kernel
<em>open file description</em>.</p>
<p><code>close()</code> tears down your process&rsquo;s reference to that description. It sounds
trivial; it is not — <code>close()</code> can fail, and closing the wrong fd is a classic
production bug.</p>
<hr />
<h2 id="211-the-open-family">2.1.1 The open family</h2>
<p>Three entry points, one kernel path:</p>
<pre><code>   open(path, flags, mode)     ← classic; path is relative to CWD
   openat(dirfd, path, flags, mode)  ← path relative to dirfd (or AT_FDCWD = CWD)
   creat(path, mode)             ← shorthand: open(path, O_CREAT|O_WRONLY|O_TRUNC, mode)
</code></pre>
<p>On x86-64, glibc&rsquo;s <code>open()</code> is typically implemented as <code>openat(AT_FDCWD, ...)</code>.
<code>openat()</code> matters for <strong>directory-relative</strong> opens (avoiding TOCTOU races on
symlinks), for sandboxed code that holds a dir fd, and for <code>O_TMPFILE</code> creation.</p>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <fcntl.h></h1>
<h1 id="include_1">include <sys/stat.h></h1>
<h1 id="include_2">include <unistd.h></h1>
<p>int open(const char <em>pathname, int flags, &hellip; /</em> mode_t mode <em>/);
int openat(int dirfd, const char </em>pathname, int flags, &hellip; /<em> mode_t mode </em>/);
int creat(const char *pathname, mode_t mode);
<code>\`\`
Returns a **new fd** (lowest unused ≥ 0) on success,</code>-1<code>on failure.</code>mode<code>is required only when</code>O_CREAT<code>(or</code>O_TMPFILE\`) is set.</p>
<p><strong>Under the hood ▸</strong> The kernel walks the VFS: resolve the pathname through
dentries → inode, checks permissions, allocates a <code>struct file</code>, installs an
entry in the process fd table pointing at it, and returns the index. Creation
flags may create a new inode on disk. See Part 2.7 for the full VFS picture.</p>
</blockquote>
<hr />
<h2 id="212-flag-groups--read-them-as-bitmasks">2.1.2 Flag groups — read them as bitmasks</h2>
<p>Flags are OR&rsquo;d together. Think in <strong>groups</strong>:</p>
<pre><code>   ┌─────────────────────────────────────────────────────────────────┐
   │  ACCESS MODE  (mutually exclusive — pick one)                    │
   │    O_RDONLY   read only                                          │
   │    O_WRONLY   write only                                         │
   │    O_RDWR     read and write                                     │
   ├─────────────────────────────────────────────────────────────────┤
   │  CREATION / EXISTENCE                                            │
   │    O_CREAT    create if missing (needs mode arg)                   │
   │    O_EXCL     with O_CREAT: fail if file already exists (atomic) │
   │    O_TRUNC    truncate regular file to length 0 on open-for-write│
   ├─────────────────────────────────────────────────────────────────┤
   │  STATUS / BEHAVIOUR                                              │
   │    O_APPEND   every write goes to end-of-file (atomic per write) │
   │    O_NONBLOCK non-blocking I/O (pipes, sockets, some devices)    │
   │    O_CLOEXEC  set FD_CLOEXEC on the new fd (close on exec)       │
   │    O_DIRECT   bypass page cache for this fd (alignment rules apply)│
   │    O_SYNC     data+metadata synced to storage before write returns │
   └─────────────────────────────────────────────────────────────────┘
</code></pre>
<p><strong>Access mode</strong> is stored in the open file description and queried later with
<code>fcntl(F_GETFL) &amp; O_ACCMODE</code>. You cannot flip <code>O_RDONLY</code> ↔ <code>O_RDWR</code> after open —
reopen the file.</p>
<p><strong>O_CREAT | O_EXCL</strong> is the standard pattern for <strong>atomic create</strong>: either you
get a new empty file or <code>EEXIST</code>. No race between &ldquo;does it exist?&rdquo; and &ldquo;create
it.&rdquo; Lock files, PID files, and temp-file schemes use this.</p>
<p><strong>O_TRUNC</strong> only affects <strong>regular files</strong>. Opening a directory or device with
<code>O_TRUNC</code> fails with <code>EISDIR</code> or <code>EINVAL</code>.</p>
<p><strong>Trade-offs ▸</strong> <code>O_CLOEXEC</code> on open (Linux 2.6.23+) beats remembering to
<code>fcntl(F_SETFD, FD_CLOEXEC)</code> in every code path — especially before <code>exec</code> in
multi-threaded programs where another thread could fork/exec between open and
fcntl.</p>
<hr />
<h2 id="213-mode-and-umask">2.1.3 mode and umask</h2>
<p>When <code>O_CREAT</code> is set, you pass <code>mode_t mode</code> — the <strong>desired</strong> permission bits
(owner/group/other, e.g. <code>0644</code>). The kernel applies the process <strong>umask</strong> before
writing the inode:</p>
<pre><code>   inode mode  =  mode  &amp;  ~umask

   example:  mode = 0666, umask = 0022  →  file created as 0644
</code></pre>
<pre><code>   process umask (e.g. 0022)
        │
        │  masks out write for group/other at create time
        ▼
   open(&quot;f&quot;, O_CREAT|O_WRONLY, 0666)  ──▶  inode permissions 0644
</code></pre>
<p><code>umask()</code> is a process attribute, inherited across <code>fork()</code>, not per-fd. Shells
often set <code>umask 022</code> in profile scripts.</p>
<blockquote>
<p><strong>Pitfall ▸</strong> Passing <code>0644</code> to <code>open()</code> does <strong>not</strong> mean &ldquo;this fd is
read-only.&rdquo; Access mode comes from <code>O_RDONLY</code>/<code>O_WRONLY</code>/<code>O_RDWR</code>, not from
<code>mode</code>. <code>mode</code> only affects the <strong>new inode&rsquo;s</strong> permission bits.</p>
</blockquote>
<hr />
<h2 id="214-what-close-actually-does">2.1.4 What close() actually does</h2>
<pre><code>   your process fd table                kernel open file descriptions
   ┌─────┬──────────────┐              ┌─────────────────────────────┐
   │  3  │ ─────────────┼─────────────▶│ struct file (offset, flags) │
   │  4  │ ─────────────┼───┐          │  refcnt = 2                 │
   └─────┴──────────────┘   │          └─────────────────────────────┘
                            └──────────▶ (same struct file as fd 3)

   close(3):  drop fd 3's reference; refcnt 2 → 1; fd 3 slot freed
   close(4):  refcnt 1 → 0; kernel releases struct file, may flush buffers
</code></pre>
<p><code>close(fd)</code>:</p>
<ol>
<li>Removes <code>fd</code> from <strong>your</strong> fd table (the integer becomes invalid immediately).</li>
<li>Decrements the reference count on the shared open file description.</li>
<li>When the count hits zero, the kernel flushes buffered data, releases locks
   held on that description, and may invoke the filesystem&rsquo;s <code>release</code> method.</li>
</ol>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include_3">include <unistd.h></h1>
<p>int close(int fd);
<code>\`\`
Returns</code>0<code>on success,</code>-1<code>on failure. **On success,</code>fd<code>is gone** — retrying</code>close(fd)<code>is undefined (and usually</code>EBADF\`).</p>
</blockquote>
<p><strong>Errors ▸</strong></p>
<table>
<thead>
<tr>
<th>errno</th>
<th>when it happens</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>EBADF</code></td>
<td><code>fd</code> is not an open fd</td>
</tr>
<tr>
<td><code>EINTR</code></td>
<td>A signal arrived before the kernel finished; <strong>fd state is unspecified</strong></td>
</tr>
<tr>
<td><code>EIO</code></td>
<td>I/O error during flush (e.g. NFS server gone, disk error)</td>
</tr>
</tbody>
</table>

<p><strong>Pitfall ▸</strong> After <code>close()</code> returns <code>-1</code> with <code>EINTR</code>, POSIX leaves the fd
<strong>in an indeterminate state</strong> — it may or may not be closed. Production code
either retries <code>close()</code> in a loop ignoring further <code>EINTR</code>, or leaks the fd
deliberately rather than double-close. Never assume &ldquo;EINTR means still open.&rdquo;</p>
<p><strong>Pitfall ▸</strong> <strong>Closing the wrong fd</strong> — often from an off-by-one or reusing a

<code>open()</code> a file, that file may become stdout. Always close the <strong>exact</strong> fd
returned by <code>open()</code>, and consider <code>O_CLOEXEC</code> so exec&rsquo;d children don&rsquo;t inherit
sensitive fds.</p>
</blockquote>

#include &lt;unistd.h&gt;

    while (close(fd) == -1) {

    }
    return 0;

<p>Once you have an fd from <code>open()</code> (Part 2.1), <code>read()</code> and <code>write()</code> are how
bytes move between your address space and whatever object sits behind the fd —
regular file, pipe, socket, device, or <code>/proc</code> entry. They look simple. The
mechanics — short counts, partial writes, shared offsets — cause a disproportionate
share of real bugs.</p>
<hr />
<h2 id="221-the-basic-contract">2.2.1 The basic contract</h2>
<pre><code>   user buffer                         kernel
   ┌──────────────┐                   ┌─────────────────┐
   │ buf[0..n-1]  │  read(fd,buf,n)   │ page cache /    │
   │              │ ◀─────────────────│ pipe buffer /   │
   │              │  write(fd,buf,n)  │ socket skbuff   │
   │              │ ─────────────────▶│ ...             │
   └──────────────┘                   └─────────────────┘
</code></pre>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <unistd.h></h1>
<p>ssize_t read(int fd, void <em>buf, size_t count);
ssize_t write(int fd, const void </em>buf, size_t count);
<code>\`\`
On success: number of bytes transferred (≥ 0). **</code>0<code>from</code>read()<code>= EOF** (no
bytes available now, and for regular files/pipes often means no more data).
On failure:</code>-1<code>,</code>errno\` set.</p>
</blockquote>
<p>The fd&rsquo;s <strong>current file offset</strong> advances by the returned count (except for
<code>O_APPEND</code> writes and <code>pread</code>/<code>pwrite</code> — see below). That offset lives in the
<strong>open file description</strong>, shared by all fds dup&rsquo;d from the same open (Part 2.4).</p>
<p><img alt="Open file table: fd → open file description → inode/VFS" src="figures/open-file-table.svg" /></p>
<hr />
<h2 id="222-short-reads-and-short-writes">2.2.2 Short reads and short writes</h2>
<p>A successful <code>read()</code> or <code>write()</code> may transfer <strong>fewer than <code>count</code> bytes</strong>. This
is normal, not an error.</p>
<pre><code>   you ask for 4096 bytes
        │
        ▼
   read() returns 512   ← still success; you must loop if you need all 4096
</code></pre>
<p><strong>Why short reads happen:</strong></p>
<ul>
<li><strong>Regular files:</strong> Less data remaining before EOF.</li>
<li><strong>Pipes/sockets/TCP:</strong> Kernel buffer has only partial data available now.</li>
<li>
<p><strong>Signals:</strong> <code>read()</code> may return <code>-1</code> with <code>EINTR</code> after partial transfer on
  some systems; always loop.</p>
</li>
<li>
<p><strong>Line discipline / terminals:</strong> Byte-at-a-time behaviour is common.</p>
</li>
</ul>
<p><strong>Why short writes happen:</strong></p>
<ul>
<li>
<p><strong>Pipes/sockets:</strong> Receiver not reading fast enough; kernel pipe/socket buffer
  full — <code>write()</code> returns how much fit (or <code>-1</code> with <code>EAGAIN</code> if non-blocking).</p>
</li>
<li>
<p><strong>Disk/files:</strong> Less common but possible; <strong>never assume</strong> <code>write(n)</code> wrote <code>n</code>.</p>
</li>

<blockquote>
<p><strong>Pitfall ▸</strong> Checking only <code>write(...) == -1</code> and ignoring <code>0 &lt; n &lt; count</code> is

</blockquote>
<p><strong>Trade-offs ▸</strong> Buffered stdio (<code>fread</code>/<code>fwrite</code>) hides short I/O inside libc.
Raw syscalls give control and predictability at the cost of writing loops yourself.</p>
<hr />
<h2 id="223-the-mandatory-loops">2.2.3 The mandatory loops</h2>
<h3 id="read-until-eof-streaming">Read until EOF (streaming)</h3>
<p>For unknown-length input, loop until <code>read()</code> returns <strong>0</strong>:</p>
<pre><code class="language-c">ssize_t n;

<p>When the open file description has <code>O_APPEND</code>, <strong>every</strong> <code>write()</code> (not <code>pwrite</code>

<p>Every open file description carries a <strong>current file offset</strong> — a byte position
where the next <code>read()</code> or <code>write()</code> (without <code>O_APPEND</code>) will start. <code>lseek()</code>
moves that offset. It does not touch the disk directly; it updates kernel state
that subsequent I/O consults.</p>
<p>Understanding where the offset lives — and who shares it — is essential for
threads, <code>dup()</code>, and <code>fork()</code> (Part 0.5, Part 2.4).</p>
<hr />
<h2 id="231-where-the-offset-lives">2.3.1 Where the offset lives</h2>
<pre><code>   process A                          process B (after fork)
   fd 3 ──┐                           fd 3 ──┐
   fd 5 ──┼──▶ open file description       ├──▶ same description
          │    offset = 4096               │    offset = 4096  (shared!)
          └──▶ inode / pipe / socket       └──▶ ...
</code></pre>
<p>The offset is a field in the <strong>open file description</strong> (<code>struct file</code> in the
kernel), <strong>not</strong> in the fd table slot. Two fds from <code>dup()</code> share one offset.
After <code>fork()</code>, parent and child share offsets on inherited fds until either
process <code>close()</code>s its copy or opens with <code>O_CLOEXEC</code>-cleared inheritance.</p>
<p><strong>Pitfall ▸</strong> Thread A calls <code>lseek()</code> while thread B <code>read()</code>s the same fd —
both use the same offset with no locking. Use <code>pread</code>/<code>pwrite</code> (Part 2.2) or a
mutex around seek+read/write pairs.</p>
<hr />
<h2 id="232-lseek">2.3.2 lseek()</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <unistd.h></h1>
<p>off_t lseek(int fd, off_t offset, int whence);
<code>\`\`
Returns the **new** offset from the start of the file on success,</code>(off_t)-1\` on
failure.</p>
</blockquote>
<p><strong>whence</strong> values:</p>
<pre><code>   SEEK_SET   offset is absolute from byte 0
   SEEK_CUR   offset is relative to current position
   SEEK_END   offset is relative to EOF (may be negative)

   example: file size = 1000
      lseek(fd, 0, SEEK_END)   → returns 1000
      lseek(fd, -10, SEEK_END) → returns 990
      lseek(fd, 0, SEEK_SET)   → returns 0  (rewind)
</code></pre>

<p><strong>Under the hood ▸</strong> For regular files, <code>lseek</code> updates <code>struct file-&gt;f_pos</code>.

<code>-1</code> with <code>ESPIPE</code> (&ldquo;illegal seek&rdquo;).</p>

offset without moving it (returns current position). Linux also provides
<code>lseek64()</code> for explicit 64-bit offsets on LFS builds.</p>

<h2 id="233-sparse-files-and-holes">2.3.3 Sparse files and holes</h2>
<p>If you <code>lseek()</code> far past EOF and <code>write()</code> one byte, the filesystem creates a
<strong>sparse file</strong>: logical size is huge, but disk blocks are allocated only for
written ranges.</p>
<pre><code>   logical file:  [====data====][........hole........][=data=]
   disk blocks:   [====data====]                      [=data=]
                              ▲
                         no blocks allocated (hole)
</code></pre>
<p>Reading a hole returns <strong>zero bytes</strong> (not stale disk data). <code>du</code> and <code>ls -s</code>
may show much less space than <code>ls -l</code> reports as size.</p>
<p>Linux extensions for discovering holes (regular files, some fs):</p>
<blockquote>
<p><strong>The call ▸</strong>
<code>c

off_t off = lseek(fd, start, SEEK_HOLE);</code></p>

<p>Useful for backup tools and sendfile-style copy that can skip holes.</p>
<hr />
<h2 id="234-off_t-and-large-files">2.3.4 off_t and large files</h2>
<p><code>off_t</code> width depends on feature macros:</p>
<pre><code>   default 32-bit off_t     max file ~2 GiB  (historical pain)

<p>On modern x86-64 Linux, <code>off_t</code> is 64-bit by default. On embedded 32-bit ARM,
compile with <code>-D_FILE_OFFSET_BITS=64</code> for large-file support.</p>
<p><strong>Systems ▸</strong> If <code>lseek</code>/<code>read</code>/<code>write</code> fail with <code>EOVERFLOW</code> on a 32-bit system,
you are hitting the 2 GiB wall — rebuild with 64-bit offsets.</p>
<hr />
<h2 id="235-ftruncate--set-size-without-io">2.3.5 ftruncate() — set size without I/O</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include_1">include <unistd.h></h1>
<p>int ftruncate(int fd, off_t length);

<p><code>dup()</code> family syscalls manipulate the <strong>fd table</strong> without creating a new kernel
object: two integers, one shared open file description (Part 0.5).</p>
<hr />
<h2 id="241-dup-dup2-dup3">2.4.1 dup, dup2, dup3</h2>
<pre><code>   fd table (before)              fd table (after dup2(out, 1))

   │ 1 │ stdout ─────┼──┐         │ 1 │ stdout ─────┼──┐
   │ 3 │ file out ───┼──┼──▶ OFD  │ 3 │ (closed)    │  │
   └───┴─────────────┘  │         └───┴─────────────┘  │
                        └──────────────────────────────┘
                              both 1 and 3 pointed here;
                              after dup2: only 1 → OFD, 3 closed if was open
</code></pre>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <unistd.h></h1>
<p>int dup(int oldfd);
int dup2(int oldfd, int newfd);
int dup3(int oldfd, int newfd, int flags);  /<em> flags: O_CLOEXEC </em>/
<code>\`\`</code>dup(oldfd)<code>→ lowest unused fd ≥ oldfd, same open file description.</code>dup2(oldfd, newfd)<code>→ if</code>newfd<code>was open, **close it first**, then make</code>newfd<code>a copy of</code>oldfd<code>. Returns</code>newfd<code>on success.</code>dup3<code>adds</code>O_CLOEXEC\` atomically (avoids race before fcntl).</p>

<p><code>fcntl()</code> is the Swiss-army syscall for fd manipulation: query and tweak per-fd and
per-open-description flags, duplicate fds, and manage <strong>advisory</strong> record locks.
Alongside it, <code>stat()</code> family calls read <strong>inode metadata</strong> without opening the
file, and <code>chmod</code>/<code>chown</code>/<code>access()</code> change or test permissions.</p>

<h2 id="251-fcntl--two-flag-namespaces">2.5.1 fcntl() — two flag namespaces</h2>
<p>Confusing until you see the split:</p>
<pre><code>   ┌────────────────────────────┬──────────────────────────────────────┐
   │  FD flags (per fd number)  │  file status flags (open description)│
   │  F_GETFD / F_SETFD         │  F_GETFL / F_SETFL                   │
   │  FD_CLOEXEC only           │  O_NONBLOCK, O_APPEND, O_ASYNC, ...  │
   │  dup() does not copy CLOEXEC│ shared by dup'd fds                 │
   └────────────────────────────┴──────────────────────────────────────┘
</code></pre>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <fcntl.h></h1>
<p>int fcntl(int fd, int cmd, &hellip; /<em> arg </em>/ );
\`\`\`</p>
</blockquote>
<p>Common commands:</p>
<table>
<thead>
<tr>
<th>cmd</th>
<th>arg</th>
<th>effect</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>F_GETFL</code></td>
<td>—</td>
<td>Return status flags + access mode</td>
</tr>
<tr>
<td><code>F_SETFL</code></td>
<td>flags</td>
<td>Set <strong>some</strong> status flags (OR masked subset)</td>
</tr>
<tr>
<td><code>F_GETFD</code></td>
<td>—</td>
<td>Return fd flags (<code>FD_CLOEXEC</code>)</td>
</tr>
<tr>
<td><code>F_SETFD</code></td>
<td>flags</td>
<td>Set fd flags</td>
</tr>
<tr>
<td><code>F_DUPFD</code></td>
<td>minfd</td>
<td>Dup to lowest fd ≥ minfd</td>
</tr>
<tr>
<td><code>F_DUPFD_CLOEXEC</code></td>
<td>minfd</td>
<td>Same + CLOEXEC</td>
</tr>
<tr>
<td><code>F_SETLK</code></td>
<td>struct flock *</td>
<td>Set/clear advisory lock (non-blocking)</td>
</tr>
<tr>
<td><code>F_SETLKW</code></td>
<td>struct flock *</td>
<td>Same, wait until available</td>
</tr>
</tbody>
</table>

<p><strong>Under the hood ▸</strong> <code>F_SETFL</code> updates <code>struct file-&gt;f_flags</code>. Only certain

</blockquote>
<p>Flip non-blocking at runtime:</p>
<pre><code class="language-c">int flags = fcntl(fd, F_GETFL);

<p>Part 7.1 covers non-blocking I/O patterns.</p>

<h2 id="252-advisory-record-locks-f_setlk--f_setlkw">2.5.2 Advisory record locks (F_SETLK / F_SETLKW)</h2>
<p>POSIX byte-range locks — <strong>cooperative</strong> (processes must use fcntl to participate):</p>
<pre><code class="language-c">struct flock lock = {

<blockquote>

\`\`\`c</p>

<p>Unix filesystems separate <strong>names</strong> (directory entries) from <strong>inodes</strong> (the
actual file object). <code>link()</code> adds another name for the same inode; <code>symlink()</code>
creates a name that points to another path. Directories are files whose data is a
list of <code>(name → inode)</code> pairs — read with <code>opendir</code>/<code>readdir</code>, implemented over
<code>getdents64</code> in the kernel.</p>
<hr />
<h2 id="261-names-vs-inodes">2.6.1 Names vs inodes</h2>
<pre><code>   directory &quot;docs&quot;              inode 481516
   ┌─────────────────┐          ┌──────────────────┐
   │ report.txt ─────┼─────────▶│ data blocks      │
   │ draft.txt ──────┼──┐       │ mode, size, ...  │
   └─────────────────┘  │       │ link count = 2   │
                        └──────▶│ (same inode)     │
                                └──────────────────┘

   symlink &quot;latest&quot; ──▶ &quot;report.txt&quot;   (separate inode; content is a path string)
</code></pre>
<p>The <strong>inode</strong> holds metadata and block pointers. The <strong>filename</strong> is just a hard
link — a directory entry with a reference count on the inode.</p>
<blockquote>
<p><strong>Under the hood ▸</strong> <code>unlink("draft.txt")</code> removes one directory entry and
decrements <code>st_nlink</code>. When <code>st_nlink</code> hits 0 and no process holds the file
open, the inode and blocks are reclaimed.</p>
</blockquote>
<hr />
<h2 id="262-hard-links-link-and-unlink">2.6.2 Hard links: link() and unlink()</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <unistd.h></h1>
<p>int link(const char <em>oldpath, const char </em>newpath);
int unlink(const char <em>pathname);
int rename(const char </em>oldpath, const char *newpath);
\`\`\`</p>
</blockquote>
<p>Hard links:</p>
<ul>
<li>Same filesystem only (<code>EXDEV</code> across mount points).</li>
<li>
<p>Cannot link directories (except <code>.</code> / <code>..</code> created by the kernel) — prevents
  directory cycles.</p>
</li>
<li>
<p>All hard links equal — no &ldquo;original&rdquo; vs &ldquo;alias.&rdquo;</p>
</li>
</ul>
<p><strong>Trade-offs ▸</strong> Hard links give cheap snapshots of the same bytes (no duplicate
storage). Editors that save via &ldquo;write temp + rename&rdquo; rely on <code>rename()</code> atomicity
(see below).</p>
<hr />
<h2 id="263-symbolic-links-symlink-and-readlink">2.6.3 Symbolic links: symlink() and readlink()</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include_1">include <unistd.h></h1>
<p>ssize_t readlink(const char <em>path, char </em>buf, size_t bufsiz);
ssize_t readlinkat(int dirfd, const char <em>path, char </em>buf, size_t bufsiz);
int symlink(const char <em>target, const char </em>linkpath);
\`\`\`</p>
</blockquote>
<p>Symlinks store a <strong>path string</strong> in the inode. Resolution happens at open time
(walk path components; when you hit a symlink, substitute and continue — with
limits on depth → <code>ELOOP</code>).</p>
<pre><code>   open(&quot;/tmp/latest&quot;)  →  read symlink target &quot;report.txt&quot;

                         →  open resulting path
</code></pre>
<p>Use <code>lstat()</code> (Part 2.5) to inspect symlinks without following them.

<h2 id="264-rename-atomicity">2.6.4 rename() atomicity</h2>
<p>On the same filesystem, <code>rename(old, new)</code> is <strong>atomic</strong> with respect to crash
and concurrent observers:</p>
<pre><code>   replace existing &quot;config&quot;:   rename(&quot;config.new&quot;, &quot;config&quot;)

rename fails with <code>EXDEV</code> — use copy + unlink instead.</p>

<h2 id="265-directories-mkdir-rmdir-reading-entries">2.6.5 Directories: mkdir, rmdir, reading entries</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include_2">include <sys/stat.h></h1>
<p>int mkdir(const char <em>path, mode_t mode);
int rmdir(const char </em>path);   /<em> directory must be empty </em>/</p>

<h2 id="266-unlinking-an-open-file">2.6.6 Unlinking an open file</h2>
<p>Classic Unix behaviour:</p>
<pre><code>   fd = open(&quot;temp&quot;, O_RDWR);

   write(fd, ...);          /* still works — inode alive via open fd ref */
   close(fd);               /* now inode reclaimed, blocks freed
</code></pre>
<p>Used for secure temp files (no pathname for other users to open) and lazy delete

&ldquo;disk full but I deleted the log&rdquo; ops issue.</p>
<pre><code>   process holds fd open ──▶ deleted file still consumes st_size on disk

</code></pre>

<h2 id="267-example-walk-a-directory-tree-non-recursive">2.6.7 Example: walk a directory tree (non-recursive)</h2>
<pre><code class="language-c">#include &lt;dirent.h&gt;
#include &lt;errno.h&gt;
#include &lt;fcntl.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;
#include &lt;sys/stat.h&gt;
#include &lt;unistd.h&gt;

static int list_dir(const char *dirpath) {

        perror(&quot;opendir&quot;);
        return -1;
    }

    struct dirent *ent;

        }

        else if (S_ISLNK(sb.st_mode))

        else

    }

    }
    if (closedir(d) == -1) {

        return -1;
    }

int main(int argc, char *argv[]) {

<ul>

<p>Every <code>open()</code>, <code>read()</code>, and <code>write()</code> in Parts 2.1–2.6 funnels through the
<strong>Virtual File System (VFS)</strong> — a kernel layer that presents one uniform API over
ext4, xfs, tmpfs, procfs, sysfs, pipes, sockets, and device nodes. The fd integer
in your process is the handle; behind it lie <strong>dentries</strong>, <strong>inodes</strong>, and
<strong>struct file</strong> objects wired together by function pointers.</p>
<hr />
<h2 id="271-the-vfs-stack">2.7.1 The VFS stack</h2>
<pre><code>   your program:  read(fd, buf, n)
        │
        ▼
   ┌─────────────────────────────────────────────────────────────┐
   │  VFS  — generic file layer (path walk, fd table, struct file)│
   └───────────────┬─────────────────────────────────────────────┘
                   │  dispatches via f_op-&gt;read_iter / write_iter
       ┌───────────┼───────────┬────────────┬──────────────┐
       ▼           ▼           ▼            ▼              ▼
    ext4        xfs         tmpfs       procfs         pipefs
    (disk)      (disk)      (RAM)       (/proc)        (kernel pipe)
</code></pre>
<blockquote>
<p><strong>Under the hood ▸</strong> Each mounted filesystem registers a <code>struct file_system_type</code>.
Path resolution walks <strong>dentries</strong> (cached name components). A dentry points to
an <strong>inode</strong> (metadata + <code>i_op</code> for metadata ops, <code>i_fop</code> or linked <code>file_operations</code>
for data). An open fd references a <strong>struct file</strong> (offset, flags, <code>f_op</code>).</p>
</blockquote>
<p><img alt="VFS layer: dentry, inode, struct file, and concrete filesystems" src="figures/vfs-inode.svg" /></p>
<p>One API drives them all — which is why <code>strace</code> shows <code>read(3, ...)</code> whether fd 3
is a disk file, a pipe, or <code>/proc/self/maps</code>.</p>
<hr />
<h2 id="272-three-objects--dont-conflate-them">2.7.2 Three objects — don&rsquo;t conflate them</h2>
<pre><code>   pathname  &quot;/var/log/app.log&quot;
        │
        ▼ walk dentries
   dentry &quot;app.log&quot; ──▶ inode 90210  (size, mode, block map)
        │
        ▼ open()
   struct file  (f_pos=0, f_flags=O_RDONLY, f_op→ext4)
        │
        ▼ install in fd table
   fd 3  in your process
</code></pre>
<table>
<thead>
<tr>
<th>object</th>
<th>lifetime</th>
<th>holds</th>
</tr>
</thead>
<tbody>
<tr>
<td>dentry</td>
<td>cache; LRU reclaimed</td>
<td>one path component + pointer to inode</td>
</tr>
<tr>
<td>inode</td>
<td>while link count &gt; 0 or open</td>
<td>metadata, ops, identity on one fs</td>
</tr>

<td>from <code>open</code> until last <code>close</code></td>

Part 2.6 showed multiple names (hard links) → one inode.</p>

<h2 id="273-the-page-cache-and-durability">2.7.3 The page cache and durability</h2>
<p>Regular file I/O usually flows through the <strong>page cache</strong> — file data cached in
RAM as pages:</p>
<pre><code>   write(fd, buf, n)  ──▶  copy into page cache (dirty pages)
                         ──▶  may return before disk platter moves

<p>Durability syscalls push toward physical storage:</p>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <unistd.h></h1>
<p>int fsync(int fd);           /<em> data + metadata for this file </em>/

<p><code>O_DIRECT</code> (Part 2.1) asks the filesystem to align I/O and transfer between your

<pre><code>   normal read:   disk → page cache → user buffer

coherency pain — pick one strategy per file.</p>

<h2 id="275-everything-is-a-file">2.7.5 &ldquo;Everything is a file&rdquo;</h2>

<p>That unification is why <strong>I/O multiplexing</strong> (<code>select</code>/<code>poll</code>/<code>epoll</code>, Part 6.6)
and <strong><code>read()</code> loops</strong> (Part 2.2) look the same across object types — the
polymorphism lives in kernel <code>file_operations</code>, not in your C types.</p>

<h2 id="276-example-observe-cache-vs-durability">2.7.6 Example: observe cache vs durability</h2>
<pre><code class="language-c">#include &lt;fcntl.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;
#include &lt;unistd.h&gt;

<p>Every process on Linux sees its own <strong>virtual address space</strong> — a contiguous range
of addresses from <code>0</code> up to the architecture limit (typically <code>0x00007fffffffffff</code>

<strong>translations</strong> the Memory Management Unit (MMU) resolves through page tables into
physical frames, swap, or &ldquo;not present yet.&rdquo; Part 1.2&rsquo;s <code>fork()</code> duplicates these
mappings with copy-on-write; Part 3.2–3.3 show how the heap and <code>mmap()</code> grow the
space.</p>
<hr />
<h2 id="311-the-layout-of-a-typical-process">3.1.1 The layout of a typical process</h2>
<p><img alt="Per-process virtual address space layout" src="figures/address-space.svg" /></p>
<p>On Linux x86-64, the kernel maps each process roughly like this (exact addresses
vary with ASLR and linker flags):</p>
<pre><code>   high addresses
   ┌─────────────────────────────────────────┐
   │  kernel (not visible in user space)      │  ← ring 0 only
   ├─────────────────────────────────────────┤
   │  stack          grows ▼                  │  argv, envp, local vars
   │     ... gap (guard pages) ...            │
   │  mmap region    grows ▼ (or fixed)       │  libs, shared mem, large allocs
   │     ...                                    │
   │  heap           grows ▲                  │  brk/sbrk, malloc small blocks
   │  BSS            (zero-init globals)      │
   │  data           (initialized globals)    │
   │  text (code)    read-only + execute      │
   └─────────────────────────────────────────┘
   low addresses (often 0x400000 or PIE base)
</code></pre>
<table>
<thead>
<tr>
<th>Segment</th>
<th>Contents</th>
<th>Typical growth</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>text</strong></td>
<td>Machine code, read-only string literals</td>
<td>Fixed at load</td>
</tr>
<tr>
<td><strong>data</strong></td>
<td>Initialized global/static variables</td>
<td>Fixed at load</td>
</tr>
<tr>
<td><strong>BSS</strong></td>
<td>Zero-initialized globals (<code>int x;</code>)</td>
<td>Fixed at load</td>
</tr>
<tr>
<td><strong>heap</strong></td>
<td>Dynamic allocations via <code>brk</code>/<code>malloc</code></td>
<td>Upward via <code>brk()</code> (Part 3.2)</td>
</tr>
<tr>
<td><strong>mmap</strong></td>
<td>Shared libraries, file mappings, large allocs</td>
<td><code>mmap()</code>/<code>munmap()</code> (Part 3.3)</td>
</tr>
<tr>
<td><strong>stack</strong></td>
<td>Function frames, local arrays</td>
<td>Downward on each call</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Under the hood ▸</strong> The kernel tracks each contiguous region as a <strong>VMA</strong>
(virtual memory area) in the process&rsquo;s <code>mm_struct</code>. <code>mmap()</code>, <code>brk()</code>, and
<code>munmap()</code> add, extend, or remove VMAs. The MMU only sees the resulting page
table entries.</p>
</blockquote>

cat /proc/1234/maps          # process 1234

<p>Each line is one VMA: start–end permissions offset device inode pathname.</p>

<h2 id="312-pages-the-mmu-and-page-tables">3.1.2 Pages, the MMU, and page tables</h2>
<p>Physical memory is managed in <strong>pages</strong> — typically <strong>4096 bytes</strong> on x86-64
(4 KiB). Huge pages (2 MiB, 1 GiB) exist for performance (Part 3.4).</p>
<pre><code>   virtual address (64-bit, mostly unused high bits)
        │
        ▼
   ┌─────────────┐     page walk (hardware)
   │ page tables │ ──────────────────────────▶ physical frame (or fault)

<th>Cause</th>

<td>NULL deref; write to read-only text</td>
</tr>
</tbody>
</table>

│          │       │    │        └─ device (major:minor)
│          │       │    └─ file offset of this mapping

<p>The <strong>heap</strong> is the upward-growing region between the BSS and the mmap arena. Its
upper bound — the <strong>program break</strong> — is moved by <code>brk()</code>/<code>sbrk()</code>. You almost
never call these directly; <strong>glibc <code>malloc()</code></strong> uses them for small allocations and
switches to <code>mmap()</code> for large ones (Part 3.3). Understanding the break is still
essential for debugging memory growth, fragmentation, and OOM behaviour.</p>
<hr />
<h2 id="321-the-program-break">3.2.1 The program break</h2>
<pre><code>   low addr
   ┌──────────┐
   │  text    │
   │  data    │
   │  BSS     │
   ├──────────┤  ◀── end of BSS (fixed at load)
   │  heap    │      malloc's small blocks live here
   │    ▲     │
   │    │ brk grows upward
   ├──────────┤  ◀── program break (current brk)
   │  (gap)   │
   │  mmap    │      libraries, large mmap allocs
   │  stack   │
   └──────────┘
</code></pre>
<p>After <code>execve()</code>, the kernel sets an initial break just past BSS. Each successful
<code>brk(new_end)</code> extends the <code>[heap]</code> VMA in <code>/proc/self/maps</code> (Part 3.1).</p>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <unistd.h></h1>
<p>int brk(void <em>addr);
void </em>sbrk(intptr_t increment);
<code>\`\`
**</code>brk(addr)<code>** — set break to</code>addr<code>(must be page-aligned internally; kernel
rounds). Returns **0** on success, **-1** on error.
**</code>sbrk(incr)<code>** — move break by</code>incr<code>bytes; returns **previous** break
address, or</code>(void *)-1<code>with</code>errno\` set.</p>
<p><strong>Note:</strong> <code>sbrk()</code> is deprecated in POSIX.1-2001 but still widely used inside
libc. Prefer <code>malloc()</code> in application code.</p>
</blockquote>
<p><strong>Errors ▸</strong></p>
<table>
<thead>
<tr>
<th><code>errno</code></th>
<th>When</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>ENOMEM</code></td>
<td>Insufficient virtual memory; would collide with mmap region</td>
</tr>
<tr>
<td><code>EINVAL</code></td>
<td>Requested address invalid (below current break or misaligned policy)</td>
</tr>
</tbody>
</table>
<hr />
<h2 id="322-what-brk-actually-does-in-the-kernel">3.2.2 What brk() actually does in the kernel</h2>
<pre><code>   brk(new_end)
        │
        ├─ new_end &lt;= current break  → shrink heap VMA (uncommon; may not release RAM)
        │
        └─ new_end &gt; current break   → extend [heap] VMA, zero-fill new pages
              │

<p><strong>Under the hood ▸</strong> <code>sys_brk()</code> adjusts the <code>start_brk</code>/<code>brk</code> fields in
<code>mm_struct</code> and merges/extents the heap VMA. Physical pages are allocated on
<strong>first write</strong> (demand paging, Part 3.1) — extending brk does not immediately
consume RAM equal to the virtual extension.</p>
</blockquote>
<p><strong>Pitfall ▸</strong> <code>free()</code> does <strong>not</strong> shrink the break. Freed small blocks return to
libc&rsquo;s free lists; the <code>[heap]</code> VMA size in maps stays at the high-water mark until
the process exits.</p>
<hr />
<h2 id="323-how-malloc-uses-brk-vs-mmap">3.2.3 How malloc() uses brk vs mmap</h2>
<p>glibc&rsquo;s allocator (ptmalloc) follows a rough policy:</p>
<pre><code>   malloc(size)
        │
        ├─ size &lt;= mmap threshold (default ~128 KiB on glibc)

</code></pre>
<table>
<thead>
<tr>
<th>Path</th>
<th>Pros</th>
<th>Cons</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>brk/heap</strong></td>
<td>Fast for small, frequent allocs; good locality</td>
<td>Fragmentation; rarely returns memory to OS</td>
</tr>
<tr>
<td><strong>mmap</strong></td>
<td>Large blocks returned on free; isolated</td>
<td>Syscall per mapping; page-rounded overhead</td>
</tr>
</tbody>
</table>
<p><strong>Trade-offs ▸</strong> A long-running server that allocates many varied small sizes can
<strong>fragment</strong> the heap — RSS stays high even if <code>malloc</code> statistics show plenty of
free space. Tools: <code>malloc_info()</code>, <code>jemalloc</code>/<code>tcmalloc</code>, or periodic restart.</p>

<h2 id="324-fragmentation-mechanics">3.2.4 Fragmentation mechanics</h2>
<pre><code>   heap after many alloc/free cycles:

<h2 id="325-glibc-arenas-overview">3.2.5 glibc arenas (overview)</h2>
<p>In multi-threaded programs, a single heap lock would serialize every <code>malloc</code>.
glibc creates <strong>arenas</strong> — each arena owns a heap extent (via brk or mmap):</p>
<pre><code>   thread 1 ──▶ arena 0 ──▶ brk heap
   thread 2 ──▶ arena 1 ──▶ mmap'd heap chunk
   thread 3 ──▶ arena 0 (if free)
        ...

</code></pre>

</blockquote>
<p>Tune with:</p>
<pre><code class="language-c">#include &lt;malloc.h&gt;
mallopt(M_ARENA_MAX, 4);   /* call before much allocation, e.g. early main */
</code></pre>
<hr />
<h2 id="326-why-you-rarely-call-brk-directly">3.2.6 Why you rarely call brk directly</h2>
<ul>
<li><strong>Portability:</strong> <code>mmap()</code> is the POSIX-endorsed way to obtain memory mappings.</li>
<li>
<p><strong>Alignment &amp; metadata:</strong> <code>malloc</code> manages chunk headers, alignment, and
  <code>free()</code> coalescing — raw brk gives you a byte range and nothing else.</p>
</li>
<li>
<p><strong>Thread safety:</strong> Direct brk bypasses arena locking → corruption with pthreads.</p>

(<code>sbrk(0)</code> to read current break).</p>
<hr />
<h2 id="327-observing-the-break-debugging-only">3.2.7 Observing the break (debugging only)</h2>
<pre><code class="language-c">#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;unistd.h&gt;

int main(void) {
    void *break_before = sbrk(0);
    if (break_before == (void *)-1) {
        perror(&quot;sbrk(0)&quot;);

<hr />

<thead>
<tr>
<th>Backing</th>

<tbody>
<tr>
<td><strong>File</strong></td>

<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <sys/mman.h></h1>
<p>void <em>mmap(void </em>addr, size_t length, int prot, int flags,

<code>\`\`

<p><strong><code>length</code></strong> — rounded up to page size (4096). <strong><code>offset</code></strong> — must be page-aligned.</p>
</blockquote>
<h3 id="protection-prot">Protection: <code>prot</code></h3>
<table>
<thead>
<tr>
<th>Flag</th>
<th>Meaning</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>PROT_READ</code></td>
<td>Read access</td>
</tr>
<tr>
<td><code>PROT_WRITE</code></td>
<td>Write access</td>
</tr>
<tr>

</tr>
<tr>

</tr>
</tbody>

<h3 id="mapping-behaviour-flags">Mapping behaviour: <code>flags</code></h3>
<table>
<thead>
<tr>
<th>Flag</th>
<th>Meaning</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>MAP_SHARED</code></td>
<td>Writes visible to other mappers and eventually the file</td>
</tr>

<td><code>MAP_PRIVATE</code></td>

</tr>
<tr>

</tr>

<td><code>MAP_FIXED</code></td>

</tr>
<tr>

</tr>

<th><code>errno</code></th>

<h2 id="333-file-backed-mapping">3.3.3 File-backed mapping</h2>
<pre><code>   open(&quot;data.bin&quot;) → fd

<p><strong>MAP_PRIVATE</strong> (default for read-mostly):</p>
<ul>
<li>Reads share the <strong>page cache</strong> with other processes mapping the same file.</li>
<li>Writes fault into <strong>private COW copies</strong> — the on-disk file is unchanged.</li>
</ul>
<p><strong>MAP_SHARED</strong>:</p>
<ul>

</ul>

</blockquote>

for pipes/sockets.</p>

<h2 id="334-anonymous-mapping">3.3.4 Anonymous mapping</h2>
<pre><code class="language-c">void *p = mmap(NULL, size, PROT_READ | PROT_WRITE,
               MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
</code></pre>
<ul>
<li>Zero-filled on first touch (demand paging, Part 3.1).</li>
<li><code>fork()</code> child shares pages COW until either writes (Part 1.2).</li>
<li><code>munmap(p, size)</code> returns virtual area; physical pages reclaimed when unreferenced.</li>
</ul>
<p>glibc uses anonymous <code>mmap()</code> above its threshold instead of <code>brk()</code> (Part 3.2).</p>

<h2 id="335-munmap-and-msync">3.3.5 munmap and msync</h2>
<p><strong><code>munmap(addr, length)</code></strong> — removes mappings; <code>addr</code> and <code>length</code> must match a
 prior mapping (typically the same page-rounded region). Partial unmap splits VMAs.</p>
<p><strong><code>msync()</code></strong> — for <code>MAP_SHARED</code> file mappings, flush dirty pages:</p>
<table>
<thead>
<tr>
<th>Flag</th>
<th>Behaviour</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>MS_SYNC</code></td>
<td>Blocking flush to storage</td>
</tr>
<tr>
<td><code>MS_ASYNC</code></td>
<td>Schedule writeback, return</td>
</tr>
<tr>
<td><code>MS_INVALIDATE</code></td>
<td>Invalidate other mappings (rare)</td>
</tr>
</tbody>
</table>
<p><strong>Pitfall ▸</strong> Forgetting <code>munmap()</code> leaks <strong>virtual address space</strong> (and possibly
RSS until process exit). Long-running services mapping many temp files need explicit
unmap or reuse strategies.</p>
<hr />
<h2 id="336-page-alignment-rules">3.3.6 Page alignment rules</h2>
<pre><code>   offset % page_size == 0     ✓ required
   length  → rounded up       internally
   returned addr              always page-aligned
</code></pre>
<p>If you map at a fixed address (<code>MAP_FIXED</code>), you can clobber existing mappings —
including libc&rsquo;s heap — and crash instantly.</p>
<hr />
<h2 id="337-file-mmap-example-read-only-search">3.3.7 File-mmap example: read-only search</h2>
<pre><code class="language-c">#define _POSIX_C_SOURCE 200809L
#include &lt;sys/mman.h&gt;
#include &lt;sys/stat.h&gt;
#include &lt;fcntl.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;
#include &lt;unistd.h&gt;

static int count_char(const char *data, size_t len, char needle) {
    size_t n = 0;
    for (size_t i = 0; i &lt; len; i++)
        if (data[i] == needle)
            n++;
    return (int)n;
}

int main(int argc, char *argv[]) {
    if (argc != 3) {
        fprintf(stderr, &quot;usage: %s &lt;file&gt; &lt;char&gt;\\n&quot;, argv[0]);
        return 1;
    }

<h2 id="summary">Summary</h2>
<ul>
<li>
<p><code>mmap()</code> creates a VMA backed by a file page cache or anonymous zero pages;
  failure returns <strong><code>MAP_FAILED</code></strong>, not NULL.</p>
</li>
<li>
<p><strong><code>MAP_PRIVATE</code></strong> COW for writes; <strong><code>MAP_SHARED</code></strong> for IPC and shared file updates.</p>

  extreme care.</li>
</ul>

<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <sys/mman.h></h1>

<table>
<thead>

<th><code>errno</code></th>
<th>When</th>

<h2 id="342-guard-pages-and-wx">3.4.2 Guard pages and W^X</h2>

<h1 id="include_1">include <sys/mman.h></h1>

<p><strong>Shared memory</strong> is the fastest IPC path: multiple processes map the <strong>same
physical pages</strong> into their address spaces and read/write them like ordinary memory.
The kernel is not involved per access — only at setup and teardown. That speed comes
with a cost: <strong>you must synchronize</strong> (mutexes, semaphores, futex — Parts 5.3,
4.3–4.4, 5.5) or accept data races.</p>
<hr />
<h2 id="351-the-core-idea">3.5.1 The core idea</h2>
<pre><code>   process A                          process B
   ┌─────────────┐                    ┌─────────────┐
   │ VA 0x7f..   │                    │ VA 0x7f..   │   (addresses may differ)
   │   shared    │                    │   shared    │
   └──────┬──────┘                    └──────┬──────┘
          │                                  │
          └──────────▶ same physical frames ◀┘
</code></pre>
<p>Two families on Linux:</p>
<table>
<thead>
<tr>
<th>API</th>
<th>Naming</th>
<th>Persistence</th>
<th>Modern preference</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>POSIX</strong></td>
<td><code>shm_open</code> + <code>mmap</code></td>
<td>Until unlinked</td>
<td>✓ preferred for new code</td>
</tr>
<tr>
<td><strong>System V</strong></td>
<td><code>shmget</code>/<code>shmat</code></td>
<td>Until <code>shmctl(IPC_RMID)</code></td>
<td>Legacy, still common</td>
</tr>
</tbody>
</table>
<p>Both ultimately use <strong><code>mmap(MAP_SHARED)</code></strong> under the hood.</p>
<hr />
<h2 id="352-tmpfs-and-devshm">3.5.2 tmpfs and /dev/shm</h2>
<p>POSIX shared memory objects and many anonymous shared regions live on <strong>tmpfs</strong> — a
RAM-backed filesystem:</p>
<pre><code class="language-bash">ls -la /dev/shm          # visible POSIX shm object names
df -h /dev/shm           # size limited by half RAM typically (shm_size mount opt)
</code></pre>
<pre><code>   shm_open(&quot;/my_ring&quot;, ...)  →  file in /dev/shm/my_ring (leading / stripped)
        │
        mmap(MAP_SHARED)       →  shared anonymous/file-backed pages in RAM
</code></pre>
<p><strong>Trade-offs ▸</strong> tmpfs is fast but counts against memory limits; huge shm segments
can trigger OOM killer behaviour under pressure.</p>
<hr />
<h2 id="353-posix-shared-memory-shm_open--mmap">3.5.3 POSIX shared memory: shm_open + mmap</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <sys/mman.h></h1>
<h1 id="include_1">include <sys/stat.h></h1>
<h1 id="include_2">include <fcntl.h></h1>
<p>int shm_open(const char <em>name, int oflag, mode_t mode);
int shm_unlink(const char </em>name);
<code>\`\`
**</code>name<code>** — must start with</code>/<code>and contain no other slashes (e.g.</code>/myapp_buf<code>).
Returns an **fd** suitable for</code>ftruncate<code>+</code>mmap(MAP_SHARED)\` (Part 0.5).</p>
</blockquote>
<p>Workflow:</p>
<pre><code>   shm_open(&quot;/demo&quot;, O_CREAT|O_RDWR, 0600)  → fd
   ftruncate(fd, sizeof(struct payload))    → set size
   mmap(..., MAP_SHARED, fd, 0)             → pointer
   close(fd)                                → mapping persists
   shm_unlink(&quot;/demo&quot;)                      → name removed; segment until last unmap
</code></pre>
<p><strong>Errors ▸</strong></p>
<table>
<thead>
<tr>
<th><code>errno</code></th>
<th>When</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>EEXIST</code></td>
<td><code>O_CREAT|O_EXCL</code> and name exists</td>
</tr>
<tr>
<td><code>ENOENT</code></td>
<td>Open without <code>O_CREAT</code> and name missing</td>
</tr>
<tr>
<td><code>EINVAL</code></td>
<td>Invalid name format</td>
</tr>
<tr>
<td><code>EMFILE</code></td>
<td>Process fd table full</td>
</tr>
</tbody>
</table>
<hr />
<h2 id="354-system-v-shared-memory">3.5.4 System V shared memory</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include_3">include <sys/shm.h></h1>
<p>int shmget(key_t key, size_t size, int shmflg);
void <em>shmat(int shmid, const void </em>shmaddr, int shmflg);
int shmdt(const void <em>shmaddr);
int shmctl(int shmid, int cmd, struct shmid_ds </em>buf);
<code>\`\`
**</code>key<code>** — from</code>ftok(path, id)<code>or **</code>IPC_PRIVATE<code>** (private to creating process
until passed via fork or explicit send). **</code>shmat<code>** returns pointer; **</code>(void *)-1<code>**
on error with</code>errno\`.</p>
</blockquote>
<pre><code>   ftok(&quot;/tmp/mykey&quot;, 1)  → 0x12345678
   shmget(key, size, IPC_CREAT|0666)  → shmid (global integer id)
   shmat(shmid, NULL, 0)              → mapped address
</code></pre>
<p><strong>Pitfall ▸</strong> SysV IPC objects <strong>persist after crash</strong> until <code>ipcrm</code> or
<code>shmctl(IPC_RMID)</code> with last detach — classic stale-segment footgun (Part 4.3).</p>

<h2 id="355-map_shared-anonymous--fork">3.5.5 MAP_SHARED anonymous + fork</h2>
<p>The simplest shared memory requires no named object:</p>
<pre><code class="language-c">void *p = mmap(NULL, size, PROT_READ|PROT_WRITE,
               MAP_SHARED|MAP_ANONYMOUS, -1, 0);
pid_t pid = fork();
/* parent and child share pages COW until write — then split per page */
</code></pre>
<p>After <strong>write</strong>, pages become private copies (COW, Part 1.2). For true shared
writable state across unrelated processes, use <code>MAP_SHARED</code> on a <strong>file</strong> or
<strong>shm_open</strong> object, not anonymous post-fork writes without a shared backing.</p>
<hr />
<h2 id="356-synchronization-requirement">3.5.6 Synchronization requirement</h2>
<p>Shared memory provides <strong>no</strong> ordering or atomicity:</p>
<pre><code>   process A: counter++     \\
   process B: counter++      → races without sync
</code></pre>
<p>Use:</p>
<ul>
<li><strong>POSIX semaphores</strong> (<code>sem_open</code> / <code>sem_wait</code>, Part 4.4).</li>
<li><strong>System V semaphores</strong> (<code>semop</code>, Part 4.3).</li>
<li><strong>pthread mutex in shared memory</strong> with <code>PTHREAD_PROCESS_SHARED</code> (Part 5.3).</li>
<li><strong>C11 atomics</strong> or <strong>futex</strong> (Part 5.5) for expert paths.</li>
</ul>
<p><strong>Pitfall ▸</strong> Placing a normal <code>pthread_mutex_t</code> in shm without
<code>pthread_mutexattr_setpshared</code> → undefined behaviour.</p>
<hr />
<h2 id="357-posix-shm-example-parentchild-counter">3.5.7 POSIX shm example: parent/child counter</h2>
<pre><code class="language-c">#define _POSIX_C_SOURCE 200809L
#include &lt;fcntl.h&gt;
#include &lt;semaphore.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;sys/mman.h&gt;
#include &lt;sys/stat.h&gt;
#include &lt;sys/wait.h&gt;
#include &lt;unistd.h&gt;

#define SHM_NAME &quot;/sc_shm_demo&quot;
#define SEM_NAME &quot;/sc_sem_demo&quot;

struct shared {
    int counter;
};

int main(void) {
    shm_unlink(SHM_NAME);
    sem_unlink(SEM_NAME);

    int fd = shm_open(SHM_NAME, O_CREAT | O_RDWR, 0600);
    if (fd == -1) {
        perror(&quot;shm_open&quot;);
        return 1;
    }

    if (ftruncate(fd, sizeof(struct shared)) == -1) {
        perror(&quot;ftruncate&quot;);
        close(fd);
        return 1;
    }

    struct shared *mem = mmap(NULL, sizeof(struct shared),
                              PROT_READ | PROT_WRITE, MAP_SHARED, fd, 0);
    if (mem == MAP_FAILED) {
        perror(&quot;mmap&quot;);
        close(fd);
        return 1;
    }
    if (close(fd) == -1) {
        perror(&quot;close&quot;);
        munmap(mem, sizeof *mem);
        return 1;
    }

    mem-&gt;counter = 0;

    sem_t *sem = sem_open(SEM_NAME, O_CREAT | O_EXCL, 0600, 1);
    if (sem == SEM_FAILED) {
        perror(&quot;sem_open&quot;);
        munmap(mem, sizeof *mem);
        shm_unlink(SHM_NAME);
        return 1;
    }

    pid_t pid = fork();
    if (pid == -1) {
        perror(&quot;fork&quot;);
        sem_close(sem);
        sem_unlink(SEM_NAME);
        munmap(mem, sizeof *mem);
        shm_unlink(SHM_NAME);
        return 1;
    }

    for (int i = 0; i &lt; 10000; i++) {
        if (sem_wait(sem) == -1) {
            perror(&quot;sem_wait&quot;);
            exit(1);
        }
        mem-&gt;counter++;
        if (sem_post(sem) == -1) {
            perror(&quot;sem_post&quot;);
            exit(1);
        }
    }

    if (pid == 0) {
        _exit(0);
    }

    if (waitpid(pid, NULL, 0) == -1) {
        perror(&quot;waitpid&quot;);
        return 1;
    }

    printf(&quot;final counter (expect 20000): %d\\n&quot;, mem-&gt;counter);

    if (sem_close(sem) == -1)
        perror(&quot;sem_close&quot;);
    if (sem_unlink(SEM_NAME) == -1)
        perror(&quot;sem_unlink&quot;);
    if (munmap(mem, sizeof *mem) == -1)
        perror(&quot;munmap&quot;);
    if (shm_unlink(SHM_NAME) == -1)
        perror(&quot;shm_unlink&quot;);

    return mem-&gt;counter == 20000 ? 0 : 1;
}
</code></pre>
<p>Without the semaphore, the counter would be far below 20000.</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p>Shared memory maps <strong>identical physical pages</strong> into multiple address spaces —
  zero-copy IPC at the cost of explicit synchronization.</p>
</li>
<li>
<p><strong>POSIX <code>shm_open</code> + <code>mmap</code></strong> is the modern fd-based path; objects live in
  <strong>tmpfs</strong> (<code>/dev/shm</code>).</p>
</li>
<li>
<p><strong>System V <code>shmget</code>/<code>shmat</code></strong> uses integer ids and <code>ftok</code> keys — persistent and
  clunky (Part 4.3).</p>
</li>
<li>
<p><strong><code>MAP_SHARED</code> anonymous + <code>fork()</code></strong> shares until first write (COW).</p>
</li>
<li>Always pair shared writable memory with <strong>semaphores, mutexes, or atomics</strong>.</li>
</ul>

<p>A <strong>pipe</strong> is a unidirectional byte stream connecting two file descriptors in the
same process or across a <code>fork()</code> boundary. The shell&rsquo;s <code>cmd1 | cmd2</code> is built from
<code>pipe()</code> + <code>dup2()</code> + <code>execve()</code> (Parts 1.3, 2.4). <strong>FIFOs</strong> (named pipes) are the
same kernel object with a filesystem path — unrelated processes open them like files.</p>
<hr />
<h2 id="411-pipe-and-pipe2">4.1.1 pipe() and pipe2()</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <unistd.h></h1>
<p>int pipe(int pipefd[2]);
int pipe2(int pipefd[2], int flags);
<code>\`\`
On success: **0**.</code>pipefd[0]<code>= read end,</code>pipefd[1]<code>= write end.
**</code>pipe2<code>flags:**</code>O_NONBLOCK<code>,</code>O_CLOEXEC<code>(Part 2.1 — safe across</code>exec\`).</p>
</blockquote>
<p><img alt="Pipe kernel ring buffer connecting two file descriptors" src="figures/pipe.svg" /></p>
<pre><code>   writer process                kernel                  reader process
   write(pipefd[1], buf, n)  ──▶ ┌──────────────┐  ──▶ read(pipefd[0], ...)
                                 │ ring buffer  │
                                 │  (pipe inode)│
                                 └──────────────┘
</code></pre>
<blockquote>
<p><strong>Under the hood ▸</strong> A pipe is a <strong>pipe inode</strong> with a kernel buffer (capacity
~64 KiB on modern Linux, query with <code>fcntl(F_GETPIPE_SZ)</code>). Data is copied from
writer&rsquo;s user buffer → kernel buffer → reader&rsquo;s user buffer. No disk involved.</p>
</blockquote>
<p><strong>Errors ▸</strong></p>
<table>
<thead>
<tr>
<th><code>errno</code></th>
<th>When</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>EMFILE</code></td>
<td>Process fd limit reached</td>
</tr>
<tr>
<td><code>ENFILE</code></td>
<td>System-wide open file limit</td>
</tr>
<tr>
<td><code>EINVAL</code></td>
<td>Invalid <code>pipe2</code> flags</td>
</tr>
</tbody>
</table>
<hr />
<h2 id="412-blocking-flow-control-and-eof">4.1.2 Blocking, flow control, and EOF</h2>
<pre><code>   buffer empty, reader blocks (unless O_NONBLOCK → EAGAIN)
   buffer full, writer blocks (unless O_NONBLOCK → EAGAIN)
</code></pre>
<p>When <strong>all write ends are closed</strong> and the buffer is drained:</p>
<ul>
<li><code>read()</code> returns <strong>0</strong> — EOF (Part 2.2).</li>
<li>Further <code>write()</code> → <strong><code>SIGPIPE</code></strong> (default: terminate) or <code>-1</code> with <code>EPIPE</code> if
  ignored/handled.</li>

<p><strong>Pitfall ▸</strong> Forgetting to <code>close()</code> unused pipe ends in <code>fork()</code> children causes
EOF never to arrive — readers hang forever because a writer still exists.</p>
<p>Rule after <code>fork()</code>:</p>
<table>
<thead>
<tr>
<th>Process</th>
<th>Close</th>
<th>Keep</th>
</tr>
</thead>
<tbody>
<tr>
<td>Reader child</td>
<td>write end</td>
<td>read end</td>
</tr>
<tr>
<td>Writer parent</td>
<td>read end</td>
<td>write end</td>
</tr>
</tbody>
</table>

<h2 id="413-pipe_buf-and-atomic-writes">4.1.3 PIPE_BUF and atomic writes</h2>
<p>POSIX guarantees writes of <strong>≤ <code>PIPE_BUF</code></strong> bytes (often <strong>4096</strong> on Linux) are
<strong>atomic</strong> if they fit in the buffer — they won&rsquo;t interleave with other writers&rsquo;

<h2 id="414-sigpipe">4.1.4 SIGPIPE</h2>
<pre><code>   reader gone, write end still open

<h2 id="415-named-fifos-mkfifo">4.1.5 Named FIFOs: mkfifo()</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include_1">include <sys/stat.h></h1>
<p>int mkfifo(const char *pathname, mode_t mode);
<code>\`\`
Creates a filesystem node;</code>open(path, O_RDONLY|O_WRONLY)<code>blocks until a peer
opens the other end (unless</code>O_NONBLOCK\`).</p>

<pre><code>   producer                          consumer

        │                                  │
        └──────── same pipe inode ─────────┘
</code></pre>
<p>Unlike anonymous pipes, unrelated processes discover the path via the filesystem
(Part 2.6). Cleanup: <code>unlink("my.fifo")</code> when done.</p>
<p><strong>Trade-offs ▸</strong> FIFOs give shell-friendly names but no random access, no fd passing
(by themselves), and the same byte-stream semantics as pipes.</p>
<hr />
<h2 id="416-shell-pipelines-via-dup2">4.1.6 Shell pipelines via dup2()</h2>
<pre><code>   shell:  ls | wc -l

   pid1 = fork()
   if child1:
       close(p[0]); dup2(p[1], STDOUT_FILENO); close(p[1])
       execve(&quot;ls&quot;, ...)
   pid2 = fork()

close the wrong end before <code>exec</code> so EOF propagates correctly.</p>

<h2 id="417-parent-child-pipe-example">4.1.7 Parent-child pipe example</h2>
<pre><code class="language-c">#include &lt;errno.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;
#include &lt;sys/wait.h&gt;
#include &lt;unistd.h&gt;

static ssize_t write_all(int fd, const void *buf, size_t count) {
    const char *p = buf;
    while (count &gt; 0) {
        ssize_t n = write(fd, p, count);
        if (n == -1) {
            if (errno == EINTR)
                continue;
            return -1;
        }
        p += n;
        count -= (size_t)n;
    }
    return 0;
}

int main(void) {

    if (pipe(pfd) == -1) {
        perror(&quot;pipe&quot;);
        return 1;
    }

    pid_t pid = fork();
    if (pid == -1) {
        perror(&quot;fork&quot;);
        close(pfd[0]);
        close(pfd[1]);
        return 1;
    }

    if (pid == 0) {
        /* child: reader */
        if (close(pfd[1]) == -1) {
            perror(&quot;close write end&quot;);
            _exit(1);
        }

        char buf[256];
        ssize_t n = read(pfd[0], buf, sizeof buf - 1);
        if (n == -1) {
            perror(&quot;read&quot;);
            close(pfd[0]);
            _exit(1);
        }
        buf[n &gt; 0 ? (size_t)n : 0] = '\\0';
        printf(&quot;[child] received: %s (%zd bytes)\\n&quot;, buf, n);

        if (close(pfd[0]) == -1) {
            perror(&quot;close read end&quot;);
            _exit(1);
        }
        _exit(0);
    }

    /* parent: writer */
    if (close(pfd[0]) == -1) {
        perror(&quot;close read end&quot;);
        close(pfd[1]);
        return 1;
    }

    const char msg[] = &quot;hello through the pipe&quot;;
    if (write_all(pfd[1], msg, strlen(msg)) == -1) {
        perror(&quot;write&quot;);
        close(pfd[1]);
        return 1;
    }

    if (close(pfd[1]) == -1) {
        perror(&quot;close write end&quot;);
        return 1;
    }

    if (waitpid(pid, &amp;status, 0) == -1) {

</ul>

<p>A <strong>signal</strong> is a software interrupt: the kernel notifies a process that an event
occurred (terminal key, timer, child exit, segmentation fault, explicit <code>kill()</code>).
Delivery is <strong>asynchronous</strong> — your thread may be interrupted between any two
instructions. That power makes signals essential for shells, daemons, and debuggers,
and dangerous when handlers violate the async-signal-safe rules.</p>
<hr />
<h2 id="421-signal-numbers-and-default-actions">4.2.1 Signal numbers and default actions</h2>
<p>Each signal has a number (<code>SIGINT</code> = 2, <code>SIGTERM</code> = 15, <code>SIGSEGV</code> = 11, …) and a
<strong>default disposition</strong>: terminate, ignore, stop, or continue.</p>
<pre><code>   common signals
   ┌──────────┬────────────────────────────────────────────┐
   │ SIGINT   │ Ctrl+C → terminate (catchable)             │
   │ SIGTERM  │ polite shutdown request                    │
   │ SIGKILL  │ uncatchable forced kill                    │
   │ SIGSTOP  │ uncatchable stop (job control)             │
   │ SIGCHLD  │ child state changed (Part 1.4)             │
   │ SIGSEGV  │ invalid memory access (Part 3.1)           │
   │ SIGPIPE  │ write to closed pipe (Part 4.1)            │
   │ SIGUSR1/2│ user-defined                               │
   └──────────┴────────────────────────────────────────────┘
</code></pre>
<blockquote>
<p><strong>Under the hood ▸</strong> Pending signals live in per-thread <code>task_struct</code> bitmasks.
Delivery happens on return from a syscall or interrupt to user mode — not mid-
instruction unless hardware exception (SIGSEGV, SIGFPE).</p>
</blockquote>
<p><strong>SIGKILL</strong> and <strong>SIGSTOP</strong> cannot be caught, blocked, or ignored — the kernel uses
them to guarantee termination/control.</p>
<hr />
<h2 id="422-sigaction--prefer-over-signal">4.2.2 sigaction() — prefer over signal()</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <signal.h></h1>
<p>int sigaction(int signum, const struct sigaction <em>act,
              struct sigaction </em>oldact);</p>
<p>struct sigaction {
    void     (<em>sa_handler)(int);           /</em> or sa_sigaction with SA_SIGINFO <em>/
    void     (</em>sa_sigaction)(int, siginfo_t <em>, void </em>);
    sigset_t sa_mask;
    int      sa_flags;
};
<code>\`\`
**</code>sa_flags<code>:**</code>SA_RESTART<code>(restart interrupted syscalls),</code>SA_SIGINFO<code>(three-arg handler),</code>SA_RESETHAND<code>(one-shot),</code>SA_NODEFER\` (don&rsquo;t auto-block).</p>
</blockquote>
<p><img alt="Signal delivery from kernel to handler" src="figures/signal-delivery.svg" /></p>
<pre><code>   signal arrives
        │
        ├─ blocked?  → set pending bit, deliver later
        │
        └─ not blocked → save context, run handler, restore (or terminate)
</code></pre>
<p><strong>Pitfall ▸</strong> Legacy <code>signal(2)</code> behaviour varies across Unix; <strong><code>sigaction()</code></strong> is
portable and explicit. Never use <code>signal()</code> in new code.</p>
<p><strong>Errors ▸</strong></p>
<table>
<thead>
<tr>
<th><code>errno</code></th>
<th>When</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>EINVAL</code></td>
<td>Invalid signal number or flags</td>
</tr>
<tr>
<td><code>EFAULT</code></td>
<td>Bad pointer</td>
</tr>
</tbody>
</table>

<h2 id="423-pending-and-blocked-masks">4.2.3 Pending and blocked masks</h2>
<p>Each thread has:</p>
<pre><code>   pending mask   — signals arrived but not yet delivered
   blocked mask   — signals temporarily held (sigprocmask)
</code></pre>
<blockquote>
<p><strong>The call ▸</strong>
<code>c
int sigprocmask(int how, const sigset_t *set, sigset_t *oldset);
int sigpending(sigset_t *set);
int sigemptyset(sigset_t *set);
int sigfillset(sigset_t *set);
int sigaddset(sigset_t *set, int signum);
int sigismember(const sigset_t *set, int signum);</code>
<strong><code>how</code>:</strong> <code>SIG_BLOCK</code>, <code>SIG_UNBLOCK</code>, <code>SIG_SETMASK</code>.</p>
</blockquote>
<p>While handling signal <strong>S</strong>, <strong>S</strong> is automatically blocked unless <code>SA_NODEFER</code>.
Add other signals to <code>sa_mask</code> to block them during the handler.</p>
<hr />
<h2 id="424-async-signal-safety">4.2.4 Async-signal-safety</h2>
<p>Inside a signal handler you may call only <strong>async-signal-safe</strong> functions (see
<code>signal-safety(7)</code>). Safe: <code>read</code>, <code>write</code>, <code>_exit</code>, <code>sem_post</code>, <code>kill</code>. <strong>Not safe:</strong>
<code>printf</code>, <code>malloc</code>, <code>free</code>, most libc — they may hold locks your interrupted code
also needs → deadlock.</p>
<pre><code>   main thread: malloc() holds arena lock

        │

</code></pre>
<p><strong>Trade-offs ▸</strong> Keep handlers minimal: set a <strong><code>volatile sig_atomic_t</code> flag</strong> and
return; main loop does the real work.</p>
<hr />
<h2 id="425-correct-sigaction-handler-with-sig_atomic_t-flag">4.2.5 Correct sigaction handler with sig_atomic_t flag</h2>
<pre><code class="language-c">#include &lt;errno.h&gt;
#include &lt;signal.h&gt;
#include &lt;stdio.h&gt;
#include &lt;unistd.h&gt;

static volatile sig_atomic_t got_usr1 = 0;

static void on_usr1(int signo) {
    (void)signo;
    got_usr1 = 1;   /* only async-signal-safe ops here */
}

int main(void) {
    struct sigaction sa;

    sa.sa_handler = on_usr1;
    sigemptyset(&amp;sa.sa_mask);
    sa.sa_flags = 0;   /* no SA_RESTART needed — we use sleep/poll loop */

    if (sigaction(SIGUSR1, &amp;sa, NULL) == -1) {

        return 1;
    }

    printf(&quot;PID %d: send SIGUSR1 with kill -USR1 %d\\n&quot;, getpid(), getpid());

    while (!got_usr1) {
        if (pause() == -1 &amp;&amp; errno != EINTR) {
            perror(&quot;pause&quot;);
            return 1;
        }
    }

    /* safe to use stdio after handler returns to normal context */
    puts(&quot;main: observed got_usr1 flag, continuing...&quot;);
    return 0;
}
</code></pre>
<p>Test: <code>kill -USR1 &lt;pid&gt;</code> from another shell.</p>

<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include_1">include <signal.h></h1>
<h1 id="include_2">include <sys/types.h></h1>
<p>int kill(pid_t pid, int sig);
int raise(int sig);
int killpg(pid_t pgrp, int sig);
<code>\`\`
**</code>kill(0, sig)<code>** → all processes in caller's process group (Part 1.5).
**</code>kill(-1, sig)\`** → broadcast (restricted; needs privilege for most signals).</p>
</blockquote>
<p><strong>Errors ▸</strong></p>
<table>
<thead>
<tr>
<th><code>errno</code></th>
<th>When</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>ESRCH</code></td>
<td>No such process/group</td>
</tr>
<tr>
<td><code>EINVAL</code></td>
<td>Invalid signal</td>
</tr>
<tr>
<td><code>EPERM</code></td>
<td>Caller lacks permission</td>
</tr>
</tbody>
</table>
<hr />
<h2 id="427-siginfo-and-sa_siginfo">4.2.7 siginfo and SA_SIGINFO</h2>
<p>With <code>SA_SIGINFO</code>, the handler receives <strong><code>siginfo_t</code></strong> — sender PID, fault address
(for <code>SIGSEGV</code>), band event for <code>SIGPOLL</code>, etc.</p>
<pre><code class="language-c">static void on_segv(int sig, siginfo_t *info, void *ctx) {
    (void)ctx;

<code>write()</code> of fixed strings or defers to the main thread.</p>
<hr />
<h2 id="428-restartability-and-eintr">4.2.8 Restartability and EINTR</h2>
<p>Slow syscalls (<code>read</code>, <code>connect</code>, <code>sleep</code>) may return <strong>-1</strong> with <strong><code>EINTR</code></strong> if a
handler runs without <strong><code>SA_RESTART</code></strong>.</p>
<pre><code>   read() blocked

</code></pre>
<p>Options:</p>
<ul>
<li>Set <strong><code>SA_RESTART</code></strong> on handlers that shouldn&rsquo;t interrupt I/O.</li>
<li>Loop on <code>EINTR</code> manually (Part 2.2).</li>

</ul>
<p><strong>Systems ▸</strong> <code>signalfd</code> + <code>epoll</code> is how many servers avoid signal handlers in hot
paths entirely — signals become readable events on an fd.</p>

<ul>
<li>
<p>Signals are asynchronous notifications identified by number; defaults include

</li>
<li>
<p>Install handlers with <strong><code>sigaction()</code></strong>, not <code>signal()</code>; <strong><code>SIGKILL</code>/<code>SIGSTOP</code></strong>

</ul>

<p>Before POSIX IPC (Part 4.4), Unix System V gave us a trio of kernel-persistent
objects: <strong>message queues</strong>, <strong>semaphore sets</strong>, and <strong>shared memory</strong> (Part 3.5).

<h2 id="431-the-ftokkey-model">4.3.1 The ftok/key model</h2>
<pre><code>   ftok(&quot;/some/path&quot;, proj_id)  →  key_t (32-bit, not guaranteed unique)
        │
        ├─ msgget(key, ...)   → msqid
        ├─ semget(key, ...)   → semid
        └─ shmget(key, ...)   → shmid

<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <sys/ipc.h></h1>
<p>key_t ftok(const char <em>pathname, int proj_id);
<code>\`\`
**</code>pathname<code>** must name an existing file the kernel can stat. **</code>proj_id\`</em>* — low
8 bits distinguish keys for the same file.</p>
</blockquote>
<p><strong><code>IPC_PRIVATE</code></strong> — special key meaning &ldquo;create a private object visible only to
caller&rsquo;s descendants until passed explicitly&rdquo;:</p>
<pre><code class="language-c">int id = msgget(IPC_PRIVATE, IPC_CREAT | 0666);
</code></pre>
<p><strong>Pitfall ▸</strong> <strong>Key collisions</strong> — two unrelated programs using the same path +
<code>proj_id</code> attach to the <strong>same</strong> queue. Always use unique paths, <code>IPC_EXCL</code>, or

<hr />
<h2 id="432-message-queues">4.3.2 Message queues</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include_1">include <sys/msg.h></h1>
<p>int msgget(key_t key, int msgflg);
int msgsnd(int msqid, const void <em>msgp, size_t msgsz, int msgflg);
ssize_t msgrcv(int msqid, void </em>msgp, size_t msgsz, long msgtyp, int msgflg);

<thead>
<tr>
<th><code>msgflg</code> (send/recv)</th>
<th>Effect</th>

<tbody>
<tr>
<td><code>IPC_NOWAIT</code></td>

<tr>

<p><strong>Errors ▸</strong></p>
<table>
<thead>
<tr>
<th><code>errno</code></th>
<th>When</th>
</tr>
</thead>
<tbody>
<tr>

<h2 id="433-semaphores">4.3.3 Semaphores</h2>
<p>System V semaphores are <strong>sets</strong> of counters, not POSIX-style binary semaphores.</p>

<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include_2">include <sys/sem.h></h1>
<p>int semget(key_t key, int nsems, int semflg);

<h2 id="435-ipcs-and-ipcrm">4.3.5 ipcs and ipcrm</h2>
<pre><code class="language-bash">ipcs -a                    # list all SysV msg/sem/shm
