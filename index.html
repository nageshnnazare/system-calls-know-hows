handler (Part 7.2). Not a substitute for <code>read()</code> — race window between ioctl and
read as more data arrives.</p>
<hr />
<h2 id="837-errors">8.3.7 Errors</h2>
<p><strong>Errors ▸</strong></p>
<table>
<thead>
<tr>
<th>errno</th>
<th>when</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>ENOTTY</code></td>
<td>fd doesn&rsquo;t support this ioctl (wrong device type)</td>
</tr>
<tr>
<td><code>EINVAL</code></td>
<td>unrecognized request or bad argument</td>
</tr>
<tr>
<td><code>EFAULT</code></td>
<td>bad pointer (kernel couldn&rsquo;t copy)</td>
</tr>
<tr>
<td><code>EPERM</code></td>
<td>operation not permitted (caps / namespace)</td>
</tr>
<tr>
<td><code>EINTR</code></td>
<td>interrupted by signal — retry</td>
</tr>
</tbody>
</table>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p><code>ioctl(fd, request, argp)</code> is the control-plane syscall for device/tty/socket
  operations that don&rsquo;t fit read/write.</p>
</li>
<li>
<p>Requests encode direction, size, type, and number via <code>_IOR</code>/<code>_IOW</code>/<code>_IOWR</code> macros.</p>

</li>
<li>

  and prefer newer sysfs/netlink APIs when available.</p>
</li>
</ul>

you need to <strong>observe</strong> boundary crossings without recompiling. Linux stacks four
complementary tools: <strong>strace/ltrace</strong> (syscall/library trace via ptrace),
<strong>ftrace</strong> (kernel static tracepoints), <strong>perf</strong> (hardware counters + sampling),
and <strong>eBPF</strong> (programmable in-kernel probes). Part 7.5 introduced <code>strace -c</code> and
<code>perf stat</code>; this chapter maps when each tool wins and what happens under the hood.</p>

<h2 id="841-the-observability-stack">8.4.1 The observability stack</h2>
<pre><code>   question                          tool
   ────────────────────────────────  ─────────────────────
   &quot;which syscalls, in what order?&quot;  strace
   &quot;which libc calls?&quot;               ltrace
   &quot;kernel function flow?&quot;           ftrace
   &quot;CPU cycles, cache misses?&quot;       perf
   &quot;custom kernel/user probes?&quot;      eBPF (bpftrace, bcc)
</code></pre>
<pre><code>   user program
        │
        │  strace: ptrace stops child at syscall entry/exit
        │  ltrace:  PLT hooks + ptrace
        ▼
   kernel ── ftrace: mcount/tracepoints on syscalls, sched, block
        │
        │  perf: PMU counters + ring buffer samples
        │  eBPF: verified programs on kprobes/tracepoints/maps
        ▼
   analysis (text log, perf report, bpftrace output)
</code></pre>
<hr />
<h2 id="842-strace-and-ltrace--ptrace-under-the-hood">8.4.2 strace and ltrace — ptrace under the hood</h2>

<p><strong>The call ▸</strong> (ptrace basics)
\`\`\`c</p>
<h1 id="include">include <sys/ptrace.h></h1>

            void <em>addr, void </em>data);
\`\`\`</p>

<pre><code>   tracee:  ... SYSCALL entry ──▶ STOP ──▶ strace reads rax, rdi, rsi ...

<thead>

<th>when</th>

<p>Beyond strace, debuggers (<code>gdb</code>) use ptrace:</p>
<table>
<thead>

<th>request</th>
<th>effect</th>

<tbody>

<p><strong>eBPF</strong> runs verified bytecode in the kernel on events:</p>
<pre><code>   kprobe/sys_read  ──▶  bpf program  ──▶  map (counts, histogram)
   tracepoint/sched/sched_switch
   uprobe on libc:malloc
</code></pre>

<pre><code>   ┌────────────────────┬─────────────────────────────────────────┐
   │ Scenario           │ Start here                              │
   ├────────────────────┼─────────────────────────────────────────┤
   │ Wrong errno/order  │ strace -e trace=...                   │
   │ Hot syscall count  │ strace -c or perf stat syscalls:*       │

<ul>
<li>
<p>strace/ltrace use ptrace to stop processes at syscalls/library calls — invaluable
  for debugging, too slow for production.</p>

   / on host                            / on container rootfs (MNT ns)

</code></pre>

<tr>
<th>namespace</th>
<th>flag</th>
<th>isolates</th>

<p>cgroups <strong>account and limit</strong> resources: CPU, memory, I/O, pids.</p>
<pre><code>   /sys/fs/cgroup/                    (cgroup v2 unified tree)

   │   └── docker-abc.scope/

   │       ├── memory.max             hard memory cap

<table>
<thead>
<tr>
<th>controller</th>
<th>limits</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>cpu</code></td>
<td>weight, max bandwidth (<code>cpu.max</code>)</td>

<tr>
<td><code>memory</code></td>
<td><code>memory.max</code>, swap, OOM policy</td>
</tr>
<tr>
<td><code>io</code></td>
<td>wbps/rbps throttling</td>
</tr>
<tr>
<td><code>pids</code></td>
<td>process count cap</td>
</tr>
</tbody>
</table>
<p>Join a cgroup by writing PID to <code>cgroup.procs</code>:</p>
<pre><code class="language-c">#include &lt;fcntl.h&gt;

    ssize_t n = write(fd, line, strlen(line));

<p><strong>Under the hood ▸</strong> Each cgroup is a <code>css_set</code> linking tasks to controller
state. OOM killer uses cgroup memory pressure; CPU scheduler uses cgroup weights.</p>
</blockquote>
<p>Part 8.1 <code>/proc/[pid]/cgroup</code> shows a process&rsquo;s cgroup path.</p>
<hr />
<h2 id="855-how-dockerrunc-combine-them">8.5.5 How Docker/runc combine them</h2>
<pre><code>   docker run nginx
        │
        ▼
   containerd ──▶ runc
        │
        ├─ namespaces: pid, net, mnt, uts, ipc, (user)
        ├─ cgroups v2: memory.max, cpu.max, pids.max
        ├─ capabilities: drop most, keep NET_BIND_SERVICE etc.
        ├─ seccomp: default Docker profile (~300 allowed syscalls)
        └─ rootfs: overlayfs mount (Part 2.7 VFS)
</code></pre>
<p>The running container is <strong>one or more processes</strong> on the host kernel — not a VM.
<code>docker exec</code> calls <code>setns</code> into existing namespaces.</p>

kill inside the cgroup, not necessarily protecting host if misconfigured.</p>

<h2 id="856-user-namespace-and-id-maps">8.5.6 USER namespace and ID maps</h2>
<p>Unprivileged containers map container root (UID 0) to unprivileged host UID:</p>
<pre><code>   /proc/PID/uid_map:
   0  100000  1        # container 0 → host 100000
   1  100001  65535
</code></pre>
<p>Write maps once per USER ns. Enables root-in-container without host root for many
operations — but <code>/proc</code>, device nodes, and mounts still gate real privilege.</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p>Namespaces (PID, NET, MNT, UTS, IPC, USER, cgroup, time) give processes isolated
  views of IDs, filesystem, network, and hostname.</p>
</li>
<li>
<p><code>clone(CLONE_NEW*)</code>, <code>unshare</code>, and <code>setns</code> create or join namespaces; containers

</li>

</li>
<li>Docker/runc stack namespaces, cgroups, seccomp, and capabilities into the familiar
  <code>docker run</code> workflow.</li>
</ul>

        ├─ KILL    ──▶ SIGSYS, process dies
        ├─ TRAP    ──▶ SIGSYS to tracer (ptrace)
        └─ TRACE   ──▶ notify supervisor (advanced)
</code></pre>
<table>
<thead>
<tr>
<th>mode</th>
<th>set via</th>
<th>behavior</th>
</tr>
</thead>
<tbody>
<tr>
<td>disabled</td>
<td>default</td>

<h1 id="include_2">include <sys/syscall.h></h1>

<p>Filter mode loads a <strong>Berkeley Packet Filter</strong> program evaluated on each syscall:</p>
<pre><code>   BPF program inputs:

<p><strong>Under the hood ▸</strong> The BPF verifier ensures the program terminates and doesn&rsquo;t

<p>Install filter:</p>
<pre><code class="language-c">#include &lt;linux/filter.h&gt;

<table>
<thead>
<tr>
<th>action</th>
<th>effect</th>

<tr>
<td><code>SECCOMP_RET_TRAP</code></td>

seccomp_release(ctx);

<p>Traditional root = all privileges. Linux <strong>capabilities</strong> split them:</p>
<pre><code>   CAP_NET_BIND_SERVICE   bind port &lt; 1024

   CAP_SYS_PTRACE         ptrace other processes
   CAP_DAC_OVERRIDE       bypass file permission checks
   ...

<pre><code>   Chrome renderer     strict profile — no filesystem, limited ioctl

     + capabilities (privilege minimization)
     + LSM (MAC policies on files/sockets)

<h2 id="the--1--errno-contract-quick-recap">The -1 / errno contract (quick recap)</h2>
<p>Almost every libc syscall wrapper follows the same pattern:</p>
<pre><code class="language-c">ssize_t n = read(fd, buf, count);
if (n == -1) {
    /* errno is valid *only now* — capture before other calls */
    if (errno == EINTR) { /* retry? */ }
    else { perror(&quot;read&quot;); }
}
</code></pre>
<p>On the kernel side, failure is encoded as a negative errno in <code>%rax</code>; libc translates
that to <code>return -1; errno = …</code>. Exceptions (<code>mmap</code> → <code>MAP_FAILED</code>, <code>getpriority</code>
ambiguous <code>-1</code>) are documented in Part 0.4 and in the per-syscall <strong>Errors ▸</strong> tables
throughout the guide.</p>
<p><code>errno</code> is <strong>thread-local</strong> (TLS). Another thread&rsquo;s syscalls do not clobber yours, but
signal handlers and library calls between your failure return and your <code>errno</code> read can.</p>

<h2 id="eintr--interrupted-system-calls">EINTR — interrupted system calls</h2>
<p><code>EINTR</code> means a <strong>signal was delivered</strong> while the thread was blocked inside the
kernel waiting for a slow operation — not that the operation permanently failed.</p>
<pre><code>   read(fd, buf, n)  ──blocking──▶  kernel waits
                                        │
                                   signal (e.g. SIGCHLD, SIGWINCH)
                                        │
                                   return -1, errno = EINTR
</code></pre>
<p><strong>When to retry:</strong> For idempotent or restart-safe syscalls (<code>read</code>, <code>write</code>, <code>close</code>,
<code>connect</code> in some setups, <code>poll</code>, <code>nanosleep</code>), loop on <code>EINTR</code> unless you
<em>intentionally</em> use signals to break out of I/O.</p>
<pre><code class="language-c">ssize_t n;
do {
    n = read(fd, buf, count);
} while (n == -1 &amp;&amp; errno == EINTR);
</code></pre>
<p><strong>When not to retry blindly:</strong> If the syscall is not restart-safe or partial progress
occurred, consult the man page. Do <strong>not</strong> retry on <code>EINVAL</code>, <code>EBADF</code>, etc.</p>
<p><strong><code>SA_RESTART</code>:</strong> Setting <code>SA_RESTART</code> in <code>sigaction()</code> (Part 4.2) asks the kernel to
automatically restart certain syscalls so <code>EINTR</code> never reaches user space. Robust
libraries still handle <code>EINTR</code> explicitly — do not rely on <code>SA_RESTART</code> alone.</p>
<p><strong>glibc helper:</strong> <code>TEMP_FAILURE_RETRY(expr)</code> retries once on <code>EINTR</code> (GNU extension).</p>
<p>See <a href="../00-foundations/04-errno-and-error-handling.md">Part 0.4.5</a> and
<a href="../04-ipc/02-signals.md">Part 4.2</a>.</p>
<hr />
<h2 id="eagain--ewouldblock--non-blocking-io">EAGAIN / EWOULDBLOCK — non-blocking I/O</h2>
<p>On Linux, <code>EAGAIN</code> and <code>EWOULDBLOCK</code> are the <strong>same value</strong> (11). They mean: the
operation would block, but the fd is in <strong>non-blocking</strong> mode (or the resource is
temporarily unavailable).</p>
<p>Typical cases:</p>
<table>

#include &lt;sys/stat.h&gt;

#define TEST_FILE &quot;test_syscall.txt&quot;
#define BUF_SIZE 1024

void print_file_info(const char *filename) {
    struct stat sb;

    if (stat(filename, &amp;sb) == -1) {
        perror(&quot;stat&quot;);
        return;
    }

    printf(&quot;\\n=== File Information: %s ===\\n&quot;, filename);
    printf(&quot;Inode: %lu\\n&quot;, sb.st_ino);
    printf(&quot;Size: %ld bytes\\n&quot;, sb.st_size);
    printf(&quot;Blocks: %ld x %ld = %ld bytes\\n&quot;, 
           sb.st_blocks, (long)sb.st_blksize, 
           sb.st_blocks * 512);
    printf(&quot;Links: %lu\\n&quot;, sb.st_nlink);
    printf(&quot;Permissions: %o\\n&quot;, sb.st_mode &amp; 0777);

    char *type;
    if (S_ISREG(sb.st_mode))       type = &quot;Regular file&quot;;
    else if (S_ISDIR(sb.st_mode))  type = &quot;Directory&quot;;
    else if (S_ISCHR(sb.st_mode))  type = &quot;Character device&quot;;
    else if (S_ISBLK(sb.st_mode))  type = &quot;Block device&quot;;
    else if (S_ISFIFO(sb.st_mode)) type = &quot;FIFO/pipe&quot;;
    else if (S_ISLNK(sb.st_mode))  type = &quot;Symbolic link&quot;;
    else if (S_ISSOCK(sb.st_mode)) type = &quot;Socket&quot;;
    else                           type = &quot;Unknown&quot;;

    printf(&quot;Type: %s\\n&quot;, type);
    printf(&quot;Last modified: %s&quot;, ctime(&amp;sb.st_mtime));
}

    int fd;
    ssize_t bytes_written, bytes_read;
    char write_buf[] = &quot;Hello from low-level I/O!\\n&quot;
                       &quot;This is line 2.\\n&quot;
                       &quot;This is line 3.\\n&quot;;

    off_t offset;

    // 1. Open/Create file
    printf(&quot;\\n1. Creating file with open()...\\n&quot;);

    if (fd == -1) {
        perror(&quot;open&quot;);
        return 1;
    }
    printf(&quot;   File descriptor: %d\\n&quot;, fd);

    if (bytes_written == -1) {

    if (bytes_read &gt; 0) {
        read_buf[bytes_read] = '\\0';
        printf(&quot;%s&quot;, read_buf);
    }
    printf(&quot;   ---\\n&quot;);
    printf(&quot;   Read %zd bytes\\n&quot;, bytes_read);

    // 5. lseek demo
    printf(&quot;\\n5. Using lseek()...\\n&quot;);

    printf(&quot;   File size: %ld bytes\\n&quot;, offset);

    bytes_read = read(fd, read_buf, 20);
    read_buf[bytes_read] = '\\0';
    printf(&quot;   Reading from offset 7: \\&quot;%s\\&quot;\\n&quot;, read_buf);

    print_file_info(TEST_FILE);

    int stdout_copy = dup(STDOUT_FILENO);  // Save stdout

    int fd_write = open(&quot;redirect_output.txt&quot;, O_WRONLY | O_CREAT | O_TRUNC, 0644);

    close(fd_write);

    printf(&quot;This goes to the file!\\n&quot;);
    printf(&quot;And this too!\\n&quot;);

    dup2(stdout_copy, STDOUT_FILENO);  // Restore stdout
    close(stdout_copy);

    printf(&quot;   Output redirected to redirect_output.txt\\n&quot;);

    // 8. fcntl demo
    printf(&quot;\\n7. Using fcntl()...\\n&quot;);
    int flags = fcntl(fd, F_GETFL);
    if (flags == -1) {
        perror(&quot;fcntl F_GETFL&quot;);
    } else {
        printf(&quot;   File flags: &quot;);
        if ((flags &amp; O_ACCMODE) == O_RDONLY) printf(&quot;O_RDONLY &quot;);
        if ((flags &amp; O_ACCMODE) == O_WRONLY) printf(&quot;O_WRONLY &quot;);
        if ((flags &amp; O_ACCMODE) == O_RDWR)   printf(&quot;O_RDWR &quot;);
        printf(&quot;\\n&quot;);
    }

    // Cleanup
    close(fd);

    printf(&quot;\\n=== Demo Complete ===\\n&quot;);
    printf(&quot;Created files: %s, redirect_output.txt\\n&quot;, TEST_FILE);

    return 0;
}

<pre><code class="language-c">/*
 * memory_demo.c - Demonstrates memory management system calls
 * 
 * Compile: gcc -o memory_demo memory_demo.c
 * Usage: ./memory_demo
 */

#include &lt;unistd.h&gt;
#include &lt;sys/mman.h&gt;
#include &lt;sys/stat.h&gt;
#include &lt;fcntl.h&gt;
#include &lt;stdio.h&gt;
#include &lt;string.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;errno.h&gt;

void print_separator(const char *title) {
    printf(&quot;\\n=== %s ===\\n&quot;, title);
}

void demonstrate_brk_sbrk() {
    print_separator(&quot;brk/sbrk Demo&quot;);

    void *current_brk = sbrk(0);
    printf(&quot;Current program break: %p\\n&quot;, current_brk);

    // Allocate 4KB
    size_t size = 4096;
    void *new_space = sbrk(size);

    if (new_space == (void *)-1) {
        perror(&quot;sbrk&quot;);
        return;
    }

    printf(&quot;Allocated %zu bytes at: %p\\n&quot;, size, new_space);

    void *new_brk = sbrk(0);
    printf(&quot;New program break: %p\\n&quot;, new_brk);
    printf(&quot;Difference: %ld bytes\\n&quot;, (char *)new_brk - (char *)current_brk);

    // Use the allocated memory
    char *buffer = (char *)new_space;
    strcpy(buffer, &quot;Hello from heap!&quot;);
    printf(&quot;Content: %s\\n&quot;, buffer);
}

void demonstrate_mmap() {
    print_separator(&quot;mmap Anonymous Memory Demo&quot;);

    size_t size = 4096;  // One page

    // Allocate anonymous memory
    void *memory = mmap(NULL, size,
                       PROT_READ | PROT_WRITE,
                       MAP_PRIVATE | MAP_ANONYMOUS,
                       -1, 0);

    if (memory == MAP_FAILED) {
        perror(&quot;mmap&quot;);
        return;
    }

    printf(&quot;Allocated %zu bytes at: %p\\n&quot;, size, memory);

    // Use the memory
    char *data = (char *)memory;
    strcpy(data, &quot;Hello from mmap!&quot;);
    printf(&quot;Content: %s\\n&quot;, data);

    // Check memory is zeroed
    int is_zeroed = 1;
    for (size_t i = strlen(data) + 1; i &lt; size; i++) {
        if (data[i] != 0) {
            is_zeroed = 0;
            break;
        }
    }
    printf(&quot;Remaining memory is zero-filled: %s\\n&quot;, is_zeroed ? &quot;Yes&quot; : &quot;No&quot;);

    // Cleanup
    if (munmap(memory, size) == -1) {
        perror(&quot;munmap&quot;);
    } else {
        printf(&quot;Memory unmapped successfully\\n&quot;);
    }
}

void demonstrate_mmap_file() {
    print_separator(&quot;mmap File Mapping Demo&quot;);

    const char *filename = &quot;mmap_test.txt&quot;;
    const char *content = &quot;This is mapped file content!\\nLine 2 here.\\n&quot;;

    // Create file
    FILE *fp = fopen(filename, &quot;w&quot;);
    if (fp == NULL) {
        perror(&quot;fopen&quot;);
        return;
    }
    fwrite(content, 1, strlen(content), fp);
    fclose(fp);

    // Open file for mapping
    int fd = open(filename, O_RDWR);
    if (fd == -1) {
        perror(&quot;open&quot;);
        return;
    }

    struct stat sb;
    if (fstat(fd, &amp;sb) == -1) {
        perror(&quot;fstat&quot;);
        close(fd);
        return;
    }

    printf(&quot;File size: %ld bytes\\n&quot;, sb.st_size);

    // Map file into memory
    char *mapped = mmap(NULL, sb.st_size,
                       PROT_READ | PROT_WRITE,
                       MAP_SHARED,
                       fd, 0);

    if (mapped == MAP_FAILED) {
        perror(&quot;mmap&quot;);
        close(fd);
        return;
    }

    close(fd);  // Can close fd after mapping

    printf(&quot;File mapped at: %p\\n&quot;, (void *)mapped);
    printf(&quot;Original content:\\n%.*s\\n&quot;, (int)sb.st_size, mapped);

    // Modify through mapping
    if (sb.st_size &gt; 5) {
        mapped[0] = 't';  // &quot;This&quot; -&gt; &quot;this&quot;
        mapped[5] = 'I';  // &quot;is&quot; -&gt; &quot;Is&quot;
    }

    // Sync changes to disk
    if (msync(mapped, sb.st_size, MS_SYNC) == -1) {
        perror(&quot;msync&quot;);
    }

    printf(&quot;Modified content:\\n%.*s\\n&quot;, (int)sb.st_size, mapped);
    printf(&quot;Changes written to file via mmap!\\n&quot;);

    // Cleanup
    munmap(mapped, sb.st_size);
}

void demonstrate_mprotect() {
    print_separator(&quot;mprotect Demo&quot;);

    size_t page_size = sysconf(_SC_PAGESIZE);
    printf(&quot;Page size: %zu bytes\\n&quot;, page_size);

    // Allocate memory with read/write
    char *memory = mmap(NULL, page_size,
                       PROT_READ | PROT_WRITE,
                       MAP_PRIVATE | MAP_ANONYMOUS,
                       -1, 0);

    if (memory == MAP_FAILED) {
        perror(&quot;mmap&quot;);
        return;
    }

    // Write to memory (OK)
    strcpy(memory, &quot;Read-Write Memory&quot;);
    printf(&quot;Wrote: %s\\n&quot;, memory);

    // Change to read-only
    printf(&quot;Changing to read-only with mprotect()...\\n&quot;);
    if (mprotect(memory, page_size, PROT_READ) == -1) {
        perror(&quot;mprotect&quot;);
        munmap(memory, page_size);
        return;
    }

    // Read from memory (OK)
    printf(&quot;Read: %s\\n&quot;, memory);

    printf(&quot;Memory is now read-only\\n&quot;);
    printf(&quot;(Attempting write would cause SIGSEGV)\\n&quot;);

    // Uncomment to test (will crash):
    // memory[0] = 'r';

    // Cleanup
    munmap(memory, page_size);
}

void demonstrate_memory_info() {
    print_separator(&quot;Memory Information&quot;);

    long page_size = sysconf(_SC_PAGESIZE);
    long phys_pages = sysconf(_SC_PHYS_PAGES);
    long avail_pages = sysconf(_SC_AVPHYS_PAGES);

    printf(&quot;Page size: %ld bytes (%ld KB)\\n&quot;, page_size, page_size / 1024);
    printf(&quot;Physical pages: %ld\\n&quot;, phys_pages);
    printf(&quot;Total RAM: %ld MB\\n&quot;, (phys_pages * page_size) / (1024 * 1024));
    printf(&quot;Available pages: %ld\\n&quot;, avail_pages);
    printf(&quot;Available RAM: %ld MB\\n&quot;, (avail_pages * page_size) / (1024 * 1024));
}

int main() {
    printf(&quot;=== Memory Management System Calls Demo ===\\n&quot;);

    demonstrate_brk_sbrk();
    demonstrate_mmap();
    demonstrate_mmap_file();
    demonstrate_mprotect();
    demonstrate_memory_info();

    printf(&quot;\\n=== Demo Complete ===\\n&quot;);
    printf(&quot;Created file: mmap_test.txt\\n&quot;);

    return 0;
}

<pre><code class="language-c">/*
 * pipe_demo.c - Demonstrates pipe system calls
 * 
 * Compile: gcc -o pipe_demo pipe_demo.c
 * Usage: ./pipe_demo
 */

#include &lt;unistd.h&gt;
#include &lt;stdio.h&gt;
#include &lt;string.h&gt;
#include &lt;sys/wait.h&gt;
#include &lt;stdlib.h&gt;

void simple_pipe_demo() {
    printf(&quot;\\n=== Simple Pipe Demo ===\\n&quot;);

    int pipefd[2];
    pid_t pid;
    char write_msg[] = &quot;Hello through pipe!&quot;;
    char read_msg[100];

    if (pipe(pipefd) == -1) {
        perror(&quot;pipe&quot;);
        return;
    }

    printf(&quot;Pipe created: read_fd=%d, write_fd=%d\\n&quot;, pipefd[0], pipefd[1]);

    pid = fork();

    if (pid == -1) {
        perror(&quot;fork&quot;);
        return;
    }

    if (pid == 0) {
        // Child - reader
        close(pipefd[1]);  // Close write end

        printf(&quot;[Child] Waiting to read from pipe...\\n&quot;);
        ssize_t n = read(pipefd[0], read_msg, sizeof(read_msg) - 1);

        if (n &gt; 0) {
            read_msg[n] = '\\0';
            printf(&quot;[Child] Received: '%s' (%zd bytes)\\n&quot;, read_msg, n);
        }

        close(pipefd[0]);
        exit(0);
    }
    else {
        // Parent - writer
        close(pipefd[0]);  // Close read end

        printf(&quot;[Parent] Sending: '%s'\\n&quot;, write_msg);
        sleep(1);  // Delay to show child is waiting

        write(pipefd[1], write_msg, strlen(write_msg));

        close(pipefd[1]);
        wait(NULL);
        printf(&quot;[Parent] Child has finished\\n&quot;);
    }
}

void bidirectional_pipe_demo() {
    printf(&quot;\\n=== Bidirectional Communication (2 Pipes) ===\\n&quot;);

    int pipe1[2];  // Parent to child
    int pipe2[2];  // Child to parent
    pid_t pid;
    char msg[100];

    if (pipe(pipe1) == -1 || pipe(pipe2) == -1) {
        perror(&quot;pipe&quot;);
        return;
    }

    pid = fork();

    if (pid == 0) {
        // Child
        close(pipe1[1]);  // Close unused write end of pipe1
        close(pipe2[0]);  // Close unused read end of pipe2

        // Read from parent
        read(pipe1[0], msg, sizeof(msg));
        printf(&quot;[Child] Received from parent: %s\\n&quot;, msg);
        close(pipe1[0]);

        // Send to parent
        char reply[] = &quot;Hi Parent!&quot;;
        write(pipe2[1], reply, strlen(reply) + 1);
        close(pipe2[1]);

        exit(0);
    }
    else {
        // Parent
        close(pipe1[0]);  // Close unused read end of pipe1
        close(pipe2[1]);  // Close unused write end of pipe2

        // Send to child
        char greeting[] = &quot;Hello Child!&quot;;
        write(pipe1[1], greeting, strlen(greeting) + 1);
        close(pipe1[1]);

        // Read from child
        read(pipe2[0], msg, sizeof(msg));
        printf(&quot;[Parent] Received from child: %s\\n&quot;, msg);
        close(pipe2[0]);

        wait(NULL);
    }
}

void pipe_exec_demo() {
    printf(&quot;\\n=== Pipe with exec() - Implementing: ls | wc -l ===\\n&quot;);

    int pipefd[2];
    pid_t pid1, pid2;

    if (pipe(pipefd) == -1) {
        perror(&quot;pipe&quot;);
        return;
    }

    // First child: ls -l
    pid1 = fork();
    if (pid1 == 0) {
        close(pipefd[0]);  // Close read end
        dup2(pipefd[1], STDOUT_FILENO);  // Redirect stdout to pipe
        close(pipefd[1]);

        execlp(&quot;ls&quot;, &quot;ls&quot;, &quot;-l&quot;, NULL);
        perror(&quot;execlp ls&quot;);
        exit(1);
    }

    // Second child: wc -l
    pid2 = fork();
    if (pid2 == 0) {
        close(pipefd[1]);  // Close write end
        dup2(pipefd[0], STDIN_FILENO);  // Redirect stdin from pipe
        close(pipefd[0]);

        execlp(&quot;wc&quot;, &quot;wc&quot;, &quot;-l&quot;, NULL);
        perror(&quot;execlp wc&quot;);
        exit(1);
    }

    // Parent
    close(pipefd[0]);
    close(pipefd[1]);

    waitpid(pid1, NULL, 0);
    waitpid(pid2, NULL, 0);
}

void pipe_capacity_demo() {
    printf(&quot;\\n=== Pipe Capacity Demo ===\\n&quot;);

    int pipefd[2];

    if (pipe(pipefd) == -1) {
        perror(&quot;pipe&quot;);
        return;
    }

    // Try to get pipe capacity (Linux-specific)
    #ifdef F_GETPIPE_SZ
    long capacity = fcntl(pipefd[0], F_GETPIPE_SZ);
    if (capacity != -1) {
        printf(&quot;Pipe capacity: %ld bytes (%ld KB)\\n&quot;, 
               capacity, capacity / 1024);
    }
    #else
    printf(&quot;Pipe capacity query not supported on this system\\n&quot;);
    printf(&quot;Typical pipe capacity: 64 KB\\n&quot;);
    #endif

    close(pipefd[0]);
    close(pipefd[1]);
}

int main() {
    printf(&quot;=== Pipe System Calls Demo ===\\n&quot;);

    simple_pipe_demo();
    bidirectional_pipe_demo();
    pipe_exec_demo();
    pipe_capacity_demo();

    printf(&quot;\\n=== Demo Complete ===\\n&quot;);

    return 0;
}

  { name: `59. Examples / Process Manager`, path: `examples/process_manager.c`, dir: `examples`, words: 275, mins: 1, body: `<h1 id="process_managerc">process_manager.c</h1>
<pre><code class="language-c">/*
 * process_manager.c - Demonstrates process management system calls
 * 
 * Compile: gcc -o process_manager process_manager.c
 * Usage: ./process_manager
 */

#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;unistd.h&gt;
#include &lt;sys/types.h&gt;
#include &lt;sys/wait.h&gt;
#include &lt;sys/resource.h&gt;
#include &lt;errno.h&gt;
#include &lt;string.h&gt;

void print_process_info() {
    printf(&quot;PID: %d, PPID: %d, PGID: %d, SID: %d\\n&quot;,
           getpid(), getppid(), getpgid(0), getsid(0));
}

void child_task(int child_num, int sleep_time) {
    printf(&quot;[Child %d] Started - &quot;, child_num);
    print_process_info();

    printf(&quot;[Child %d] Working for %d seconds...\\n&quot;, child_num, sleep_time);
    sleep(sleep_time);

    printf(&quot;[Child %d] Exiting with status %d\\n&quot;, child_num, child_num);
    exit(child_num);
}

int main() {
    pid_t pids[3];
    int status;
    struct rusage usage;

    printf(&quot;=== Process Manager Demo ===\\n\\n&quot;);
    printf(&quot;[Parent] Started - &quot;);
    print_process_info();

    // Create 3 child processes
    for (int i = 0; i &lt; 3; i++) {
        pids[i] = fork();

        if (pids[i] &lt; 0) {
            perror(&quot;fork&quot;);
            exit(1);
        }
        else if (pids[i] == 0) {
            // Child process
            child_task(i + 1, i + 2);  // Sleep 2, 3, 4 seconds
            // Never reaches here
        }
        else {
            // Parent process
            printf(&quot;[Parent] Created child %d with PID %d\\n&quot;, i + 1, pids[i]);
        }
    }

    // Parent waits for all children
    printf(&quot;\\n[Parent] Waiting for children to complete...\\n\\n&quot;);

    for (int i = 0; i &lt; 3; i++) {
        pid_t child_pid = wait(&amp;status);

        if (child_pid == -1) {
            perror(&quot;wait&quot;);
            continue;
        }

        printf(&quot;[Parent] Child PID %d terminated\\n&quot;, child_pid);

        if (WIFEXITED(status)) {
            printf(&quot;         Exit status: %d\\n&quot;, WEXITSTATUS(status));
        }
        else if (WIFSIGNALED(status)) {
            printf(&quot;         Killed by signal: %d\\n&quot;, WTERMSIG(status));
        }
    }

    // Get resource usage
    if (getrusage(RUSAGE_CHILDREN, &amp;usage) == 0) {
        printf(&quot;\\n[Parent] Children resource usage:\\n&quot;);
        printf(&quot;         User CPU time: %ld.%06ld sec\\n&quot;,
               usage.ru_utime.tv_sec, usage.ru_utime.tv_usec);
        printf(&quot;         System CPU time: %ld.%06ld sec\\n&quot;,
               usage.ru_stime.tv_sec, usage.ru_stime.tv_usec);
    }

    printf(&quot;\\n[Parent] All children completed. Exiting.\\n&quot;);
    return 0;
}

  { name: `60. Examples / Resource Limits`, path: `examples/resource_limits.c`, dir: `examples`, words: 565, mins: 3, body: `<h1 id="resource_limitsc">resource_limits.c</h1>
<pre><code class="language-c">/*
 * resource_limits.c - Demonstrates resource limit system calls
 * 
 * Compile: gcc -o resource_limits resource_limits.c
 * Usage: ./resource_limits
 */

#include &lt;sys/resource.h&gt;
#include &lt;sys/time.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;unistd.h&gt;
#include &lt;errno.h&gt;
#include &lt;string.h&gt;

void print_limit(const char *name, int resource) {
    struct rlimit limit;

    if (getrlimit(resource, &amp;limit) == -1) {
        perror(&quot;getrlimit&quot;);
        return;
    }

    printf(&quot;%-25s &quot;, name);

    if (limit.rlim_cur == RLIM_INFINITY)
        printf(&quot;Soft: unlimited       &quot;);
    else
        printf(&quot;Soft: %-15lu &quot;, limit.rlim_cur);

    if (limit.rlim_max == RLIM_INFINITY)
        printf(&quot;Hard: unlimited\\n&quot;);
    else
        printf(&quot;Hard: %-15lu\\n&quot;, limit.rlim_max);
}

void demonstrate_limits() {
    printf(&quot;\\n=== Current Resource Limits ===\\n\\n&quot;);

    print_limit(&quot;CPU time (seconds)&quot;, RLIMIT_CPU);
    print_limit(&quot;File size (bytes)&quot;, RLIMIT_FSIZE);
    print_limit(&quot;Data segment (bytes)&quot;, RLIMIT_DATA);
    print_limit(&quot;Stack size (bytes)&quot;, RLIMIT_STACK);
    print_limit(&quot;Core file (bytes)&quot;, RLIMIT_CORE);
    print_limit(&quot;Open files&quot;, RLIMIT_NOFILE);
    print_limit(&quot;Address space (bytes)&quot;, RLIMIT_AS);
    print_limit(&quot;Max processes&quot;, RLIMIT_NPROC);
    print_limit(&quot;Locked memory (bytes)&quot;, RLIMIT_MEMLOCK);
}

void demonstrate_modify_limits() {
    printf(&quot;\\n=== Modifying File Descriptor Limit ===\\n\\n&quot;);

    struct rlimit limit;

    if (getrlimit(RLIMIT_NOFILE, &amp;limit) == -1) {
        perror(&quot;getrlimit&quot;);
        return;
    }

    printf(&quot;Original limits:\\n&quot;);
    printf(&quot;  Soft: %lu\\n&quot;, limit.rlim_cur);
    printf(&quot;  Hard: %lu\\n&quot;, limit.rlim_max);

    // Try to increase soft limit to hard limit
    rlim_t old_soft = limit.rlim_cur;
    limit.rlim_cur = limit.rlim_max;

    printf(&quot;\\nAttempting to set soft limit to %lu...\\n&quot;, limit.rlim_cur);

    if (setrlimit(RLIMIT_NOFILE, &amp;limit) == -1) {
        perror(&quot;setrlimit&quot;);
        printf(&quot;Failed to increase limit\\n&quot;);
    } else {
        printf(&quot;Successfully increased soft limit!\\n&quot;);
    }

    // Verify
    if (getrlimit(RLIMIT_NOFILE, &amp;limit) == -1) {
        perror(&quot;getrlimit&quot;);
        return;
    }

    printf(&quot;\\nNew limits:\\n&quot;);
    printf(&quot;  Soft: %lu\\n&quot;, limit.rlim_cur);
    printf(&quot;  Hard: %lu\\n&quot;, limit.rlim_max);
}

void demonstrate_rusage() {
    printf(&quot;\\n=== Resource Usage (getrusage) ===\\n\\n&quot;);

    struct rusage usage;

    // Do some work
    printf(&quot;Performing CPU-intensive work...\\n&quot;);
    long sum = 0;
    for (long i = 0; i &lt; 50000000; i++) {
        sum += i;
    }

    // Get resource usage
    if (getrusage(RUSAGE_SELF, &amp;usage) == -1) {
        perror(&quot;getrusage&quot;);
        return;
    }

    printf(&quot;\\nResource usage:\\n&quot;);
    printf(&quot;  User CPU time:        %ld.%06ld seconds\\n&quot;,
           usage.ru_utime.tv_sec, usage.ru_utime.tv_usec);
    printf(&quot;  System CPU time:      %ld.%06ld seconds\\n&quot;,
           usage.ru_stime.tv_sec, usage.ru_stime.tv_usec);
    printf(&quot;  Max RSS:              %ld KB\\n&quot;, usage.ru_maxrss);
    printf(&quot;  Page faults (soft):   %ld\\n&quot;, usage.ru_minflt);
    printf(&quot;  Page faults (hard):   %ld\\n&quot;, usage.ru_majflt);
    printf(&quot;  Block inputs:         %ld\\n&quot;, usage.ru_inblock);
    printf(&quot;  Block outputs:        %ld\\n&quot;, usage.ru_oublock);
    printf(&quot;  Voluntary switches:   %ld\\n&quot;, usage.ru_nvcsw);
    printf(&quot;  Involuntary switches: %ld\\n&quot;, usage.ru_nivcsw);
}

void demonstrate_cpu_limit() {
    printf(&quot;\\n=== CPU Time Limit Demo ===\\n\\n&quot;);

    struct rlimit limit;

    // Set CPU time limit to 2 seconds
    limit.rlim_cur = 2;  // 2 seconds
    limit.rlim_max = 2;

    printf(&quot;Setting CPU time limit to 2 seconds...\\n&quot;);
    printf(&quot;Process will be killed with SIGXCPU if exceeded\\n&quot;);
    printf(&quot;(This demo won't actually exceed it)\\n\\n&quot;);

        perror(&quot;setrlimit&quot;);

    for (long i = 0; i &lt; 10000000; i++) {

    printf(&quot;\\nNote: To decrease nice value (increase priority),\\n&quot;);
    printf(&quot;      you need root privileges or CAP_SYS_NICE capability\\n&quot;);

<pre><code class="language-c">/*
 * shm_demo.c - Demonstrates shared memory system calls
 * 
 * Compile: gcc -o shm_demo shm_demo.c
 * Usage: ./shm_demo
 */

#include &lt;sys/shm.h&gt;
#include &lt;sys/ipc.h&gt;
#include &lt;sys/types.h&gt;
#include &lt;sys/wait.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;
#include &lt;unistd.h&gt;

#define SHM_SIZE 1024
#define SHM_KEY 0x1234

struct shared_data {
    int counter;
    char message[100];
    pid_t writer_pid;
};

void demonstrate_basic_shm() {
    printf(&quot;\\n=== Basic Shared Memory Demo ===\\n&quot;);

    int shmid;
    struct shared_data *shared;
    pid_t pid;

    // Create shared memory segment
    shmid = shmget(SHM_KEY, sizeof(struct shared_data), IPC_CREAT | 0666);
    if (shmid == -1) {
        perror(&quot;shmget&quot;);
        return;
    }

    printf(&quot;Created shared memory segment, ID: %d\\n&quot;, shmid);

    // Attach shared memory
    shared = (struct shared_data *)shmat(shmid, NULL, 0);
    if (shared == (void *)-1) {
        perror(&quot;shmat&quot;);
        shmctl(shmid, IPC_RMID, NULL);
        return;
    }

    printf(&quot;Attached shared memory at address: %p\\n&quot;, (void *)shared);

    // Initialize shared data
    shared-&gt;counter = 0;
    strcpy(shared-&gt;message, &quot;Initial message&quot;);
    shared-&gt;writer_pid = 0;

    pid = fork();

    if (pid == -1) {
        perror(&quot;fork&quot;);
        shmdt(shared);
        shmctl(shmid, IPC_RMID, NULL);
        return;
    }

    if (pid == 0) {
        // Child process
        printf(&quot;\\n[Child] PID: %d\\n&quot;, getpid());
        printf(&quot;[Child] Reading initial data:\\n&quot;);
        printf(&quot;        Counter: %d\\n&quot;, shared-&gt;counter);
        printf(&quot;        Message: %s\\n&quot;, shared-&gt;message);

        // Modify shared data
        shared-&gt;counter = 42;
        strcpy(shared-&gt;message, &quot;Modified by child!&quot;);
        shared-&gt;writer_pid = getpid();

        printf(&quot;[Child] Updated shared memory\\n&quot;);

        // Detach
        shmdt(shared);
        exit(0);
    }
    else {
        // Parent process
        sleep(1);  // Wait for child to modify

        printf(&quot;\\n[Parent] Reading data after child modified:\\n&quot;);
        printf(&quot;         Counter: %d\\n&quot;, shared-&gt;counter);
        printf(&quot;         Message: %s\\n&quot;, shared-&gt;message);
        printf(&quot;         Writer PID: %d\\n&quot;, shared-&gt;writer_pid);

        wait(NULL);  // Wait for child to finish

        // Detach
        shmdt(shared);

        // Remove shared memory segment
        if (shmctl(shmid, IPC_RMID, NULL) == -1) {
            perror(&quot;shmctl IPC_RMID&quot;);
        } else {
            printf(&quot;\\n[Parent] Removed shared memory segment\\n&quot;);
        }
    }
}

void demonstrate_shm_info() {
    printf(&quot;\\n=== Shared Memory Information ===\\n&quot;);

    int shmid;
    struct shmid_ds shm_info;

    // Create shared memory
    shmid = shmget(IPC_PRIVATE, SHM_SIZE, IPC_CREAT | 0666);
    if (shmid == -1) {
        perror(&quot;shmget&quot;);
        return;
    }

    // Get information
    if (shmctl(shmid, IPC_STAT, &amp;shm_info) == -1) {
        perror(&quot;shmctl IPC_STAT&quot;);
        shmctl(shmid, IPC_RMID, NULL);
        return;
    }

    printf(&quot;Segment ID: %d\\n&quot;, shmid);
    printf(&quot;Size: %lu bytes\\n&quot;, shm_info.shm_segsz);
    printf(&quot;Attached processes: %lu\\n&quot;, (unsigned long)shm_info.shm_nattch);
    printf(&quot;Creator PID: %d\\n&quot;, shm_info.shm_cpid);
    printf(&quot;Last shmat PID: %d\\n&quot;, shm_info.shm_lpid);
    printf(&quot;Permissions: %o\\n&quot;, shm_info.shm_perm.mode);

    // Cleanup
    shmctl(shmid, IPC_RMID, NULL);
}

void demonstrate_multiple_attachments() {
    printf(&quot;\\n=== Multiple Process Attachments ===\\n&quot;);

    int shmid;
    int *shared;
    pid_t pid1, pid2;

    // Create shared memory for counter
    shmid = shmget(IPC_PRIVATE, sizeof(int), IPC_CREAT | 0666);
    if (shmid == -1) {
        perror(&quot;shmget&quot;);
        return;
    }

    shared = (int *)shmat(shmid, NULL, 0);
    if (shared == (void *)-1) {
        perror(&quot;shmat&quot;);
        shmctl(shmid, IPC_RMID, NULL);
        return;
    }

    *shared = 0;

    printf(&quot;Initial counter value: %d\\n&quot;, *shared);

    // Create first child
    pid1 = fork();
    if (pid1 == 0) {
        printf(&quot;[Child 1] Incrementing counter 3 times\\n&quot;);
        for (int i = 0; i &lt; 3; i++) {
            (*shared)++;
            printf(&quot;[Child 1] Counter = %d\\n&quot;, *shared);
            usleep(100000);  // 0.1 second
        }
        shmdt(shared);
        exit(0);
    }

    // Create second child
    pid2 = fork();
    if (pid2 == 0) {
        printf(&quot;[Child 2] Incrementing counter 3 times\\n&quot;);
        for (int i = 0; i &lt; 3; i++) {
            (*shared)++;
            printf(&quot;[Child 2] Counter = %d\\n&quot;, *shared);
            usleep(100000);
        }
        shmdt(shared);
        exit(0);
    }

    // Parent waits
    waitpid(pid1, NULL, 0);
    waitpid(pid2, NULL, 0);

    printf(&quot;\\n[Parent] Final counter value: %d\\n&quot;, *shared);
    printf(&quot;[Parent] Note: Without synchronization, results may vary!\\n&quot;);

    // Cleanup
    shmdt(shared);
    shmctl(shmid, IPC_RMID, NULL);
}

int main() {
    printf(&quot;=== Shared Memory System Calls Demo ===\\n&quot;);

    demonstrate_basic_shm();
    demonstrate_shm_info();
    demonstrate_multiple_attachments();

    printf(&quot;\\n=== Demo Complete ===\\n&quot;);
    printf(&quot;Note: For production use, shared memory should be\\n&quot;);
    printf(&quot;      protected with semaphores or other synchronization!\\n&quot;);

    return 0;
}

<pre><code class="language-c">/*
 * signal_demo.c - Demonstrates signal handling system calls
 * 
 * Compile: gcc -o signal_demo signal_demo.c
 * Usage: ./signal_demo
 */

#include &lt;signal.h&gt;
#include &lt;stdio.h&gt;
#include &lt;unistd.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;
#include &lt;sys/wait.h&gt;

volatile sig_atomic_t sigint_count = 0;
volatile sig_atomic_t sigusr1_received = 0;

void sigint_handler(int signum) {
    sigint_count++;
    write(STDOUT_FILENO, &quot;\\n[Handler] Caught SIGINT (Ctrl+C)\\n&quot;, 34);

    if (sigint_count &gt;= 3) {
        write(STDOUT_FILENO, &quot;[Handler] 3 SIGINTs received. Exiting.\\n&quot;, 40);
        exit(0);
    }
}

void sigusr1_handler(int signum) {
    sigusr1_received = 1;
    write(STDOUT_FILENO, &quot;[Handler] Caught SIGUSR1\\n&quot;, 25);
}

void sigchld_handler(int signum) {
    write(STDOUT_FILENO, &quot;[Handler] Child process terminated (SIGCHLD)\\n&quot;, 45);
    while (waitpid(-1, NULL, WNOHANG) &gt; 0);  // Reap zombie children
}

void demonstrate_basic_signal() {
    printf(&quot;\\n=== Basic Signal Handling ===\\n&quot;);

    struct sigaction sa;

    // Set up SIGINT handler
    memset(&amp;sa, 0, sizeof(sa));
    sa.sa_handler = sigint_handler;
    sigemptyset(&amp;sa.sa_mask);
    sa.sa_flags = 0;

    if (sigaction(SIGINT, &amp;sa, NULL) == -1) {
        perror(&quot;sigaction&quot;);
        return;
    }

    printf(&quot;Press Ctrl+C to send SIGINT (3 times to exit)\\n&quot;);
    printf(&quot;Process PID: %d\\n&quot;, getpid());

    for (int i = 0; i &lt; 10 &amp;&amp; sigint_count &lt; 3; i++) {
        printf(&quot;Waiting... (%d/10)\\n&quot;, i + 1);
        sleep(1);
    }

    if (sigint_count &lt; 3) {
        printf(&quot;No interrupts received. Continuing...\\n&quot;);
    }
}

void demonstrate_signal_between_processes() {
    printf(&quot;\\n=== Signals Between Processes ===\\n&quot;);

    struct sigaction sa;
    pid_t pid;

    // Set up SIGUSR1 handler
    memset(&amp;sa, 0, sizeof(sa));
    sa.sa_handler = sigusr1_handler;
    sigemptyset(&amp;sa.sa_mask);
    sa.sa_flags = 0;

    if (sigaction(SIGUSR1, &amp;sa, NULL) == -1) {
        perror(&quot;sigaction&quot;);
        return;
    }

    pid = fork();

    if (pid == -1) {
        perror(&quot;fork&quot;);
        return;
    }

    if (pid == 0) {
        // Child process
        printf(&quot;[Child] PID: %d, Parent PID: %d\\n&quot;, getpid(), getppid());
        printf(&quot;[Child] Sending SIGUSR1 to parent...\\n&quot;);
        sleep(1);

        kill(getppid(), SIGUSR1);

        printf(&quot;[Child] Exiting\\n&quot;);
        exit(0);
    }
    else {
        // Parent process
        printf(&quot;[Parent] PID: %d, waiting for signal...\\n&quot;, getpid());

        while (!sigusr1_received) {
            sleep(1);
        }

        printf(&quot;[Parent] Received SIGUSR1 from child\\n&quot;);
        wait(NULL);
    }
}

void demonstrate_signal_masking() {
    printf(&quot;\\n=== Signal Masking ===\\n&quot;);

    sigset_t new_mask, old_mask, pending_mask;

    // Create a mask with SIGINT
    sigemptyset(&amp;new_mask);
    sigaddset(&amp;new_mask, SIGINT);

    printf(&quot;Blocking SIGINT for 5 seconds...\\n&quot;);
    printf(&quot;Try pressing Ctrl+C (it will be queued)\\n&quot;);

    // Block SIGINT
    if (sigprocmask(SIG_BLOCK, &amp;new_mask, &amp;old_mask) == -1) {
        perror(&quot;sigprocmask&quot;);
        return;
    }

    for (int i = 5; i &gt; 0; i--) {
        printf(&quot;%d... &quot;, i);
        fflush(stdout);
        sleep(1);
    }
    printf(&quot;\\n&quot;);

    // Check for pending signals
    if (sigpending(&amp;pending_mask) == -1) {
        perror(&quot;sigpending&quot;);
        return;
    }

    if (sigismember(&amp;pending_mask, SIGINT)) {
        printf(&quot;SIGINT is pending (you pressed Ctrl+C while blocked)\\n&quot;);
    } else {
        printf(&quot;No SIGINT pending\\n&quot;);
    }

    printf(&quot;Unblocking SIGINT now...\\n&quot;);

    // Unblock SIGINT
    if (sigprocmask(SIG_SETMASK, &amp;old_mask, NULL) == -1) {
        perror(&quot;sigprocmask&quot;);
        return;
    }

    printf(&quot;SIGINT unblocked (signal delivered if it was pending)\\n&quot;);
    sleep(1);
}

void demonstrate_sigchld() {
    printf(&quot;\\n=== SIGCHLD Handler ===\\n&quot;);

    struct sigaction sa;
    pid_t pid;

    // Set up SIGCHLD handler
    memset(&amp;sa, 0, sizeof(sa));
    sa.sa_handler = sigchld_handler;
    sigemptyset(&amp;sa.sa_mask);
    sa.sa_flags = SA_RESTART;  // Restart interrupted system calls

    if (sigaction(SIGCHLD, &amp;sa, NULL) == -1) {
        perror(&quot;sigaction&quot;);
        return;
    }

    printf(&quot;Creating child process...\\n&quot;);

    pid = fork();

    if (pid == 0) {
        // Child
        printf(&quot;[Child] PID: %d, sleeping for 2 seconds...\\n&quot;, getpid());
        sleep(2);
        printf(&quot;[Child] Exiting\\n&quot;);
        exit(42);
    }
    else {
        // Parent
        printf(&quot;[Parent] Child PID: %d created\\n&quot;, pid);
        printf(&quot;[Parent] Doing other work...\\n&quot;);

        for (int i = 0; i &lt; 4; i++) {
            printf(&quot;[Parent] Working... %d\\n&quot;, i);
            sleep(1);
        }

        printf(&quot;[Parent] Done\\n&quot;);
    }
}

void sigalrm_handler(int signum) {
    write(STDOUT_FILENO, &quot;\\n[Handler] Alarm went off! (SIGALRM)\\n&quot;, 37);
}

void demonstrate_alarm() {
    printf(&quot;\\n=== Alarm Signal ===\\n&quot;);

    struct sigaction sa;

    // Handler for SIGALRM
    memset(&amp;sa, 0, sizeof(sa));
    sa.sa_handler = sigalrm_handler;
    sigemptyset(&amp;sa.sa_mask);
    sa.sa_flags = 0;

    if (sigaction(SIGALRM, &amp;sa, NULL) == -1) {
        perror(&quot;sigaction&quot;);
        return;
    }

    printf(&quot;Setting alarm for 3 seconds...\\n&quot;);
    alarm(3);

    printf(&quot;Waiting for alarm...\\n&quot;);
    for (int i = 0; i &lt; 5; i++) {
        sleep(1);
        printf(&quot;Tick %d\\n&quot;, i + 1);
    }
}

int main() {
    printf(&quot;=== Signal System Calls Demo ===\\n&quot;);
    printf(&quot;Note: Some demos are interactive\\n&quot;);

    demonstrate_basic_signal();

    // Reset SIGINT count for other demos
    sigint_count = 0;

    demonstrate_signal_between_processes();
    demonstrate_signal_masking();
    demonstrate_sigchld();
    demonstrate_alarm();

    printf(&quot;\\n=== Demo Complete ===\\n&quot;);

    return 0;
}

<pre><code class="language-c">/*
 * tcp_client.c - Simple TCP client
 * 
 * Compile: gcc -o tcp_client tcp_client.c
 * Usage: ./tcp_client [host] [port]
 */

#include &lt;sys/socket.h&gt;
#include &lt;netinet/in.h&gt;
#include &lt;arpa/inet.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;
#include &lt;unistd.h&gt;

#define DEFAULT_PORT 8080
#define DEFAULT_HOST &quot;127.0.0.1&quot;
#define BUFFER_SIZE 1024

int main(int argc, char *argv[]) {
    int sock;
    struct sockaddr_in server_addr;
    char buffer[BUFFER_SIZE];
    const char *host = DEFAULT_HOST;
    int port = DEFAULT_PORT;

    if (argc &gt; 1) {
        host = argv[1];
    }
    if (argc &gt; 2) {
        port = atoi(argv[2]);
    }

    printf(&quot;=== TCP Client ===\\n&quot;);
    printf(&quot;[Client] Connecting to %s:%d\\n&quot;, host, port);

    // 1. Create socket
    sock = socket(AF_INET, SOCK_STREAM, 0);
    if (sock == -1) {
        perror(&quot;socket&quot;);
        exit(1);
    }

    // 2. Set up server address
    memset(&amp;server_addr, 0, sizeof(server_addr));
    server_addr.sin_family = AF_INET;
    server_addr.sin_port = htons(port);

    if (inet_pton(AF_INET, host, &amp;server_addr.sin_addr) &lt;= 0) {
        fprintf(stderr, &quot;Invalid address: %s\\n&quot;, host);
        close(sock);
        exit(1);
    }

    // 3. Connect to server
    if (connect(sock, (struct sockaddr *)&amp;server_addr, 
                sizeof(server_addr)) == -1) {
        perror(&quot;connect&quot;);
        close(sock);
        exit(1);
    }

    printf(&quot;[Client] Connected!\\n&quot;);
    printf(&quot;[Client] Type messages (Ctrl+D to quit):\\n\\n&quot;);

    // 4. Communication loop
    while (1) {
        printf(&quot;&gt; &quot;);
        fflush(stdout);

        // Read from stdin
        if (fgets(buffer, sizeof(buffer), stdin) == NULL) {
            printf(&quot;\\n&quot;);
            break;  // EOF (Ctrl+D)
        }

        // Send to server
        size_t len = strlen(buffer);
        ssize_t bytes_sent = send(sock, buffer, len, 0);

        if (bytes_sent == -1) {
            perror(&quot;send&quot;);
            break;
        }

        // Receive response
        ssize_t bytes_read = recv(sock, buffer, sizeof(buffer) - 1, 0);

        if (bytes_read &lt;= 0) {
            if (bytes_read == 0) {
                printf(&quot;[Client] Server closed connection\\n&quot;);
            } else {
                perror(&quot;recv&quot;);
            }
            break;
        }

        buffer[bytes_read] = '\\0';
        printf(&quot;Server echo: %s&quot;, buffer);
    }

    // 5. Close connection
    printf(&quot;[Client] Closing connection\\n&quot;);
    close(sock);

    return 0;
}

  { name: `64. Examples / Tcp Server`, path: `examples/tcp_server.c`, dir: `examples`, words: 337, mins: 2, body: `<h1 id="tcp_serverc">tcp_server.c</h1>
<pre><code class="language-c">/*
 * tcp_server.c - Simple TCP echo server
 * 
 * Compile: gcc -o tcp_server tcp_server.c
 * Usage: ./tcp_server [port]
 * Test: telnet localhost 8080
 */

#include &lt;sys/socket.h&gt;
#include &lt;netinet/in.h&gt;
#include &lt;arpa/inet.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;
#include &lt;unistd.h&gt;
#include &lt;errno.h&gt;

#define DEFAULT_PORT 8080
#define BACKLOG 5
#define BUFFER_SIZE 1024

int main(int argc, char *argv[]) {
    int server_fd, client_fd;
    struct sockaddr_in server_addr, client_addr;
    socklen_t client_len;
    char buffer[BUFFER_SIZE];
    int port = DEFAULT_PORT;

    if (argc &gt; 1) {
        port = atoi(argv[1]);
    }

    printf(&quot;=== TCP Echo Server ===\\n&quot;);

    // 1. Create socket
    server_fd = socket(AF_INET, SOCK_STREAM, 0);
    if (server_fd == -1) {
        perror(&quot;socket&quot;);
        exit(1);
    }

    printf(&quot;[Server] Socket created\\n&quot;);

    // Set socket options
    int opt = 1;
    if (setsockopt(server_fd, SOL_SOCKET, SO_REUSEADDR, 
                   &amp;opt, sizeof(opt)) == -1) {
        perror(&quot;setsockopt&quot;);
    }

    // 2. Bind to address and port
    memset(&amp;server_addr, 0, sizeof(server_addr));
    server_addr.sin_family = AF_INET;
    server_addr.sin_addr.s_addr = INADDR_ANY;
    server_addr.sin_port = htons(port);

    if (bind(server_fd, (struct sockaddr *)&amp;server_addr, 
             sizeof(server_addr)) == -1) {
        perror(&quot;bind&quot;);
        close(server_fd);
        exit(1);
    }

    printf(&quot;[Server] Bound to port %d\\n&quot;, port);

    // 3. Listen for connections
    if (listen(server_fd, BACKLOG) == -1) {
        perror(&quot;listen&quot;);
        close(server_fd);
        exit(1);
    }

    printf(&quot;[Server] Listening for connections...\\n&quot;);
    printf(&quot;[Server] Press Ctrl+C to stop\\n\\n&quot;);

    // 4. Accept loop
    while (1) {
        client_len = sizeof(client_addr);
        client_fd = accept(server_fd, (struct sockaddr *)&amp;client_addr, 
                          &amp;client_len);

        if (client_fd == -1) {
            if (errno == EINTR) {
                continue;  // Interrupted by signal
            }
            perror(&quot;accept&quot;);
            continue;
        }

        // Get client info
        char client_ip[INET_ADDRSTRLEN];
        inet_ntop(AF_INET, &amp;client_addr.sin_addr, client_ip, sizeof(client_ip));
        int client_port = ntohs(client_addr.sin_port);

        printf(&quot;[Client %s:%d] Connected\\n&quot;, client_ip, client_port);

        // 5. Echo loop
        while (1) {
            ssize_t bytes_read = recv(client_fd, buffer, sizeof(buffer) - 1, 0);

            if (bytes_read &lt;= 0) {
                if (bytes_read == 0) {
                    printf(&quot;[Client %s:%d] Disconnected\\n&quot;, client_ip, client_port);
                } else {
                    perror(&quot;recv&quot;);
                }
                break;
            }

            buffer[bytes_read] = '\\0';
            printf(&quot;[Client %s:%d] Received %zd bytes: %s&quot;, 
                   client_ip, client_port, bytes_read, buffer);

            // Echo back
            ssize_t bytes_sent = send(client_fd, buffer, bytes_read, 0);
            if (bytes_sent == -1) {
                perror(&quot;send&quot;);
                break;
            }

            printf(&quot;[Client %s:%d] Echoed %zd bytes\\n&quot;, 
                   client_ip, client_port, bytes_sent);
        }

        // 6. Close client connection
        close(client_fd);

<pre><code class="language-c">/*
 * threads_demo.c - Demonstrates POSIX threads (pthreads)
 * 
 * Compile: gcc -pthread -o threads_demo threads_demo.c
 * Usage: ./threads_demo
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;unistd.h&gt;
#include &lt;string.h&gt;

// Shared data
pthread_mutex_t mutex = PTHREAD_MUTEX_INITIALIZER;
pthread_cond_t cond = PTHREAD_COND_INITIALIZER;
int counter = 0;
int ready = 0;

// Simple thread function
void *simple_thread(void *arg) {
    long id = (long)arg;
    printf(&quot;[Thread %ld] Started\\n&quot;, id);
    sleep(1);
    printf(&quot;[Thread %ld] Finished\\n&quot;, id);
    return (void *)(id * 2);
}

// Thread with mutex
void *mutex_thread(void *arg) {
    for (int i = 0; i &lt; 10000; i++) {
        pthread_mutex_lock(&amp;mutex);
        counter++;
        pthread_mutex_unlock(&amp;mutex);
    }
    return NULL;
}

// Producer thread
void *producer(void *arg) {
    for (int i = 0; i &lt; 5; i++) {
        pthread_mutex_lock(&amp;mutex);

        printf(&quot;[Producer] Producing item %d\\n&quot;, i);
        counter = i;
        ready = 1;

        pthread_cond_signal(&amp;cond);
        pthread_mutex_unlock(&amp;mutex);

        sleep(1);
    }
    return NULL;
}

// Consumer thread
void *consumer(void *arg) {
    for (int i = 0; i &lt; 5; i++) {
        pthread_mutex_lock(&amp;mutex);

        while (!ready) {
            pthread_cond_wait(&amp;cond, &amp;mutex);
        }

        printf(&quot;[Consumer] Consuming item %d\\n&quot;, counter);
        ready = 0;

        pthread_mutex_unlock(&amp;mutex);
    }
    return NULL;
}

void demo_simple_threads() {
    printf(&quot;\\n=== Simple Threads Demo ===\\n&quot;);

    pthread_t threads[3];

    // Create threads
    for (long i = 0; i &lt; 3; i++) {
        if (pthread_create(&amp;threads[i], NULL, simple_thread, (void *)i) != 0) {
            perror(&quot;pthread_create&quot;);
            return;
        }
    }

    // Wait for threads and get return values
    for (int i = 0; i &lt; 3; i++) {
        void *result;
        pthread_join(threads[i], &amp;result);
        printf(&quot;[Main] Thread %d returned: %ld\\n&quot;, i, (long)result);
    }
}

void demo_mutex() {
    printf(&quot;\\n=== Mutex Demo ===\\n&quot;);

    pthread_t t1, t2;
    counter = 0;

    printf(&quot;[Main] Initial counter: %d\\n&quot;, counter);

    pthread_create(&amp;t1, NULL, mutex_thread, NULL);
    pthread_create(&amp;t2, NULL, mutex_thread, NULL);

    pthread_join(t1, NULL);
    pthread_join(t2, NULL);

    printf(&quot;[Main] Final counter: %d (expected: 20000)\\n&quot;, counter);
}

void demo_condition_variable() {
    printf(&quot;\\n=== Condition Variable Demo ===\\n&quot;);

    pthread_t prod, cons;
    counter = 0;
    ready = 0;

    pthread_create(&amp;cons, NULL, consumer, NULL);
    pthread_create(&amp;prod, NULL, producer, NULL);

    pthread_join(prod, NULL);
    pthread_join(cons, NULL);
}

// Thread attributes demo
void demo_thread_attributes() {
    printf(&quot;\\n=== Thread Attributes Demo ===\\n&quot;);

    pthread_t thread;
    pthread_attr_t attr;

    // Initialize attributes
    pthread_attr_init(&amp;attr);

    // Set detached state
    pthread_attr_setdetachstate(&amp;attr, PTHREAD_CREATE_DETACHED);

    // Set stack size
    size_t stacksize = 2 * 1024 * 1024;  // 2MB
    pthread_attr_setstacksize(&amp;attr, stacksize);

    printf(&quot;[Main] Creating detached thread with 2MB stack\\n&quot;);

    if (pthread_create(&amp;thread, &amp;attr, simple_thread, (void *)99L) != 0) {
        perror(&quot;pthread_create&quot;);
        pthread_attr_destroy(&amp;attr);
        return;
    }

    pthread_attr_destroy(&amp;attr);

    // No need to join (detached)
    sleep(2);
    printf(&quot;[Main] Detached thread completed\\n&quot;);
}

// Thread-local storage demo
pthread_key_t tls_key;

void tls_destructor(void *value) {
    printf(&quot;[Destructor] Freeing TLS value: %ld\\n&quot;, (long)value);
}

void *tls_thread(void *arg) {
    long id = (long)arg;

    // Set thread-specific data
    pthread_setspecific(tls_key, (void *)(id * 100));

    // Get thread-specific data
    long value = (long)pthread_getspecific(tls_key);
    printf(&quot;[Thread %ld] My TLS value: %ld\\n&quot;, id, value);

    return NULL;
}

void demo_thread_local_storage() {
    printf(&quot;\\n=== Thread-Local Storage Demo ===\\n&quot;);

    pthread_t threads[3];

    // Create key
    pthread_key_create(&amp;tls_key, tls_destructor);

    for (long i = 0; i &lt; 3; i++) {
        pthread_create(&amp;threads[i], NULL, tls_thread, (void *)i);
    }

    for (int i = 0; i &lt; 3; i++) {
        pthread_join(threads[i], NULL);
    }

    pthread_key_delete(tls_key);
}

int main() {
    printf(&quot;=== POSIX Threads Demo ===\\n&quot;);
    printf(&quot;This program demonstrates various pthread features\\n&quot;);

    demo_simple_threads();
    demo_mutex();
    demo_condition_variable();
    demo_thread_attributes();
    demo_thread_local_storage();

    printf(&quot;\\n=== All Demos Complete ===\\n&quot;);

    return 0;
}

<pre><code class="language-python">#!/usr/bin/env python3
&quot;&quot;&quot;Generate the Linux system-calls guide's SVG figures, tuned to the htmler blue theme.

Same house style as the computer-architecture guide: because the figures are
inlined as static images (no page CSS reaches them), every colour is chosen to
work on BOTH the dark (#0b0d12) and light (#ffffff) themes at once. A mid-slate
around luminance ~0.2 gives roughly 4.3:1 contrast three ways -- white text on
the fill, and the same colour as ink on either background.

  * slate blue  #6B7B94  (neutral boxes, connectors, axes, labels)
  * blue        #3E7CC0  (highlighted / user-space boxes)          + dark #2F5F98
  * teal        #1F918C  (positive &quot;result&quot; accent / kernel)
  * amber       #D9922B  (warning / trap; dark text on fill)
  * red         #D65A5F  (problem callouts / errors)
  * muted       #9AA0B4  (captions)
  * white       #FFFFFF  (text inside dark fills)
  * 1.5pt wide rules, hand-drawn Virgil font stack

Run:  python3 scripts/gen_figures.py
Output: figures/*.svg  (referenced from the chapter markdown)
&quot;&quot;&quot;
import base64
import io
import math
import os

# House-style constants (htmler blue theme, dual light/dark legible)
GREY = &quot;#6B7B94&quot;
GREY_D = &quot;#55637A&quot;
BLUE = &quot;#3E7CC0&quot;
BLUE_D = &quot;#2F5F98&quot;
TEAL = &quot;#1F918C&quot;
AMBER = &quot;#D9922B&quot;
RED = &quot;#D65A5F&quot;
WHITE = &quot;#FFFFFF&quot;
LIGHT = &quot;#9AA0B4&quot;
INK_DARK = &quot;#1F2433&quot;
FONT = (&quot;'Virgil','Segoe Print','Bradley Hand','Comic Sans MS',&quot;
        &quot;'Segoe UI',system-ui,-apple-system,sans-serif&quot;)
MONO = (&quot;'Virgil','SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,&quot;
        &quot;monospace&quot;)
RULE = 1.5

REPO_ROOT = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
FONT_PATH = os.path.join(os.path.dirname(os.path.abspath(__file__)),
                         &quot;Virgil.woff2&quot;)

USED_CHARS = set()
FONT_STYLE = &quot;&quot;


def esc(s):
    USED_CHARS.update(str(s))
    return (str(s).replace(&quot;&amp;&quot;, &quot;&amp;amp;&quot;).replace(&quot;&lt;&quot;, &quot;&amp;lt;&quot;)
            .replace(&quot;&gt;&quot;, &quot;&amp;gt;&quot;))


def defs():
    marks = []
    for name, col in ((&quot;g&quot;, GREY), (&quot;p&quot;, BLUE), (&quot;t&quot;, TEAL),
                      (&quot;r&quot;, RED), (&quot;a&quot;, AMBER), (&quot;l&quot;, LIGHT)):
        marks.append(
            f'&lt;marker id=&quot;ah-{name}&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; '
            f'markerWidth=&quot;4.5&quot; markerHeight=&quot;4.5&quot; '
            f'orient=&quot;auto-start-reverse&quot;&gt;'
            f'&lt;path d=&quot;M0 1L9 5L0 9z&quot; fill=&quot;{col}&quot;/&gt;&lt;/marker&gt;')
    return &quot;&lt;defs&gt;&quot; + &quot;&quot;.join(marks) + &quot;&lt;/defs&gt;&quot;


def rrect(x, y, w, h, fill, rx=9, stroke=None, sw=RULE, dash=None, opacity=None):
    s = (f'&lt;rect x=&quot;{x}&quot; y=&quot;{y}&quot; width=&quot;{w}&quot; height=&quot;{h}&quot; rx=&quot;{rx}&quot; ry=&quot;{rx}&quot; '
         f'fill=&quot;{fill}&quot;')
    if stroke:
        s += f' stroke=&quot;{stroke}&quot; stroke-width=&quot;{sw}&quot;'
    if dash:
        s += f' stroke-dasharray=&quot;{dash}&quot;'

        s += f' opacity=&quot;{opacity}&quot;'
    return s + &quot;/&gt;&quot;


def tspan_lines(x, cy, lines, fill, size, weight, lh, mono=False):
    fam = MONO if mono else FONT
    n = len(lines)
    y0 = cy - (n - 1) * lh / 2.0
    out = [f'&lt;text x=&quot;{x}&quot; y=&quot;{y0}&quot; fill=&quot;{fill}&quot; font-family=&quot;{fam}&quot; '
           f'font-size=&quot;{size}&quot; font-weight=&quot;{weight}&quot; text-anchor=&quot;middle&quot; '
           f'dominant-baseline=&quot;central&quot;&gt;']
    for i, ln in enumerate(lines):
        dy = 0 if i == 0 else lh
        out.append(f'&lt;tspan x=&quot;{x}&quot; dy=&quot;{dy}&quot;&gt;{esc(ln)}&lt;/tspan&gt;')

def box(x, y, w, h, lines, fill=GREY, tcol=WHITE, size=13, weight=600,

    t = tspan_lines(x + w / 2.0, y + h / 2.0, lines, tcol, size, weight, lh, mono)

def _mk(col):
    return {GREY: &quot;g&quot;, BLUE: &quot;p&quot;, TEAL: &quot;t&quot;, RED: &quot;r&quot;, AMBER: &quot;a&quot;,
            LIGHT: &quot;l&quot;}.get(col, &quot;g&quot;)


def arrow(x1, y1, x2, y2, col=GREY, sw=RULE, dash=None):

def path(d, col=GREY, sw=RULE, dash=None, arrow_end=False, fill=&quot;none&quot;):

    return (f'&lt;path d=&quot;{d}&quot; fill=&quot;{fill}&quot; stroke=&quot;{col}&quot; stroke-width=&quot;{sw}&quot;'
            f'{dd}{m}/&gt;')


def circle(cx, cy, r, fill, stroke=None, sw=RULE):
    st = f' stroke=&quot;{stroke}&quot; stroke-width=&quot;{sw}&quot;' if stroke else &quot;&quot;
    return f'&lt;circle cx=&quot;{cx}&quot; cy=&quot;{cy}&quot; r=&quot;{r}&quot; fill=&quot;{fill}&quot;{st}/&gt;'


def cylinder(x, y, w, h, fill=GREY, tcol=WHITE, lines=None, size=12,
             stroke=None, sw=RULE):
    ry = min(h * 0.16, 14)

def dash_boundary(x1, y, x2, label=None):

def svg(w, h, body, title=&quot;&quot;):

def build_font_style(chars):

              &quot;handwriting font.&quot;)
        return &quot;&quot;
    from fontTools.subset import Options, Subsetter
    from fontTools.ttLib import TTFont
    text_ = &quot;&quot;.join(sorted(chars))

    opts.flavor = &quot;woff2&quot;
    opts.desubroutinize = True
    opts.notdef_outline = True
    opts.recalc_bounds = True

// Prettify function in JS (matching Python's prettify)
function prettify(component) {
    let c = component.replace(/^[0-9]+[_-]/, '');
    c = c.replace(/_/g, ' ').replace(/-/g, ' ').trim();
    if (c.toLowerCase() === 'readme') return 'README';
    if (c.toLowerCase() === 'cheatsheet') return 'Cheatsheet';
    return c.replace(/\b\w/g, l => l.toUpperCase());
}

// Like prettify(), but keeps any leading "01_"/"2-" style number as a "01. "
// prefix so the sidebar mirrors the on-disk ordering of the documents.
function prettifyKeepNum(component) {
    const m = component.match(/^([0-9]+)[_-]/);
    const prefix = m ? m[1] + '. ' : '';
    return prefix + prettify(component);
}

const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => HTML_ESCAPES[c]); }
function cleanName(name) { return (name || '').replace(/^\s*\d+\.\s*/, ''); }
function renderMathInNode(node) {
    if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
        window.MathJax.typesetPromise([node]).catch(() => {});
    } else {
        window.setTimeout(() => renderMathInNode(node), 50);
    }
}

/* ───── Cross-document link resolution (supports nested folders) ─────
   Docs may live in sub-directories and link to each other with relative
   paths ("../03_patterns/README.md"), bare files ("CHEATSHEET.md") or even a
   folder ("01_pthreads/"), which we resolve to that folder's README. */
/* - Nagesh N Nazare - */
const BY_PATH = {};        // "01_pthreads/readme.md"  -> idx
const BY_DIR_README = {};  // "01_pthreads" / ""        -> idx (README of dir)
const BY_BASENAME = {};    // "cheatsheet.md"           -> idx (only if unique)
const BASENAME_DUP = {};

TAB_DATA.forEach((tab, idx) => {
    const path = (tab.path || '').toLowerCase();
    if (path) BY_PATH[path] = idx;
    const base = path.split('/').pop();
    if (base) {
        if (Object.prototype.hasOwnProperty.call(BY_BASENAME, base)) BASENAME_DUP[base] = true;
        else BY_BASENAME[base] = idx;
    }
    if (base === 'readme.md') {
        BY_DIR_README[(tab.dir || '').toLowerCase()] = idx;
    }
});
Object.keys(BASENAME_DUP).forEach(b => { delete BY_BASENAME[b]; });

/* Join a relative href onto a base directory and normalize . / .. segments. */
function joinPath(baseDir, rel) {
    if (rel.charAt(0) === '/') { baseDir = ''; rel = rel.replace(/^\/+/, ''); }
    const parts = (baseDir ? baseDir.split('/') : []).concat(rel.split('/'));
    const out = [];
    for (const p of parts) {
        if (p === '' || p === '.') continue;
        if (p === '..') { out.pop(); continue; }
        out.push(p);
    }
    return out.join('/');
}

function mdTarget(rawHref, baseDir) {
    if (!rawHref || rawHref.charAt(0) === '#') return null;
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(rawHref) || /^(mailto|tel):/i.test(rawHref)) return null;

    let anchor = '';
    let pathPart = rawHref;
    const hashIdx = pathPart.indexOf('#');
    if (hashIdx >= 0) {
        anchor = pathPart.substring(hashIdx + 1);
        pathPart = pathPart.substring(0, hashIdx);
        try { anchor = decodeURIComponent(anchor); } catch (e) {}
    }
    const qIdx = pathPart.indexOf('?');
    if (qIdx >= 0) pathPart = pathPart.substring(0, qIdx);
    if (!pathPart) return null;

    const joined = joinPath(baseDir || '', pathPart).toLowerCase();
    let idx;
    if (/\.md$/i.test(pathPart)) {
        idx = BY_PATH[joined];
        if (idx === undefined) {
            const base = joined.split('/').pop();
            idx = BY_BASENAME[base];
        }
    } else {
        // a directory reference -> that folder's README
        idx = BY_DIR_README[joined];
    }
    if (idx === undefined) return null;
    return { idx: idx, anchor: anchor };
}

function baseDirOf(node) {
    const panel = node && node.closest ? node.closest('.tab-content') : null;
    return panel ? (panel.dataset.dir || '') : '';
}

/* Tag links so we can style internal navigation distinctly from external ones. */
function classifyLinks() {
    document.querySelectorAll('.tab-content a[href]').forEach(a => {
        const href = a.getAttribute('href');
        if (!href) return;
        if (href.charAt(0) === '#') {
            a.classList.add('anchor-link');
        } else if (mdTarget(href, baseDirOf(a))) {
            a.classList.add('xref-link');
        } else if (/^[a-z][a-z0-9+.-]*:\/\//i.test(href)) {
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
        }
    });
}

function addCopyButton(pre, block) {
    const btn = document.createElement('button');
    btn.className = 'code-copy-btn';
    btn.type = 'button';
    btn.textContent = 'Copy';
    btn.addEventListener('click', () => {
        const text = block.innerText;
        const done = () => {
            btn.textContent = 'Copied';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1600);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
        } else {
            fallbackCopy(text, done);
        }
    });
    pre.appendChild(btn);
}

function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
}

}

// Apply a theme. `persist` is true ONLY for an explicit user action; auto/OS
// applications must NOT write to storage, otherwise the very first auto theme
// would look like an explicit choice and we'd stop following the OS.
function setTheme(theme, persist) {

    themeToggleBtn.innerHTML = (theme === 'light' ? ICON_SUN : ICON_MOON);

/* - Nagesh N Nazare - */

function activateTab(idx, resetScroll) {
    if (resetScroll === undefined) resetScroll = true;
    document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + idx).classList.add('active');
    docSelect.value = String(idx);
    docList.querySelectorAll('a').forEach(a => {
        a.classList.toggle('nav-doc-active', parseInt(a.dataset.docIdx, 10) === idx);
    });
    const activeLink = docList.querySelector(`a[data-doc-idx="${idx}"]`);
    if (activeLink) {
        let parent = activeLink.closest('.nav-dir-item');
        while (parent) {
            parent.classList.add('expanded');
            parent = parent.parentElement.closest('.nav-dir-item');
        }
    }
    if (window.innerWidth <= 1024) {
        sidebarNav.classList.add('collapsed');
        document.body.classList.add('sidebar-collapsed');
        const tSidebar = document.getElementById('tocSidebar');
        if (tSidebar) {
            tSidebar.classList.add('collapsed');
            document.body.classList.add('toc-collapsed');
        }
    }
    history.replaceState(null, null, '#tab-' + idx);
    if (typeof buildToc === 'function') buildToc(idx);
    // Reflect the active document's title in the condensing navbar. Use the
    // full name (including any leading number) so it matches the picker exactly.
    if (navDocTitle && TAB_DATA[idx]) {
        navDocTitle.textContent = TAB_DATA[idx].name;
    }
    if (typeof updateDocNav === 'function') updateDocNav(idx);
    // Jump back to the top when switching documents so the reader starts at
    // the beginning rather than wherever the previous doc was scrolled to.
    if (resetScroll) {
        window.scrollTo({ top: 0, behavior: 'auto' });
        document.body.classList.remove('nav-condensed');
        navLastY = 0;
    }
    LS.set('doc-last-idx', String(idx));
}

/* ───── Lightweight state persistence (no per-scroll writes) ─────
   Remembers the last document, sidebar/TOC open state and scroll position so
   reopening the file resumes where you left off. Writes happen only on tab
   switch, panel toggle and page hide -- never during scrolling. */
/* - Nagesh N Nazare - */
const LS = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

function persistScroll() {
    LS.set('doc-last-idx', String(currentTabIdx()));
    LS.set('doc-last-y', String(Math.round(window.scrollY)));
}
window.addEventListener('pagehide', persistScroll);
document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') persistScroll();
});

/* ───── Search index: pre-extract plain text per block ───── */
/* - Nagesh N Nazare - */

const searchIndex = [];

TAB_DATA.forEach((tab, tabIdx) => {
    const tmp = document.createElement('div');
    tmp.innerHTML = tab.body;
    let currentHeading = '';

    function walk(node) {
        for (const child of node.childNodes) {
            if (child.nodeType === Node.ELEMENT_NODE) {
                const tag = child.tagName;
                if (/^H[1-6]$/.test(tag)) {
                    currentHeading = child.textContent.trim();
                }
                const text = child.textContent.trim();
                if (text.length > 0) {
                    searchIndex.push({
                        tabIdx: tabIdx,
                        tabName: tab.name,
                        heading: currentHeading,
                        text: text,
                        tag: tag
                    });
                }
                if (/^(P|LI|TD|TH|BLOCKQUOTE|PRE|H[1-6])$/.test(tag)) {
                    continue;
                }
                walk(child);
            }
        }
    }
    walk(tmp);
});

/* ───── Search overlay logic ───── */
/* - Nagesh N Nazare - */

const overlay = document.getElementById('searchOverlay');
const searchInput = document.getElementById('searchInput');
const searchTrigger = document.getElementById('searchTrigger');
const srBody = document.getElementById('srBody');
const srCount = document.getElementById('srCount');
let srActiveIdx = -1;
let srResults = [];

function openSearch() {
    overlay.classList.add('open');
    searchInput.value = '';
    searchInput.focus();
    srBody.innerHTML = '<div class="sr-empty">Type to search across all tabs</div>';
    srCount.textContent = '';
    srActiveIdx = -1;
    srResults = [];
}

function closeSearch() {
    overlay.classList.remove('open');
    searchInput.value = '';
}

searchTrigger.addEventListener('click', openSearch);

overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeSearch();
});

document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        if (overlay.classList.contains('open')) closeSearch();
        else openSearch();
        return;
    }
    if (e.key === '/' && !overlay.classList.contains('open') &&
        !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {
        e.preventDefault();
        openSearch();
        return;
    }
    if (e.key === 'Escape' && overlay.classList.contains('open')) {
        closeSearch();
        return;
    }
    if (overlay.classList.contains('open')) {
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (srResults.length > 0) {
                srActiveIdx = Math.min(srActiveIdx + 1, srResults.length - 1);
                updateActiveResult();
            }
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (srResults.length > 0) {
                srActiveIdx = Math.max(srActiveIdx - 1, 0);
                updateActiveResult();
            }
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (srActiveIdx >= 0 && srActiveIdx < srResults.length) {
                navigateToResult(srResults[srActiveIdx]);
            }
        }
    }
});

function updateActiveResult() {
    srBody.querySelectorAll('.sr-item').forEach((el, i) => {
        el.classList.toggle('sr-active', i === srActiveIdx);
    });
    const active = srBody.querySelector('.sr-active');
    if (active) active.scrollIntoView({ block: 'nearest' });
}

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function highlightSnippet(text, query, maxLen) {
    const lower = text.toLowerCase();
    const qLower = query.toLowerCase();
    const pos = lower.indexOf(qLower);
    if (pos < 0) return text.substring(0, maxLen);

    const pad = Math.floor((maxLen - query.length) / 2);
    let start = Math.max(0, pos - pad);
    let end = Math.min(text.length, pos + query.length + pad);
    let snippet = text.substring(start, end);
    if (start > 0) snippet = '...' + snippet;
    if (end < text.length) snippet = snippet + '...';

    const re = new RegExp('(' + escapeRegex(query) + ')', 'gi');
    return snippet.replace(re, '<mark>$1</mark>');
}

let searchTimer = null;
searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 120);
});

function runSearch() {
    const query = searchInput.value.trim();
    if (query.length < 2) {
        srBody.innerHTML = '<div class="sr-empty">Type at least 2 characters</div>';
        srCount.textContent = '';
        srResults = [];
        srActiveIdx = -1;
        return;
    }

    const qLower = query.toLowerCase();
    const matches = [];
    const seen = new Set();

    for (const entry of searchIndex) {
        if (entry.text.toLowerCase().includes(qLower)) {
            const key = entry.tabIdx + ':' + entry.heading + ':' + entry.text.substring(0, 80);
            if (seen.has(key)) continue;
            seen.add(key);
            matches.push(entry);
            if (matches.length >= 100) break;
        }
    }

    srResults = matches;
    srActiveIdx = matches.length > 0 ? 0 : -1;

    if (matches.length === 0) {
        srBody.innerHTML = '<div class="sr-empty">No results for "' +
            query.replace(/</g,'&lt;') + '"</div>';
        srCount.textContent = '0 results';
        return;
    }

    srCount.textContent = matches.length >= 100 ? '100+ results' : matches.length + ' result' + (matches.length > 1 ? 's' : '');

    let html = '';
    matches.forEach((m, i) => {
        const snippet = highlightSnippet(m.text, query, 160);
        html += '<div class="sr-item' + (i === 0 ? ' sr-active' : '') + '" data-ridx="' + i + '">';
        html += '<div class="sr-item-tab">' + m.tabName + '</div>';
        if (m.heading) html += '<div class="sr-item-heading">' + m.heading.replace(/</g,'&lt;') + '</div>';
        html += '<div class="sr-item-snippet">' + snippet + '</div>';
        html += '</div>';
    });
    srBody.innerHTML = html;

    srBody.querySelectorAll('.sr-item').forEach(el => {
        el.addEventListener('click', () => {
            const idx = parseInt(el.dataset.ridx, 10);
            navigateToResult(srResults[idx]);
        });
    });
}

function navigateToResult(result) {
    const savedQuery = searchInput.value.trim() || result.text.substring(0, 20);
    pushHistory();
    closeSearch();
    activateTab(result.tabIdx, false);

    requestAnimationFrame(() => {
        clearHighlights();
        const panel = document.getElementById('panel-' + result.tabIdx);
        const qLower = savedQuery.toLowerCase();
        const qLen = savedQuery.length;

        const hits = [];
        const walker = document.createTreeWalker(panel, NodeFilter.SHOW_TEXT);
        while (walker.nextNode()) {
            const node = walker.currentNode;
            const idx = node.textContent.toLowerCase().indexOf(qLower);
            if (idx >= 0) {
                hits.push({ node: node, offset: idx });
            }
        }

        let firstMark = null;
        for (let i = hits.length - 1; i >= 0; i--) {
            const h = hits[i];
            const range = document.createRange();
            range.setStart(h.node, h.offset);
            range.setEnd(h.node, h.offset + qLen);
            const mark = document.createElement('span');
            mark.className = 'search-highlight';
            mark.dataset.searchHighlight = '1';
            try { range.surroundContents(mark); firstMark = mark; } catch(e) {}
        }

        if (firstMark) {
            firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        setTimeout(clearHighlights, 6000);
    });
}

function clearHighlights() {
    document.querySelectorAll('[data-search-highlight]').forEach(el => {
        const parent = el.parentNode;
        parent.replaceChild(document.createTextNode(el.textContent), el);
        parent.normalize();
    });
}
