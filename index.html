<h2 id="437-minimal-message-queue-sketch">4.3.7 Minimal message queue sketch</h2>
<pre><code class="language-c">#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;
#include &lt;sys/ipc.h&gt;
#include &lt;sys/msg.h&gt;
#include &lt;sys/wait.h&gt;
#include &lt;unistd.h&gt;

    long mtype;
    char mtext[64];
};

        return 1;
    }

    if (qid == -1) {
        perror(&quot;msgget&quot;);
        return 1;
    }

    pid_t pid = fork();
    if (pid == -1) {
        perror(&quot;fork&quot;);
        msgctl(qid, IPC_RMID, NULL);
        return 1;

    if (pid == 0) {

<p>SysV IPC identifies objects by <strong><code>ftok</code> key</strong> or <strong><code>IPC_PRIVATE</code></strong>, returning

<p>POSIX IPC modernizes the SysV trio (Part 4.3) with <strong>name-based objects</strong> that
appear as <strong>file descriptors</strong> (message queues) or <strong><code>sem_t*</code></strong> handles
(semaphores), living under <strong><code>/dev/mqueue</code></strong> and <strong><code>/dev/shm</code></strong>. They integrate
with <strong><code>poll</code>/<code>epoll</code></strong> (Part 6.6) and follow unlink-for-cleanup semantics closer
to ordinary files (Part 2.1).</p>
<hr />
<h2 id="441-why-posix-ipc-exists">4.4.1 Why POSIX IPC exists</h2>
<pre><code>   SysV                          POSIX
   ────                          ─────
   integer id (47)               fd (42) or named sem_t*
   ftok collisions               /name with O_CREAT|O_EXCL
   ipcs/ipcrm                    mq_unlink / sem_unlink / shm_unlink
   no poll on queue              mq_notify + signalfd/eventfd patterns
</code></pre>
<p><strong>Trade-offs ▸</strong> POSIX mq carries <strong>priority-ordered messages</strong> and <strong>async
notification</strong>; POSIX semaphores have a simpler API than <code>semop</code> arrays. Linux
adopted POSIX shm/mq relatively late — always check <code>#ifdef</code> and runtime support.</p>
<hr />
<h2 id="442-posix-message-queues">4.4.2 POSIX message queues</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>

#define MQ_NAME &quot;/sc_mq_demo&quot;

int main(void) {
    mq_unlink(MQ_NAME);

    struct mq_attr attr = {
        .mq_flags   = 0,
        .mq_maxmsg  = 10,
        .mq_msgsize = 256,
        .mq_curmsgs = 0,
    };

        mq_close(mq);
        mq_unlink(MQ_NAME);
        return 1;

<p>Linux offers a buffet of IPC: <strong>pipes</strong>, <strong>FIFOs</strong>, <strong>signals</strong>, <strong>message queues</strong>,
<strong>shared memory</strong>, and <strong>Unix domain sockets</strong> (Part 6.4). None is universally best —
the right choice depends on <strong>relationship</strong> (related processes vs strangers),
<strong>data shape</strong> (byte stream vs messages vs random access), <strong>throughput/latency</strong>, and
<strong>operational complexity</strong>. This chapter is a decision guide, not a popularity contest.</p>
<hr />
<h2 id="451-the-landscape-at-a-glance">4.5.1 The landscape at a glance</h2>
<p><img alt="IPC mechanisms compared on latency throughput and complexity axes" src="figures/ipc-comparison.svg" /></p>
<pre><code>   latency (lower better)          throughput (higher better)
   ─────────────────────          ───────────────────────────
   shared memory  ★★★★★            shared memory  ★★★★★
   Unix sockets   ★★★★             Unix sockets   ★★★★
   pipes/FIFOs    ★★★              pipes/FIFOs    ★★★
   POSIX mq       ★★★              POSIX mq       ★★★
   SysV mq        ★★               SysV mq        ★★
   signals        ★ (control only) signals        ★ (no bulk data)
</code></pre>
<p><strong>Systems ▸</strong> Shared memory wins raw bandwidth because, after setup, accesses are
ordinary loads/stores — no kernel copy per message. Everything else moves bytes
through kernel buffers at least once.</p>
<hr />
<h2 id="452-decision-flow">4.5.2 Decision flow</h2>
<pre><code>   Need to pass bulk data?
        │
        no ──▶ signals / signalfd for events only (Part 4.2)
        │
        yes
        │
        ├─ related processes (fork/exec, same tree)?
        │       │
        │       yes ──▶ pipe() enough for byte streams (Part 4.1)
        │               need fd passing or credentials? → Unix SOCK_STREAM (Part 6.4)
        │
        └─ unrelated / named / persistent?
                │
                ├─ random access / huge blob → mmap + shm_open (Parts 3.3, 3.5)
                ├─ discrete messages + priorities → POSIX mq (Part 4.4)
                ├─ legacy / existing SysV → msgget/semget (Part 4.3)
                └─ request/reply RPC style → Unix domain sockets
</code></pre>
<hr />
<h2 id="453-mechanism-profiles">4.5.3 Mechanism profiles</h2>
<h3 id="pipes--fifos-part-41">Pipes &amp; FIFOs (Part 4.1)</h3>

<td>Good — one kernel copy per direction</td>

<td><strong>Relationship</strong></td>
<td>Inherited fds or agreed FIFO path</td>
</tr>
<tr>
<td><strong>Complexity</strong></td>
<td>Low</td>
</tr>
<tr>
<td><strong>Limits</strong></td>
<td>Byte stream only; no message boundaries; ~64 KiB buffer</td>
</tr>

</table>

<h2 id="454-latency-vs-throughput-trade-offs">4.5.4 Latency vs throughput trade-offs</h2>
<pre><code>   copies per message

<p>A <strong>process</strong> is an isolated execution context with its own virtual address space, file
descriptor table, and PID. A <strong>thread</strong> is a lighter-weight execution context <em>inside</em>
that address space — same heap, same open files, but its own stack, register set, and
<strong>thread ID (TID)</strong>. Part 1.2 introduced <code>fork()</code> and <code>clone()</code> for processes; this
chapter explains why Linux threads are really <code>clone()</code> with sharing flags, and when
to pick threads over separate processes.</p>
<hr />
<h2 id="511-two-tasks-one-address-space">5.1.1 Two tasks, one address space</h2>
<p><img alt="Threads share an address space; processes do not" src="figures/thread-vs-process.svg" /></p>
<pre><code>   PROCESS A                          PROCESS B
   ┌─────────────────────────┐        ┌─────────────────────────┐
   │  heap, globals, code    │        │  heap, globals, code    │
   │  (private VMA)          │        │  (private VMA)          │
   │  ┌──────┐  ┌──────┐       │        │  ┌──────┐               │
   │  │stack │  │stack │       │        │  │stack │               │
   │  │ T1   │  │ T2   │       │        │  │ T1   │               │
   │  └──────┘  └──────┘       │        │  └──────┘               │
   │  fd table: 0,1,2,3,...    │        │  fd table: 0,1,2,...    │
   └─────────────────────────┘        └─────────────────────────┘
        PID 1000, TIDs 1000,1001            PID 1001, TID 1001
</code></pre>
<table>
<thead>
<tr>
<th>Resource</th>
<th>Threads (same process)</th>
<th>Processes (after fork)</th>
</tr>
</thead>
<tbody>
<tr>
<td>Virtual address space</td>
<td><strong>Shared</strong> (heap, globals, <code>.bss</code>)</td>
<td><strong>Separate</strong> (COW at fork)</td>
</tr>
<tr>
<td>Stack</td>
<td><strong>Per thread</strong></td>
<td><strong>Per process</strong></td>
</tr>
<tr>
<td>Registers / PC</td>
<td><strong>Per thread</strong></td>
<td><strong>Per process</strong></td>
</tr>
<tr>
<td>File descriptors</td>
<td><strong>Shared table</strong> (same fd → same open file desc)</td>
<td><strong>Copied table</strong> (independent offsets per process — Part 0.5)</td>
</tr>
<tr>
<td>PID</td>
<td>Same</td>
<td>Different</td>
</tr>
<tr>
<td>TID (<code>gettid()</code>)</td>
<td>Unique per thread</td>
<td>Equals PID for single-threaded process</td>
</tr>
<tr>
<td>Signal disposition</td>
<td>Process-wide (with thread-targeting rules — Part 5.6)</td>
<td>Independent</td>
</tr>
</tbody>
</table>
<p><strong>Systems ▸</strong> From the kernel&rsquo;s scheduler perspective, a thread is just a <strong>task</strong>
(<code>task_struct</code>). Threads in one process share <code>mm_struct</code> (memory), <code>files_struct</code>
(fds), and signal handlers. Processes do not.</p>
<hr />
<h2 id="512-clone-is-the-primitive">5.1.2 clone() is the primitive</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="define-_gnu_source">define _GNU_SOURCE</h1>
<h1 id="include">include <sched.h></h1>
<h1 id="include_1">include <unistd.h></h1>
<h1 id="include_2">include <sys/syscall.h></h1>
<p>pid_t clone(int (<em>fn)(void </em>), void <em>stack, int flags, void </em>arg, &hellip;);
/<em> glibc wrapper; pthread_create uses clone() internally </em>/
<code>\`\`
**Returns:** child TID in parent; **0 in child** (like fork); **-1** on error (</code>errno\` set).</p>
</blockquote>
<p><code>fork()</code> is <code>clone()</code> <strong>without</strong> sharing flags — child gets a new address space (COW).
<code>pthread_create()</code> is <code>clone()</code> <strong>with</strong> sharing:</p>
<pre><code>   fork()                    pthread_create()
     │                            │
     ▼                            ▼
   clone(0)                  clone(CLONE_VM      ← share address space
                                  | CLONE_FILES   ← share fd table
                                  | CLONE_SIGHAND ← share signal handlers
                                  | CLONE_THREAD  ← same thread group
                                  | CLONE_SYSVSEM ← share SysV sem adjust
                                  | ...)
</code></pre>
<blockquote>
<p><strong>Under the hood ▸</strong> <code>CLONE_VM</code> makes parent and child point at the same
<code>mm_struct</code>. A write to a global in one thread is immediately visible to all
others — no IPC, no serialization, no copy. That is the speed win and the
correctness hazard.</p>
</blockquote>
<p>Common <code>clone()</code> flags (see <code>man clone</code>):</p>
<table>
<thead>
<tr>
<th>Flag</th>
<th>Effect</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>CLONE_VM</code></td>
<td>Share virtual memory</td>
</tr>
<tr>
<td><code>CLONE_FILES</code></td>
<td>Share fd table</td>
</tr>
<tr>
<td><code>CLONE_FS</code></td>
<td>Share cwd / umask</td>
</tr>
<tr>
<td><code>CLONE_SIGHAND</code></td>
<td>Share signal handlers</td>
</tr>
<tr>
<td><code>CLONE_THREAD</code></td>
<td>Put in same thread group (same PID namespace view)</td>
</tr>
<tr>
<td><code>CLONE_SETTLS</code></td>
<td>Set thread-local storage pointer</td>
</tr>
<tr>
<td><code>CLONE_CHILD_CLEARTID</code></td>
<td>Address for futex wake on thread exit (Part 5.5)</td>
</tr>
</tbody>
</table>
<p><strong>Pitfall ▸</strong> Calling <code>fork()</code> in a multi-threaded program is dangerous: only the
calling thread survives in the child; other threads&rsquo; locks may be held forever.
Use <code>pthread_atfork()</code> handlers or avoid <code>fork()</code> after threads exist (prefer
<code>posix_spawn()</code> — Part 1.3).</p>
<hr />
<h2 id="513-what-threads-share--and-what-breaks">5.1.3 What threads share — and what breaks</h2>
<pre><code>   thread A                    thread B
      │                           │
      │  writes *global = 42      │  reads global → 42  ✓ (no IPC)
      │                           │
      │  malloc() → heap ptr      │  free(same ptr)     ✗ (unless coordinated)
      │                           │
      │  write(fd 3, ...)         │  read(fd 3, ...)    ✓ (shared offset!)
      │                           │
      │  stack local int x        │  cannot see x       ✓ (private stacks)
</code></pre>
<p>Shared mutable state without synchronization is a <strong>data race</strong> — undefined behavior
in C/C++ (Part 5.6). Shared fds mean two threads advancing the same file offset
without coordination corrupt reads (Part 2.2).</p>
<hr />
<h2 id="514-when-to-use-threads-vs-processes">5.1.4 When to use threads vs processes</h2>
<p><strong>Trade-offs ▸</strong></p>
<table>
<thead>
<tr>
<th>Choose <strong>threads</strong> when…</th>
<th>Choose <strong>processes</strong> when…</th>
</tr>
</thead>
<tbody>
<tr>
<td>Tight data sharing (in-memory cache, game state)</td>
<td>Strong <strong>isolation</strong> required (crash containment, security)</td>
</tr>
<tr>
<td>Low creation cost for many workers</td>
<td>Need separate address spaces (different <code>mmap</code> layouts)</td>
</tr>
<tr>
<td>Latency-sensitive handoff of small structures</td>
<td>CPU-bound parallelism + <strong>GIL-like</strong> constraints don&rsquo;t apply</td>
</tr>
<tr>
<td>One failure should not kill the whole service</td>
<td>Want OS-level resource limits per worker (<code>setrlimit</code>, cgroups)</td>
</tr>
</tbody>
</table>
<pre><code>   threads                         processes
   ───────                         ─────────
   fast create (~µs)               slower create (fork COW metadata)
   shared memory (free)            IPC required (pipes, shm — Part 4)
   one bug → whole process dies    one worker crash → others survive
   harder to debug races           easier to reason about ownership
</code></pre>
<p><strong>Systems ▸</strong> Production servers often hybridize: <strong>one process per CPU core</strong>
(or container) with a <strong>thread pool</strong> inside for connection handling — nginx worker
processes + threads, or event loops with thread pools for CPU work (Part 7).</p>
<hr />
<h2 id="515-observing-threads-in-the-kernel">5.1.5 Observing threads in the kernel</h2>
<p>Each thread has a TID visible in <code>/proc</code>:</p>
<pre><code class="language-bash"># main thread and worker TIDs for PID 1234
ls /proc/1234/task/
# 1234  1235  1236

cat /proc/1234/task/1235/status | grep -E '^(Name|Tgid|Pid|Threads)'
# Tgid: 1234    ← thread group ID (= process PID)
# Pid:  1235    ← this thread's TID
</code></pre>
<p><code>strace -f</code> follows all threads; without <code>-f</code> you only see the main thread&rsquo;s syscalls.</p>
<hr />
<h2 id="516-minimal-comparison-fork-vs-pthread">5.1.6 Minimal comparison: fork vs pthread</h2>
<pre><code class="language-c">#define _GNU_SOURCE
#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;unistd.h&gt;
#include &lt;sys/wait.h&gt;

static int shared_counter = 0;   /* visible to all threads; NOT to forked child
                                    until exec unless in shared memory */

static void *thread_fn(void *arg) {
    (void)arg;
    shared_counter++;
    return NULL;
}

int main(void) {
    pid_t pid = fork();
    if (pid == -1) {
        perror(&quot;fork&quot;);
        exit(1);
    }
    if (pid == 0) {
        /* child: shared_counter is COW copy — increment doesn't affect parent */
        shared_counter = 99;
        _exit(0);
    }
    if (waitpid(pid, NULL, 0) == -1) {
        perror(&quot;waitpid&quot;);
        exit(1);
    }
    printf(&quot;after fork child: shared_counter = %d (still 0)\\n&quot;, shared_counter);

    pthread_t t;
    int err = pthread_create(&amp;t, NULL, thread_fn, NULL);
    if (err != 0) {
        fprintf(stderr, &quot;pthread_create: %s\\n&quot;, strerror(err));
        exit(1);
    }
    if (pthread_join(t, NULL) != 0) {
        fprintf(stderr, &quot;pthread_join failed\\n&quot;);
        exit(1);
    }
    printf(&quot;after thread:     shared_counter = %d (now 1)\\n&quot;, shared_counter);
    return 0;
}
</code></pre>
<p>Compile threads with <code>-pthread</code>. The fork child sees a <strong>copy</strong> of <code>shared_counter</code>;
the pthread sees the <strong>same</strong> memory.</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p>Threads share address space, fd table, and signal handlers; each thread has its own
  stack, registers, and TID.</p>
</li>
<li>
<p>Linux implements threads via <code>clone()</code> with <code>CLONE_VM | CLONE_FILES | …</code>; <code>fork()</code>
  is <code>clone()</code> without sharing.</p>
</li>
<li>
<p>Threads win on sharing speed and creation cost; processes win on isolation and
  failure containment.</p>
</li>
<li>
<p>Shared fds and heap require explicit synchronization (Parts 5.3–5.5); <code>fork()</code> in
  a threaded program needs special care.</p>
</li>
</ul>

<p>POSIX threads (<code>pthreads</code>) are the portable C interface to kernel threads on Linux.
Every <code>pthread_*</code> call is a <strong>library wrapper</strong> around <code>clone()</code>, futexes, and
scheduling — not a syscall you invoke directly, but the layer systems engineers use
daily. Part 5.1 explained <em>why</em> threads share memory; this chapter covers <em>creating,
running, joining, and destroying</em> them correctly.</p>
<hr />
<h2 id="521-the-pthread-error-contract-read-this-first">5.2.1 The pthread error contract (read this first)</h2>
<p>Syscalls return <code>-1</code> and set <code>errno</code> (Part 0.4). <strong>Pthread functions do not.</strong></p>
<blockquote>
<p><strong>The call ▸</strong> — return convention for all <code>pthread_*</code> functions:
<code>c
int pthread_create(...);   /* 0 on success, otherwise an errno *value* */
int pthread_join(...);
int pthread_mutex_lock(...);</code>
On failure, pthread returns a <strong>positive errno code directly</strong> (e.g. <code>EAGAIN</code>,
<code>EINVAL</code>). It does <strong>not</strong> set the global <code>errno</code> variable and does <strong>not</strong>
return <code>-1</code>.</p>
</blockquote>
<pre><code class="language-c">int err = pthread_create(&amp;t, NULL, start, arg);
if (err != 0) {
    fprintf(stderr, &quot;pthread_create: %s\\n&quot;, strerror(err));  /* use err, not errno */
    exit(1);
}
</code></pre>
<p><strong>Pitfall ▸</strong> Writing <code>if (pthread_create(...) == -1) perror("pthread_create")</code> is
wrong twice: pthread never returns <code>-1</code>, and <code>perror</code> reads <code>errno</code>, which pthread
did not set.</p>
<hr />
<h2 id="522-pthread_create-and-the-start-routine">5.2.2 pthread_create and the start routine</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <pthread.h></h1>
<p>int pthread_create(pthread_t <em>thread,
                   const pthread_attr_t </em>attr,
                   void <em>(</em>start_routine)(void <em>),
                   void </em>arg);
<code>\`\`
**Returns:**</code>0<code>on success; otherwise an errno value (</code>EAGAIN<code>,</code>EINVAL<code>,</code>EPERM<code>, …).
**Compile/link:**</code>gcc -Wall -Wextra -pthread -o prog prog.c\`</p>
</blockquote>
<pre><code>   main thread                          new thread
   ┌──────────────┐                    ┌──────────────┐
   │ pthread_create ─────────────────▶│ start_routine│
   │ returns 0      (async)           │   (arg)      │
   │ continues...                     │     ...      │
   └──────────────┘                    └──────────────┘
</code></pre>
<p>The start routine receives <code>void *arg</code> (you cast to your type), runs concurrently
with the creator, and terminates by <strong>returning</strong> or calling <code>pthread_exit()</code>.</p>
<blockquote>
<p><strong>Under the hood ▸</strong> glibc allocates a stack (default often 8 MB on Linux, overridable
via <code>ulimit -s</code> or attributes), sets up TLS, and calls <code>clone()</code> with sharing flags.
The new task enters at a glibc trampoline that calls your <code>start_routine</code>.</p>
</blockquote>
<p><strong>Errors ▸</strong></p>
<table>
<thead>
<tr>
<th>Return value</th>
<th>When</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>EAGAIN</code></td>
<td>Insufficient resources (kernel limit on tasks, or RLIMIT_NPROC)</td>
</tr>
<tr>
<td><code>EINVAL</code></td>
<td>Invalid attributes</td>
</tr>
<tr>
<td><code>EPERM</code></td>
<td>Insufficient permission (e.g. scheduling policy)</td>
</tr>
</tbody>
</table>
<hr />
<h2 id="523-joinable-vs-detached">5.2.3 Joinable vs detached</h2>
<p>Every thread is either <strong>joinable</strong> (default) or <strong>detached</strong>.</p>
<pre><code>   JOINABLE (default)                 DETACHED
   ─────────────────                  ────────
   must be pthread_join()'d           resources freed automatically on exit
   or pthread_detach()'d              cannot pthread_join()
   else → leak (kernel task slot,     good for fire-and-forget workers
           stack memory until joined)
</code></pre>
<blockquote>
<p><strong>The call ▸</strong>
<code>c
int pthread_join(pthread_t thread, void **retval);
int pthread_detach(pthread_t thread);
void pthread_exit(void *retval);
pthread_t pthread_self(void);</code></p>
</blockquote>
<table>
<thead>
<tr>
<th>Function</th>
<th>Semantics</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>pthread_join(t, &amp;rp)</code></td>
<td>Block until <code>t</code> exits; optionally collect return value via <code>rp</code></td>
</tr>
<tr>
<td><code>pthread_detach(t)</code></td>
<td>Mark <code>t</code> as detached; no join needed</td>
</tr>
<tr>
<td><code>pthread_exit(val)</code></td>
<td>Terminate <strong>calling</strong> thread; <code>val</code> available to joiner</td>
</tr>
<tr>
<td><code>pthread_self()</code></td>
<td>Return caller&rsquo;s <code>pthread_t</code> handle</td>
</tr>
</tbody>
</table>
<p><strong>Pitfall ▸</strong> Returning a pointer to a <strong>stack local</strong> from the start routine and
reading it in the joiner is use-after-free. Return heap memory, static storage, or
pass results through a structure protected by a mutex.</p>
<p><strong>Pitfall ▸</strong> Joining a detached thread, joining twice, or joining yourself →
undefined behavior / <code>EINVAL</code>.</p>
<hr />
<h2 id="524-returning-values">5.2.4 Returning values</h2>
<pre><code class="language-c">static void *worker(void *arg) {
    long id = (long)arg;
    long *result = malloc(sizeof *result);
    if (result == NULL)
        pthread_exit(NULL);
    *result = id * id;
    return result;              /* equivalent to pthread_exit(result) */
}

void *rp = NULL;
if (pthread_join(t, &amp;rp) != 0) { /* handle error */ }
if (rp != NULL) {
    printf(&quot;result = %ld\\n&quot;, *(long *)rp);
    free(rp);
}
</code></pre>
<p>Only <code>pthread_join</code> (or <code>pthread_exit</code> in a cancellation handler) communicates the
return value. There is no global &ldquo;thread return register.&rdquo;</p>
<hr />
<h2 id="525-thread-attributes">5.2.5 Thread attributes</h2>
<blockquote>
<p><strong>The call ▸</strong>
<code>c
int pthread_attr_init(pthread_attr_t *attr);
int pthread_attr_destroy(pthread_attr_t *attr);
int pthread_attr_setdetachstate(pthread_attr_t *attr, int detachstate);
int pthread_attr_setstacksize(pthread_attr_t *attr, size_t stacksize);
int pthread_attr_getstacksize(const pthread_attr_t *attr, size_t *stacksize);</code>
<code>detachstate</code>: <code>PTHREAD_CREATE_JOINABLE</code> or <code>PTHREAD_CREATE_DETACHED</code>.</p>
</blockquote>
<p>Default stack size is platform-dependent (often 2–8 MB on Linux). Deep recursion or
large stack frames may need an explicit increase — but thousands of 8 MB stacks will
exhaust virtual memory.</p>
<p><strong>Trade-offs ▸</strong> Larger stacks → simpler C code, higher memory footprint. Detached
threads → no join latency, but harder to propagate errors back to main.</p>
<hr />
<h2 id="526-complete-create--join-example">5.2.6 Complete create + join example</h2>
<pre><code class="language-c">#include &lt;errno.h&gt;
#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;

static void *worker(void *arg) {
    const char *name = arg;
    fprintf(stderr, &quot;[%s] TID via pthread_self: %lu\\n&quot;,
            name, (unsigned long)pthread_self());
    return (void *)(strlen(name));   /* return value = length */
}

static void check_pthread(int err, const char *what) {
    if (err != 0) {
        fprintf(stderr, &quot;%s: %s\\n&quot;, what, strerror(err));
        exit(1);
    }
}

int main(void) {
    pthread_t t1, t2;

    check_pthread(pthread_create(&amp;t1, NULL, worker, &quot;alpha&quot;), &quot;pthread_create&quot;);
    check_pthread(pthread_create(&amp;t2, NULL, worker, &quot;beta&quot;),  &quot;pthread_create&quot;);

    void *rv1 = NULL, *rv2 = NULL;
    check_pthread(pthread_join(t1, &amp;rv1), &quot;pthread_join&quot;);
    check_pthread(pthread_join(t2, &amp;rv2), &quot;pthread_join&quot;);

    printf(&quot;alpha returned %ld, beta returned %ld\\n&quot;,
           (long)rv1, (long)rv2);
    return 0;
}
</code></pre>
<pre><code class="language-bash">gcc -Wall -Wextra -pthread -o lifecycle lifecycle.c
./lifecycle
</code></pre>
<hr />
<h2 id="527-lifecycle-diagram">5.2.7 Lifecycle diagram</h2>
<pre><code>   pthread_create
         │
         ▼
   ┌─────────────┐
   │   RUNNING   │◀── pthread_self() identifies this thread
   └──────┬──────┘
          │ return from start_routine OR pthread_exit()
          ▼
   ┌─────────────┐
   │  TERMINATED │
   └──────┬──────┘
          │
    joinable? ──yes──▶ pthread_join() reaps thread resources
          │
          no (detached) ──▶ glibc/kernel reaps automatically
</code></pre>
<p>After all threads exit, only the <strong>main thread</strong> remaining allows clean process exit.
If main returns from <code>main()</code> while joinable threads still run, behavior is undefined
unless you join or detach them first.</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p>Pthread functions return <code>0</code> on success or a <strong>positive errno value</strong> on failure —
  they do not use the <code>-1</code>/<code>errno</code> syscall pattern.</p>
</li>
<li>
<p><code>pthread_create</code> starts a concurrent start routine; <code>pthread_join</code> waits and collects
  a return value; <code>pthread_detach</code> opts out of joining.</p>
</li>
<li>
<p>Use attributes for stack size and detach state; never return pointers to stack
  locals to the joiner.</p>
</li>
<li>
<p>Link with <code>-pthread</code>; under the hood, each thread is a <code>clone()</code>&lsquo;d task (Part 5.1).</p>
</li>
</ul>

<p>When threads share mutable state, you need <strong>mutual exclusion</strong>: a critical section
where at most one thread executes at a time. POSIX <strong>mutexes</strong> provide that guarantee;
<strong>read-write locks</strong> refine it for read-heavy workloads. Part 5.2 created concurrent
threads; this chapter makes shared updates correct — and explains the fast atomic path
vs the futex slow path (Part 5.5).</p>
<hr />
<h2 id="531-critical-sections-and-mutex-basics">5.3.1 Critical sections and mutex basics</h2>
<p><img alt="Mutex: one holder at a time" src="figures/mutex.svg" /></p>
<pre><code>   thread A          mutex           thread B

</code></pre>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <pthread.h></h1>
<p>int pthread_mutex_init(pthread_mutex_t <em>mutex,
                       const pthread_mutexattr_t </em>attr);
int pthread_mutex_destroy(pthread_mutex_t <em>mutex);
int pthread_mutex_lock(pthread_mutex_t </em>mutex);
int pthread_mutex_trylock(pthread_mutex_t <em>mutex);

<p>/<em> static initializer (default attrs): </em>/
pthread_mutex_t m = PTHREAD_MUTEX_INITIALIZER;
<code>\`\`
**Returns:**</code>0<code>on success; errno value on failure (</code>pthread_*\` contract — Part 5.2).</p>
</blockquote>
<table>
<thead>
<tr>
<th>Operation</th>
<th>Behavior</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>lock</code></td>
<td>Acquire; block if held</td>
</tr>
<tr>
<td><code>trylock</code></td>

</tr>
</tbody>
</table>
<p><strong>Pitfall ▸</strong> Locking twice in the same thread with a <strong>normal</strong> mutex → deadlock

<blockquote>
<p><strong>The call ▸</strong>
<code>c
int pthread_mutexattr_settype(pthread_mutexattr_t *attr, int type);</code>
Types: <code>PTHREAD_MUTEX_NORMAL</code>, <code>PTHREAD_MUTEX_ERRORCHECK</code>,
<code>PTHREAD_MUTEX_RECURSIVE</code>, <code>PTHREAD_MUTEX_DEFAULT</code>.</p>
</blockquote>
<table>
<thead>
<tr>
<th>Type</th>
<th>Double-lock in same thread</th>
<th>Unlock without holding</th>
</tr>
</thead>
<tbody>
<tr>
<td>NORMAL (default)</td>

<p><strong>Under the hood ▸</strong> An uncontended mutex lock is a few <strong>atomic instructions</strong> in

<pre><code>   pthread_mutex_lock()

<h2 id="534-mutex-protected-counter-example">5.3.4 Mutex-protected counter example</h2>
<pre><code class="language-c">#include &lt;errno.h&gt;

#include &lt;stdio.h&gt;

#include &lt;string.h&gt;

static void check(int err, const char *what) {
    if (err != 0) {

    }

    for (int i = 0; i &lt; INCREMENTS; i++) {

        counter++;

    }

int main(void) {

    for (int i = 0; i &lt; NUM_THREADS; i++)

</code></pre>
<p>Without the mutex, <code>counter</code> would be corrupted by lost updates (Part 5.6). With it,
the result is deterministic.</p>

</code></pre>

<h2 id="535-read-write-locks">5.3.5 Read-write locks</h2>
<blockquote>
<p><strong>The call ▸</strong>
<code>c
int pthread_rwlock_init(pthread_rwlock_t *rwlock,
                        const pthread_rwlockattr_t *attr);
int pthread_rwlock_destroy(pthread_rwlock_t *rwlock);
int pthread_rwlock_rdlock(pthread_rwlock_t *rwlock);
int pthread_rwlock_wrlock(pthread_rwlock_t *rwlock);
int pthread_rwlock_tryrdlock(pthread_rwlock_t *rwlock);
int pthread_rwlock_trywrlock(pthread_rwlock_t *rwlock);
int pthread_rwlock_unlock(pthread_rwlock_t *rwlock);</code></p>
</blockquote>
<pre><code>   many readers OR one writer
   ┌─────────────────────────────────────┐
   │  rdlock  rdlock  rdlock   (OK)      │
   │  wrlock  ────────────────── blocks all │
   │  rdlock while writer active ── blocks  │
   └─────────────────────────────────────┘
</code></pre>
<p>Use rwlocks when reads dominate (config snapshot, cache lookup). Writes still
exclude everyone. <strong>Trade-offs ▸</strong> rwlocks have higher constant overhead than
mutexes; under heavy write contention they can be <em>slower</em> than a plain mutex.</p>
<p><strong>Pitfall ▸</strong> A thread holding a read lock must not upgrade to a write lock on the
same rwlock (deadlock on glibc/Linux). Drop read lock first, or re-design.</p>
<hr />
<h2 id="536-lock-ordering-and-deadlock">5.3.6 Lock ordering and deadlock</h2>
<p>Deadlock requires a cycle of waits:</p>
<pre><code>   thread 1:  lock(A) ──▶ wait(B)
   thread 2:  lock(B) ──▶ wait(A)
                  └── cycle ──┘
</code></pre>
<p><strong>Rules to avoid deadlock:</strong></p>
<ol>
<li><strong>Global lock order</strong> — always acquire <code>A</code> before <code>B</code> if both are ever needed.</li>
<li><strong>Trylock + backoff</strong> — <code>pthread_mutex_trylock</code>, release held locks, retry.</li>
<li><strong>Hold fewer locks, shorter</strong> — shrink critical sections.</li>
<li><strong>One lock</strong> — sometimes a coarser mutex beats a deadlock-prone fine-grained graph.</li>
</ol>
<pre><code>   ✓  all threads: mutex1 → mutex2 → mutex3
   ✗  thread A: m1→m2    thread B: m2→m1
</code></pre>
<p>Condition variables (Part 5.4) add a rule: <strong>always wait while holding the mutex</strong>
associated with that cond, and use the same lock ordering when multiple conds exist.</p>

<h2 id="summary">Summary</h2>
<ul>
<li>Mutexes serialize access to critical sections; pthread returns errno values, not <code>-1</code>.</li>
<li>Uncontended locks are user-space atomics; contention triggers <code>futex()</code> sleeps.</li>

<p>A mutex protects shared <strong>data</strong>; a <strong>condition variable</strong> lets threads <strong>wait for a
state change</strong> on that data without burning CPU. The canonical pattern is
<strong>mutex + predicate</strong>: lock, check a condition in a loop, wait if false, mutate,
signal, unlock. Part 5.3 covered mutexes; this chapter covers <code>pthread_cond_*</code> and
why the predicate loop is mandatory, not optional.</p>
<hr />
<h2 id="541-why-condition-variables-exist">5.4.1 Why condition variables exist</h2>
<pre><code>   WITHOUT cond var                    WITH cond var
   ─────────────────                   ─────────────
   lock(m)                             lock(m)
   while (!ready) {                    while (!ready)
     unlock(m);                          pthread_cond_wait(&amp;c, &amp;m);
     usleep(1000);  /* poll */         /* atomically: unlock + sleep */
     lock(m);                         }
   }                                   /* re-lock on wake */
   /* wasted CPU, latency */           /* kernel sleep until signal */
</code></pre>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <pthread.h></h1>
<p>int pthread_cond_init(pthread_cond_t <em>cond, const pthread_condattr_t </em>attr);
int pthread_cond_destroy(pthread_cond_t <em>cond);
int pthread_cond_wait(pthread_cond_t </em>cond, pthread_mutex_t <em>mutex);
int pthread_cond_timedwait(pthread_cond_t </em>restrict cond,
                           pthread_mutex_t <em>restrict mutex,
                           const struct timespec </em>restrict abstime);
int pthread_cond_signal(pthread_cond_t <em>cond);
int pthread_cond_broadcast(pthread_cond_t </em>cond);
<code>\`\`
**Returns:**</code>0\` on success; errno value on failure.</p>
</blockquote>
<hr />
<h2 id="542-the-mutex--predicate-pattern">5.4.2 The mutex + predicate pattern</h2>
<p>A condition variable has <strong>no memory of its own</strong> — it does not store &ldquo;ready&rdquo; or
&ldquo;queue non-empty.&rdquo; All state lives in your shared variables, protected by the mutex.</p>
<pre><code class="language-c">pthread_mutex_lock(&amp;m);
while (!predicate()) {          /* NOT if — always while */
    pthread_cond_wait(&amp;cv, &amp;m);
}
/* predicate true: act */
pthread_mutex_unlock(&amp;m);
</code></pre>
<p>Producer side:</p>
<pre><code class="language-c">pthread_mutex_lock(&amp;m);
/* make predicate true */
pthread_cond_signal(&amp;cv);       /* or broadcast */
pthread_mutex_unlock(&amp;m);
</code></pre>
<blockquote>
<p><strong>Under the hood ▸</strong> <code>pthread_cond_wait</code> atomically:
1. Adds caller to the cond&rsquo;s wait queue.
2. <strong>Unlocks</strong> <code>mutex</code>.
3. Blocks (futex sleep — Part 5.5).
4. On wake, <strong>re-acquires</strong> <code>mutex</code> before returning.</p>
</blockquote>
<p>You must re-check the predicate after wake because you re-acquire the lock in a
racy world where other threads may have changed state.</p>
<hr />
<h2 id="543-why-you-must-loop-spurious-wakeups">5.4.3 Why you must loop: spurious wakeups</h2>
<p>POSIX permits <strong><code>pthread_cond_wait</code> to return even though nobody signaled</strong> —
a <em>spurious wakeup</em>. The loop handles it:</p>
<pre><code class="language-c">while (queue_empty(&amp;q))

/* now queue_empty is reliably false under the lock */
</code></pre>
<p>Without the loop, a spurious wake would proceed with a false predicate → corruption.</p>
<hr />
<h2 id="544-why-you-must-loop-lost-wakeups">5.4.4 Why you must loop: lost wakeups</h2>
<p>Consider a broken <code>if</code> instead of <code>while</code>:</p>
<pre><code>   consumer                          producer
   lock(m)                           lock(m)
   if (count == 0)  /* true */       enqueue item; count = 1
   /* about to wait... */            signal(cv)
   wait(cv)  ← signal already sent   unlock(m)
   /* sleeps forever */              (lost wakeup)

<p>The signal does not queue for the future — it wakes threads <strong>already waiting</strong>. If
you check the predicate, fail to wait, or wait after the signal without re-checking,
you can miss the event. <strong><code>while</code> fixes both</strong> spurious wakeups and lost-wakeup races

<h2 id="545-signal-vs-broadcast">5.4.5 signal vs broadcast</h2>
<table>
<thead>
<tr>
<th>Call</th>
<th>Effect</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>pthread_cond_signal</code></td>
<td>Wake <strong>one</strong> waiter (efficient if one consumer suffices)</td>
</tr>
<tr>
<td><code>pthread_cond_broadcast</code></td>

</table>

wakeups cost scheduler work — signal is preferred for thread-pool job dispatch when
one worker will handle one job.</p>

<blockquote>
<p><strong>The call ▸</strong>

int pthread_cond_timedwait(pthread_cond_t *cond, pthread_mutex_t *mutex,

<table>
<thead>
<tr>
<th>Return</th>

</thead>
<tbody>

<h2 id="547-bounded-producerconsumer-queue">5.4.7 Bounded producer/consumer queue</h2>
<p>Fixed-size ring buffer: producers block when full, consumers when empty.</p>
<pre><code class="language-c">#include &lt;errno.h&gt;
#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;

#define CAP 8
#define ITEMS 20

typedef struct {
    int buf[CAP];
    int head, tail, count;
    int shutdown;
    pthread_mutex_t m;
    pthread_cond_t not_full;
    pthread_cond_t not_empty;
} queue_t;

static void queue_init(queue_t *q) {
    q-&gt;head = q-&gt;tail = q-&gt;count = q-&gt;shutdown = 0;
    pthread_mutex_init(&amp;q-&gt;m, NULL);
    pthread_cond_init(&amp;q-&gt;not_full, NULL);
    pthread_cond_init(&amp;q-&gt;not_empty, NULL);
}

static void check(int err, const char *what) {
    if (err != 0) {
        fprintf(stderr, &quot;%s: %s\\n&quot;, what, strerror(err));
        exit(1);
    }
}

static void queue_push(queue_t *q, int val) {
    check(pthread_mutex_lock(&amp;q-&gt;m), &quot;lock&quot;);
    while (q-&gt;count == CAP &amp;&amp; !q-&gt;shutdown)

    if (q-&gt;shutdown) {
        check(pthread_mutex_unlock(&amp;q-&gt;m), &quot;unlock&quot;);
        return;
    }
    q-&gt;buf[q-&gt;tail] = val;
    q-&gt;tail = (q-&gt;tail + 1) % CAP;
    q-&gt;count++;
    check(pthread_cond_signal(&amp;q-&gt;not_empty), &quot;signal&quot;);
    check(pthread_mutex_unlock(&amp;q-&gt;m), &quot;unlock&quot;);
}

static int queue_pop(queue_t *q, int *out) {
    check(pthread_mutex_lock(&amp;q-&gt;m), &quot;lock&quot;);
    while (q-&gt;count == 0 &amp;&amp; !q-&gt;shutdown)
        check(pthread_cond_wait(&amp;q-&gt;not_empty, &amp;q-&gt;m), &quot;wait not_empty&quot;);
    if (q-&gt;count == 0 &amp;&amp; q-&gt;shutdown) {
        check(pthread_mutex_unlock(&amp;q-&gt;m), &quot;unlock&quot;);
        return 0;   /* drained + shutdown */
    }

    q-&gt;head = (q-&gt;head + 1) % CAP;
    q-&gt;count--;

    check(pthread_mutex_unlock(&amp;q-&gt;m), &quot;unlock&quot;);
    return 1;
}

static void *producer(void *arg) {
    queue_t *q = arg;
    for (int i = 1; i &lt;= ITEMS; i++)
        queue_push(q, i);
    check(pthread_mutex_lock(&amp;q-&gt;m), &quot;lock&quot;);
    q-&gt;shutdown = 1;
    check(pthread_cond_broadcast(&amp;q-&gt;not_empty), &quot;broadcast&quot;);
    check(pthread_cond_broadcast(&amp;q-&gt;not_full), &quot;broadcast&quot;);
    check(pthread_mutex_unlock(&amp;q-&gt;m), &quot;unlock&quot;);
    return NULL;
}

    check(pthread_create(&amp;cons, NULL, consumer, &amp;q), &quot;create cons&quot;);
    check(pthread_join(prod, NULL), &quot;join prod&quot;);
    check(pthread_join(cons, NULL), &quot;join cons&quot;);
    return 0;

</code></pre>

<h2 id="summary">Summary</h2>
<ul>
<li>
<p>Condition variables coordinate on shared state; they do not store that state — your

<li>

<p>Mutexes and condition variables feel like pure library magic, but on Linux they bottom
out in <strong>atomics</strong> (lock-free CPU instructions) and the <strong><code>futex()</code></strong> syscall (fast

the C11 tools to build synchronization yourself and the kernel primitive that makes
blocking efficient.</p>
<hr />
<h2 id="551-c11-atomics-and-stdatomich">5.5.1 C11 atomics and stdatomic.h</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <stdatomic.h></h1>
<p>atomic_int counter = ATOMIC_VAR_INIT(0);
atomic_load(&amp;counter);
atomic_store(&amp;counter, 42);
atomic_fetch_add(&amp;counter, 1);
bool atomic_compare_exchange_strong(atomic_int <em>obj, int </em>expected, int desired);
\`\`\`</p>
</blockquote>
<p>C11 <code>_Atomic</code> types and <code>&lt;stdatomic.h&gt;</code> expose <strong>well-defined</strong> concurrent access — unlike
plain <code>int</code>, which races are undefined behavior (Part 5.6). C++ has <code>&lt;atomic&gt;</code> with
equivalent semantics.</p>
<pre><code class="language-c">#include &lt;stdatomic.h&gt;
#include &lt;stdio.h&gt;

int main(void) {
    atomic_int x = 0;
    atomic_store_explicit(&amp;x, 1, memory_order_release);
    int v = atomic_load_explicit(&amp;x, memory_order_acquire);
    printf(&quot;x = %d\\n&quot;, v);
    return 0;
}
</code></pre>
<p>Compile with <code>-std=c11</code> (or newer). No <code>-pthread</code> required for single-threaded atomics;
multi-threaded use still needs threads linked with <code>-pthread</code>.</p>
<hr />
<h2 id="552-memory-ordering-intuition">5.5.2 Memory ordering intuition</h2>
<p>Modern CPUs and compilers reorder memory operations for speed. Atomics carry an
explicit <strong>memory order</strong> that constrains visibility:</p>
<pre><code>   thread A                          thread B

   store data = 42                   load flag
   store flag = 1  (release)    →    if flag: read data  (acquire)
                                     must see 42 if flag seen
</code></pre>
<table>
<thead>
<tr>
<th>Order</th>
<th>Guarantee (simplified)</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>memory_order_relaxed</code></td>
<td>Atomicity only; no cross-thread ordering</td>
</tr>
<tr>
<td><code>memory_order_acquire</code></td>
<td>Subsequent loads/stores not hoisted before this load</td>
</tr>
<tr>
<td><code>memory_order_release</code></td>
<td>Prior loads/stores not sunk after this store</td>
</tr>
<tr>
<td><code>memory_order_acq_rel</code></td>
<td>Both acquire + release (read-modify-write ops)</td>
</tr>
<tr>
<td><code>memory_order_seq_cst</code></td>
<td>Global sequential consistency (default; strongest, often slowest)</td>
</tr>
</tbody>
</table>
<p><strong>Trade-offs ▸</strong> Default <code>seq_cst</code> is correct and easy to reason about. Hot paths
(lock internals, reference counts) use acquire/release pairs on specific words.
Mis-ordered relaxed atomics cause Heisenbugs — reach for TSan (Part 5.6) when tuning.</p>
<p><strong>Pitfall ▸</strong> Using <code>relaxed</code> for a flag guarding non-atomic data → data race on the
payload even if the flag itself is atomic. Pair release (publisher) with acquire
(consumer).</p>
<hr />
<h2 id="553-compare-and-swap-cas">5.5.3 Compare-and-swap (CAS)</h2>
<p>CAS is the workhorse of lock-free algorithms:</p>
<blockquote>
<p><strong>The call ▸</strong>
<code>c
bool atomic_compare_exchange_strong(atomic_int *obj,
                                    int *expected,
                                    int desired);</code>
Atomically: if <code>*obj == *expected</code>, set <code>*obj = desired</code> and return <code>true</code>; else
write current <code>*obj</code> into <code>*expected</code> and return <code>false</code>.</p>
</blockquote>
<pre><code>   CAS(&amp;lock, 0, 1):
   lock was 0  →  now 1, return success  (acquired)
   lock was 1  →  unchanged, return fail  (someone else holds)
</code></pre>
<p>Mutex fast paths, lock-free stacks, and hazard pointers all build on CAS loops.</p>

<h2 id="554-the-futex-syscall">5.5.4 The futex syscall</h2>
<p><img alt="Futex: userspace atomic + kernel wait queue" src="figures/futex.svg" /></p>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include_1">include <linux/futex.h></h1>
<h1 id="include_2">include <sys/syscall.h></h1>
<h1 id="include_3">include <unistd.h></h1>
<p>long futex(uint32_t <em>uaddr, int futex_op, uint32_t val,

/</em> glibc wraps this; application code rarely calls futex directly */
\`\`\`</p>
</blockquote>
<p><strong>Under the hood ▸</strong> &ldquo;Futex&rdquo; = <strong>FU</strong>tex = <strong>F</strong>ast <strong>U</strong>serspace mu<strong>TEX</strong>. The
userspace word (typically <code>0</code> = free, <code>1</code> = locked, <code>2</code> = locked + waiters) is
updated with atomics. <strong><code>futex()</code> is only called when you must sleep or wake.</strong></p>
<p>Common operations:</p>
<table>
<thead>
<tr>
<th>op</th>
<th>Role</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>FUTEX_WAIT</code></td>
<td>If <code>*uaddr == val</code>, sleep until woken</td>
</tr>
<tr>
<td><code>FUTEX_WAKE</code></td>
<td>Wake up to <code>val</code> waiters on <code>*uaddr</code></td>
</tr>
<tr>
<td><code>FUTEX_WAIT_BITSET</code> / <code>WAKE_BITSET</code></td>
<td>Priority inheritance, PI mutexes</td>
</tr>
</tbody>
</table>
<pre><code>   pthread_mutex_lock (contended):
   ───────────────────────────────
   1. CAS lock word 0→1 failed
   2. futex(FUTEX_WAIT, uaddr, 1)   /* sleep while word == 1 */

   pthread_mutex_unlock:
   ────────────────────
   1. atomic store 0
   2. futex(FUTEX_WAKE, uaddr, 1)     /* wake one waiter */
</code></pre>
<p><strong>Systems ▸</strong> <code>strace -e futex -f ./prog</code> is the microscope for pthread contention.
Thousands of futex waits per second → lock granularity or hold time problem.</p>
<hr />
<h2 id="555-spinlock-vs-futex-backed-lock">5.5.5 Spinlock vs futex-backed lock</h2>
<p><strong>Spinlock</strong> — CAS in a tight loop; no syscall while waiting:</p>
<pre><code class="language-c">#include &lt;stdatomic.h&gt;
#include &lt;sched.h&gt;

typedef atomic_int spinlock_t;

void spin_lock(spinlock_t *s) {
    while (!atomic_compare_exchange_strong(s, &amp;(int){0}, 1))
        sched_yield();   /* or pause instruction on x86 */
}

void spin_unlock(spinlock_t *s) {
    atomic_store(s, 0);
}
</code></pre>
<p><strong>Trade-offs ▸</strong></p>
<table>
<thead>
<tr>
<th>Spinlock</th>
<th>Futex-backed mutex</th>
</tr>
</thead>
<tbody>
<tr>
<td>✓ microsecond waits, low overhead</td>
<td>✓ doesn&rsquo;t burn CPU when blocked</td>
</tr>
<tr>
<td>✗ wastes cores under contention</td>
<td>✗ syscall + context switch on contention</td>
</tr>
<tr>
<td>✗ unfair, priority inversion risk</td>
<td>✓ integrates with scheduler</td>
</tr>
</tbody>
</table>
<p>Rule of thumb: spin only if hold time is <strong>shorter than</strong> roughly 2× context-switch
cost <em>and</em> you have spare cores. Otherwise use <code>pthread_mutex</code>.</p>
<p><strong>Futex-style lock sketch</strong> (simplified educational version):</p>
<pre><code class="language-c">#include &lt;errno.h&gt;
#include &lt;linux/futex.h&gt;
#include &lt;stdatomic.h&gt;
#include &lt;sys/syscall.h&gt;
#include &lt;unistd.h&gt;

static long sys_futex(uint32_t *uaddr, int op, uint32_t val) {
    return syscall(SYS_futex, uaddr, op, val, NULL, NULL, 0);
}

typedef atomic_uint futex_lock_t;

void futex_lock(futex_lock_t *lock) {
    uint32_t expected = 0;
    while (!atomic_compare_exchange_strong(lock, &amp;expected, 1)) {
        expected = 1;   /* wait while locked */
        sys_futex((uint32_t *)lock, FUTEX_WAIT, 1);
        expected = 0;
    }
}

void futex_unlock(futex_lock_t *lock) {
    atomic_store(lock, 0);
    sys_futex((uint32_t *)lock, FUTEX_WAKE, 1);
}
</code></pre>
<p>Real glibc mutexes add fairness, PI, adaptive spinning, and error checking — do not
ship this as production locking.</p>
<hr />
<h2 id="556-how-the-pieces-connect">5.5.6 How the pieces connect</h2>
<pre><code>   your code:  pthread_mutex_lock()
                      │
                      ▼
   glibc:  atomic ops on futex word
                      │
            uncontended ──▶ return (no syscall)
                      │
            contended  ──▶ futex(FUTEX_WAIT)
                      │
                      ▼
   kernel: wait queue on the futex address, schedule other threads
</code></pre>
<p>Condition variables use the same foundation: waiters sleep on a futex tied to the
cond&rsquo;s internal state; <code>signal</code>/<code>broadcast</code> issue <code>FUTEX_WAKE</code> (Part 5.4).</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p>C11 <code>&lt;stdatomic.h&gt;</code> provides race-free operations; choose memory orders deliberately
  (<code>relaxed</code> / <code>acquire</code> / <code>release</code> / <code>seq_cst</code>).</p>
</li>
<li>
<p>CAS enables lock-free structures and mutex fast paths.</p>
</li>
<li>
<p><code>futex()</code> sleeps and wakes on a userspace word — pthread mutexes and condvars use it
  only on contention.</p>
</li>
<li>
<p>Spinlocks for very short critical sections; futex-backed mutexes for general use.</p>
</li>
</ul>

<p>Threads make programs fast and shared-memory simple — until they make bugs <strong>non-deterministic</strong>.
This chapter catalogs the failure modes that survive code review: data races, deadlock,
ABA, false sharing, thread-unsafe libc, signals crossing threads, and what ThreadSanitizer
(TSan) catches. Parts 5.1–5.5 gave you the tools; here is where they go wrong in production.</p>
<hr />
<h2 id="561-data-races-and-undefined-behavior">5.6.1 Data races and undefined behavior</h2>
<p>A <strong>data race</strong> occurs when two threads access the same memory location, at least one
is a write, and neither uses synchronization. In C/C++, that is <strong>undefined behavior</strong> —
not &ldquo;maybe wrong,&rdquo; but license for the compiler and CPU to do anything.</p>
<pre><code>   thread A              shared int x              thread B
      │                      0                         │
      │── x++ (read 0) ────────────────────────────────│── x++ (read 0)
      │── write 1 ─────────────────────────────────────│── write 1
      │                      1  (expected 2) ✗
</code></pre>
<p><strong>Fixes:</strong> mutex (Part 5.3), atomics with correct ordering (Part 5.5), or confine
mutation to one thread and pass messages (queues — Part 5.4).</p>
<p><strong>Pitfall ▸</strong> &ldquo;It works on my machine&rdquo; — races are timing-dependent. A billion correct
runs prove nothing.</p>
<p><strong>Systems ▸</strong> Compile with <code>-fsanitize=thread</code> (TSan) to catch races at runtime:</p>
<pre><code class="language-bash">gcc -fsanitize=thread -g -pthread -o prog prog.c
./prog
# WARNING: ThreadSanitizer: data race (pid=...)
</code></pre>
<p>TSan instruments every load/store; expect ~5–15× slowdown — dev/CI only.</p>
<hr />
<h2 id="562-deadlock-and-livelock">5.6.2 Deadlock and livelock</h2>
<p><strong>Deadlock</strong> — threads cycle waiting for locks (Part 5.3 lock ordering).</p>
<pre><code>   T1: lock(A) ──wait(B)     T2: lock(B) ──wait(A)
              └──── cycle ────┘
</code></pre>
<p><strong>Livelock</strong> — threads aren&rsquo;t blocked but make no progress (e.g. both trylock, fail,
yield, retry forever). Looks alive in <code>top</code>, accomplishes nothing.</p>
<table>
<thead>
<tr>
<th>Symptom</th>
<th>Mechanism</th>
</tr>
</thead>
<tbody>
<tr>
<td>Frozen app, low CPU</td>
<td>Classic deadlock</td>
</tr>
<tr>
<td>High CPU, no work done</td>
<td>Spinning / livelock</td>
</tr>
<tr>
<td>One thread stuck</td>
<td>Self-deadlock on non-recursive mutex</td>
</tr>
</tbody>
</table>
<p>Mitigations: global lock order, lock timeouts (<code>trylock</code> + backoff), lock hierarchy
with <code>std::lock</code>-style all-or-nothing acquisition in C++.</p>
<hr />
<h2 id="563-the-aba-problem">5.6.3 The ABA problem</h2>
<p>Lock-free algorithms using CAS can fail when a location <strong>changes A → B → A</strong> between
your load and CAS — the CAS succeeds even though the structure changed underneath.</p>
<pre><code>   stack top = A
   thread 1: read A, prepare pop
   thread 2: pop A, pop B, push A   (top is A again)

reclamation (used in kernel RCU). <strong>Trade-offs ▸</strong> Lock-free structures are hard to
get right — prefer mutexes unless profiling demands otherwise.</p>
<hr />
<h2 id="564-false-sharing">5.6.4 False sharing</h2>
<p>Two threads modify <strong>different variables</strong> that live on the <strong>same cache line</strong> (typically
64 bytes). CPUs cache at line granularity — each write invalidates the other&rsquo;s core,
destroying scalability.</p>
<pre><code>   cache line [ counter_a | counter_b | padding... ]

<pre><code class="language-c">#include &lt;stdatomic.h&gt;

    atomic_long count;

} padded_counter_t;
</code></pre>
<p><strong>Systems ▸</strong> <code>perf c2c</code> (Linux) detects false sharing on supported hardware.</p>
<hr />
<h2 id="565-thread-safety-of-libc">5.6.5 Thread-safety of libc</h2>
<p>Not all libc functions are thread-safe. Categories:</p>
<table>
<thead>
<tr>
<th>Safe</th>
<th>Unsafe / caveats</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>read</code>, <code>write</code>, <code>open</code>, <code>close</code> on <strong>different fds</strong></td>
<td>Same fd without sync (Part 5.1)</td>
</tr>
<tr>
<td><code>malloc</code> / <code>free</code> (glibc: per-arena locking)</td>
<td><code>strtok</code> — static internal state</td>
</tr>
<tr>
<td><code>strerror_r</code> (preferred)</td>
<td><code>strerror</code> — may use static buffer</td>
</tr>
<tr>
<td><code>snprintf</code>, <code>memcpy</code></td>
<td><code>localtime</code>, <code>gethostbyname</code> (use <code>getaddrinfo</code>)</td>
</tr>
</tbody>
</table>
<p><strong>errno is thread-local (TLS).</strong> Each thread has its own <code>errno</code> (Part 0.4). A syscall
failure in thread A does not clobber thread B&rsquo;s <code>errno</code>. <strong>Pthread functions still do
not set <code>errno</code></strong> — they return the error code (Part 5.2).</p>
<pre><code class="language-c">/* ✓ per-thread reentrant */
char buf[128];
strtok_r(line, &quot; &quot;, &amp;saveptr);

/* ✗ shared static cursor */
strtok(line, &quot; &quot;);
</code></pre>
<p><strong>Pitfall ▸</strong> <code>printf</code>/<code>fprintf</code> lock a stdio mutex internally — safe but serializes
output and is slow on hot paths. Use per-thread buffers or <code>write()</code> to fds (Part 2.2).</p>
<hr />
<h2 id="566-signals-and-threads">5.6.6 Signals and threads</h2>
<p>Signals are process-oriented but <strong>delivered to one thread</strong> (Part 4.2). Which thread
is ambiguous unless you control it.</p>
<blockquote>
<p><strong>The call ▸</strong>
<code>c
int pthread_sigmask(int how, const sigset_t *restrict set,
                    sigset_t *restrict oldset);
int sigaction(int signum, const struct sigaction *act,
              struct sigaction *oldact);</code>
Block signals in worker threads with <code>pthread_sigmask</code>; dedicate one thread to
<code>sigwait()</code> / <code>signalfd</code> for async-safe handling.</p>
</blockquote>
<pre><code>   recommended pattern:
   ───────────────────
   worker threads:  pthread_sigmask(SIG_BLOCK, all_signals)
   main / sig thread: sigwait() → handle with async-signal-safe ops only
</code></pre>
<p><strong>Pitfall ▸</strong> Calling non-async-signal-safe functions (<code>malloc</code>, <code>printf</code>, most
pthread APIs) from a signal handler that interrupted another thread → deadlock if
the handler runs while the interrupted thread held a libc lock.</p>
<p><strong>Pitfall ▸</strong> <code>EINTR</code>: blocking syscalls (<code>read</code>, <code>accept</code>, <code>poll</code>) may return <code>-1</code>
with <code>errno == EINTR</code> when a signal arrives. Restart or handle explicitly (Part 4.2).</p>
<hr />
<h2 id="567-threadsanitizer-checklist">5.6.7 ThreadSanitizer checklist</h2>
<p>TSan reports:</p>
<ul>
<li>Data races on plain memory</li>
<li>Lock order inversions (potential deadlock)</li>
<li>Mutex misuse (unlock by wrong thread)</li>
</ul>
<p>It does <strong>not</strong> catch:</p>
<ul>
<li>Logical races (correct atomics, wrong algorithm)</li>
<li>ABA without special annotations</li>
<li>Deadlock that never happens in the test run</li>
</ul>
<p>Run TSan on integration tests with realistic concurrency; combine with stress tests
and <code>helgrind</code> (Valgrind) as a secondary tool where TSan isn&rsquo;t available.</p>
<hr />
<h2 id="568-pitfall-summary-diagram">5.6.8 Pitfall summary diagram</h2>
<pre><code>   concurrency bug taxonomy
   ┌─────────────────────────────────────────────────────────┐
   │  data race ──▶ UB, TSan, -fsanitize=thread              │
   │  deadlock  ──▶ lock order, trylock, graph analysis      │
   │  livelock  ──▶ backoff, don't busy-wait forever         │
   │  ABA       ──▶ version tags, hazard pointers            │
   │  false sharing ──▶ cache-line padding, perf c2c         │
   │  libc      ──▶ strtok_r, strerror_r, avoid handler UB   │
   │  signals   ──▶ pthread_sigmask, sigwait, EINTR          │
   └─────────────────────────────────────────────────────────┘
</code></pre>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p>Unsynchronized concurrent access to non-atomic memory is UB; use mutexes, atomics,
  or single-owner design.</p>
</li>
<li>
<p>Deadlock needs lock cycles; livelock wastes CPU without progress; ABA breaks naive CAS.</p>
</li>
<li>Pad per-thread hot fields to avoid false sharing on cache lines.</li>
<li>
<p><code>errno</code> is per-thread; pthread returns error codes directly; many libc APIs need
  <code>_r</code> reentrant variants.</p>
</li>
<li>
<p>Block signals in workers; handle async events on a dedicated thread; expect <code>EINTR</code>.</p>
</li>
<li>TSan is the first-line detector for races and lock misuse in development builds.</li>
</ul>

<p>A <strong>socket</strong> is a kernel object for network (or local) communication, exposed to your
program as a <strong>file descriptor</strong> (Part 0.5). You create it with <code>socket()</code>, name it with
<code>bind()</code> or <code>connect()</code>, move bytes with <code>read()</code>/<code>write()</code> or <code>send()</code>/<code>recv()</code>, and
release it with <code>close()</code>. Part 6.2–6.4 specialize for TCP, UDP, and Unix domain;
this chapter establishes the common model.</p>
<hr />
<h2 id="611-socket--domain-type-protocol">6.1.1 socket() — domain, type, protocol</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <sys/socket.h></h1>
<p>int socket(int domain, int type, int protocol);
<code>\`\`
**Returns:** new fd ≥ 0 on success; **-1** on error (</code>errno\` set).</p>
</blockquote>
<pre><code>   socket(domain, type, protocol)
         │
         ▼
   fd table[n] ──▶ open file description ──▶ socket inode (protocol state)
</code></pre>
<table>
<thead>
<tr>
<th>Parameter</th>
<th>Common values</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>domain</code></td>
<td><code>AF_INET</code> (IPv4), <code>AF_INET6</code> (IPv6), <code>AF_UNIX</code> (local — Part 6.4)</td>
</tr>
<tr>
<td><code>type</code></td>
<td><code>SOCK_STREAM</code> (reliable byte stream), <code>SOCK_DGRAM</code> (datagrams)</td>
</tr>
<tr>
<td><code>protocol</code></td>
<td><code>0</code> (pick default for domain+type), or <code>IPPROTO_TCP</code>, <code>IPPROTO_UDP</code></td>
</tr>
</tbody>
</table>
<p><strong>Errors ▸</strong></p>
<table>
<thead>
<tr>
<th>errno</th>
<th>When</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>EAFNOSUPPORT</code></td>
<td>Domain not supported</td>
</tr>
<tr>
<td><code>EINVAL</code></td>
<td>Unknown type/protocol combination</td>
</tr>
<tr>
<td><code>EMFILE</code> / <code>ENFILE</code></td>
<td>Per-process or system fd limit</td>
</tr>
<tr>
<td><code>ENOBUFS</code> / <code>ENOMEM</code></td>
<td>Kernel memory pressure</td>
</tr>
</tbody>
</table>
<p><strong>Pitfall ▸</strong> Forgetting <code>protocol = 0</code> with exotic combinations — usually you want
<code>socket(AF_INET, SOCK_STREAM, 0)</code> and let the kernel pick TCP.</p>
<hr />
<h2 id="612-sock_stream-vs-sock_dgram">6.1.2 SOCK_STREAM vs SOCK_DGRAM</h2>
<pre><code>   SOCK_STREAM (TCP)                 SOCK_DGRAM (UDP)
   ─────────────────                 ────────────────
   connection-oriented               connectionless
   reliable, ordered bytes           messages, may drop/reorder
   read() may return partial         recvfrom() = one datagram
   listen/accept (server)          bind only; no accept
   Part 6.2                          Part 6.3
</code></pre>
<p><strong>Trade-offs ▸</strong> TCP: complexity + latency (handshake) for reliability. UDP: you own
retransmission, ordering, and congestion — but lowest overhead for small, latency-bound
messages (DNS, gaming, QUIC builds on UDP).</p>
<hr />
<h2 id="613-sockaddr-structures-and-the-cast-idiom">6.1.3 sockaddr structures and the cast idiom</h2>

<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include--struct-sockaddr_in-sockaddr_in6-">include <netinet/in.h>   /<em> struct sockaddr_in, sockaddr_in6 </em>/</h1>
<h1 id="include--struct-sockaddr_un--part-64-">include <sys/un.h>       /<em> struct sockaddr_un — Part 6.4 </em>/</h1>
<h1 id="include--struct-sockaddr-sockaddr_storage-">include <sys/socket.h>   /<em> struct sockaddr, sockaddr_storage </em>/</h1>

<pre><code class="language-c">struct sockaddr_in addr;
memset(&amp;addr, 0, sizeof addr);
addr.sin_family = AF_INET;
addr.sin_port = htons(8080);

</code></pre>
<p><strong>Pitfall ▸</strong> Forgetting to zero the struct leaves garbage in padding bytes that
<code>bind()</code> rejects with <code>EADDRNOTAVAIL</code> or causes subtle bugs.</p>
<hr />
<h2 id="614-byte-order-htons-htonl-ntohs-ntohl">6.1.4 Byte order: htons, htonl, ntohs, ntohl</h2>
<p>Network protocols use <strong>big-endian</strong> byte order. Host order varies (x86-64 is little-endian).</p>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include_1">include <arpa/inet.h></h1>
<p>uint16_t htons(uint16_t hostshort);
uint16_t ntohs(uint16_t netshort);
uint32_t htonl(uint32_t hostlong);
uint32_t ntohl(uint32_t netlong);
\`\`\`</p>
</blockquote>
<pre><code>   port 8080 on x86 host:
   host memory:  0x901F  (little-endian bytes 1F 90)
   on wire:      0x1F90  (big-endian)  ← htons() produces this for sin_port
</code></pre>
<p>Always <code>htons()</code> on ports and <code>htonl()</code> on IPv4 addresses before stuffing into
<code>sockaddr_in</code>. Convert back with <code>ntohs</code>/<code>ntohl</code> when printing.</p>
<p>Modern alternative: <code>inet_pton</code> / <code>inet_ntop</code> handle address strings without manual
shifting.</p>
<hr />
<h2 id="615-a-socket-is-an-fd">6.1.5 A socket is an fd</h2>
<p>From Part 0.5, a socket fd participates in the same table as files and pipes:</p>
<table>
<thead>
<tr>
<th>Operation</th>
<th>Works on socket fd?</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>read</code> / <code>write</code></td>
<td>✓ (TCP connected; semantics vary)</td>
</tr>
<tr>
<td><code>close</code></td>
<td>✓</td>
</tr>
<tr>
<td><code>fcntl</code> (non-blocking, <code>FD_CLOEXEC</code>)</td>
<td>✓</td>
</tr>
<tr>
<td><code>dup</code> / <code>dup2</code></td>
<td>✓</td>
</tr>
<tr>
<td><code>poll</code> / <code>select</code> / <code>epoll</code></td>
<td>✓ (Part 6.6, Part 7.2)</td>
</tr>
<tr>
<td><code>lseek</code></td>
<td>✗ (<code>ESPIPE</code> / <code>EINVAL</code>)</td>
</tr>
</tbody>
</table>
<p><strong>Systems ▸</strong> <code>ss -tlnp</code> and <code>lsof -p PID</code> show socket fds alongside regular files.
<code>strace -e socket,bind,listen,accept,connect</code> traces the setup syscalls.</p>
<hr />
<h2 id="616-minimal-socket-creation">6.1.6 Minimal socket creation</h2>
<pre><code class="language-c">#include &lt;arpa/inet.h&gt;
#include &lt;netinet/in.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;
#include &lt;sys/socket.h&gt;
#include &lt;unistd.h&gt;

int main(void) {
    int fd = socket(AF_INET, SOCK_STREAM, 0);
    if (fd == -1) {
        perror(&quot;socket&quot;);
        exit(1);
    }

    struct sockaddr_in addr;
    memset(&amp;addr, 0, sizeof addr);
    addr.sin_family = AF_INET;
    addr.sin_addr.s_addr = htonl(INADDR_LOOPBACK);
    addr.sin_port = htons(0);   /* ephemeral port assigned by bind */

    if (bind(fd, (struct sockaddr *)&amp;addr, sizeof addr) == -1) {
        perror(&quot;bind&quot;);
        close(fd);
        exit(1);
    }

    socklen_t len = sizeof addr;
    if (getsockname(fd, (struct sockaddr *)&amp;addr, &amp;len) == -1) {
        perror(&quot;getsockname&quot;);
        close(fd);
        exit(1);
    }

    char ip[INET_ADDRSTRLEN];
    inet_ntop(AF_INET, &amp;addr.sin_addr, ip, sizeof ip);
    printf(&quot;listening socket fd=%d on %s:%u\\n&quot;,
           fd, ip, (unsigned)ntohs(addr.sin_port));

    close(fd);
    return 0;
}
</code></pre>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li><code>socket(domain, type, protocol)</code> returns an fd referencing a kernel socket object.</li>
<li><code>AF_INET</code>/<code>AF_INET6</code> for network; <code>SOCK_STREAM</code> (TCP) vs <code>SOCK_DGRAM</code> (UDP).</li>
<li>
<p>Address structures (<code>sockaddr_in</code>, <code>sockaddr_storage</code>) require zero-init and family-
  correct casts to <code>struct sockaddr *</code>.</p>
</li>
<li>
<p>Ports and multi-byte fields need <code>htons</code>/<code>htonl</code> before wire transmission.</p>
</li>
<li>Sockets are fds: <code>close</code>, <code>poll</code>, <code>fcntl</code>, and the Part 2 I/O rules apply.</li>
</ul>

<p>TCP provides a <strong>reliable, ordered byte stream</strong> between two endpoints. The server path is
<code>socket</code> → <code>bind</code> → <code>listen</code> → <code>accept</code>; the client path is <code>socket</code> → <code>connect</code>.
Part 6.1 introduced the socket fd; this chapter walks the full lifecycle with syscalls,
handshake mechanics, and a compilable echo pair.</p>
<hr />
<h2 id="621-server-and-client-flows">6.2.1 Server and client flows</h2>
<p><img alt="TCP server/client syscall sequence" src="figures/socket-sequence.svg" /></p>
<pre><code>   SERVER                              CLIENT
   ──────                              ──────
   socket()                            socket()
   bind(local addr)                    connect(server addr)
   listen(backlog)                           │
   accept() ◀────── SYN/SYN-ACK/ACK ──────────┘
        │                                  │
   new connected fd                    connected fd (same socket())
   read/write ◀──────────────────────▶ read/write
   close()                             close()
</code></pre>
<blockquote>
<p><strong>The call ▸</strong> — server setup
\`\`\`c</p>
<h1 id="include">include <sys/socket.h></h1>
<h1 id="include_1">include <netinet/in.h></h1>
<p>int bind(int sockfd, const struct sockaddr <em>addr, socklen_t addrlen);
int listen(int sockfd, int backlog);
int accept(int sockfd, struct sockaddr </em>restrict addr,
           socklen_t <em>restrict addrlen);
int connect(int sockfd, const struct sockaddr </em>addr, socklen_t addrlen);
<code>\`\`
All return</code>0<code>on success except</code>accept<code>/</code>connect<code>noted below; **-1** +</code>errno\` on error.</p>
</blockquote>
<table>
<thead>
<tr>
<th>Syscall</th>
<th>Success return</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>accept</code></td>
<td><strong>New fd</strong> for the connected socket (≥ 0)</td>
</tr>
<tr>
<td><code>connect</code></td>
<td><code>0</code> (TCP; may block until handshake completes)</td>
</tr>
</tbody>
</table>
<p><strong>Pitfall ▸</strong> <code>accept</code> returns a <strong>new</strong> fd. The listening fd stays open for more
connections. Never <code>read()</code> on the listening socket.</p>
<hr />
<h2 id="622-the-three-way-handshake">6.2.2 The three-way handshake</h2>
<p><img alt="TCP three-way handshake" src="figures/tcp-handshake.svg" /></p>
<pre><code>   client                          server
     │── SYN seq=x ──────────────────▶│
     │◀─ SYN-ACK seq=y, ack=x+1 ─────│
     │── ACK ack=y+1 ────────────────▶│
     │         ESTABLISHED            │
</code></pre>
<p><code>connect()</code> initiates the handshake; <code>accept()</code> returns after the kernel completes it
for an incoming connection. Until ESTABLISHED, data you <code>write()</code> may buffer or block.</p>
<p><strong>Under the hood ▸</strong> The kernel maintains TCP state machines per socket (CLOSED,
LISTEN, SYN_RECEIVED, ESTABLISHED, …). Your program sees blocking, <code>EAGAIN</code> (non-blocking),
or <code>poll</code> readiness (Part 6.6) — not individual SYN packets.</p>
<hr />
<h2 id="623-backlog">6.2.3 Backlog</h2>
<blockquote>
<p><strong>The call ▸</strong> <code>listen(sockfd, backlog)</code></p>
</blockquote>
<p><code>backlog</code> is the queue length for <strong>completed</strong> connections waiting for <code>accept()</code> (since
Linux 4.5+, also influenced by <code>somaxconn</code> sysctl). If the queue fills, new SYNs may be
dropped or clients see <code>ECONNREFUSED</code>.</p>
<p><strong>Trade-offs ▸</strong> Too small → connection failures under burst load. Too large → many idle
ESTABLISHED sockets consuming memory before your app accepts them. Size for peak connect
rate × accept latency.</p>
<hr />
<h2 id="624-io-on-the-connected-socket">6.2.4 I/O on the connected socket</h2>
<p>Use <code>read</code>/<code>write</code> or <code>recv</code>/<code>send</code> interchangeably for TCP (flags differ for MSG_OOB etc.).</p>
<p><strong>Pitfall ▸</strong> <code>read()</code> may return <strong>fewer bytes than requested</strong> (Part 2.2) — not a
short read &ldquo;error.&rdquo; Loop until buffer full or return 0 (peer closed).</p>

while (total &lt; (ssize_t)want) {
    ssize_t n = read(fd, buf + total, want - (size_t)total);
    if (n == 0) break;          /* orderly shutdown */
    if (n == -1) {
        if (errno == EINTR) continue;
        perror(&quot;read&quot;);
        break;
    }
    total += n;
}
</code></pre>
<p><code>write()</code> can also short-write — retry with pointer advance.</p>
<hr />
<h2 id="625-orderly-close-and-time_wait">6.2.5 Orderly close and TIME_WAIT</h2>
<blockquote>
<p><strong>The call ▸</strong>
<code>c
int shutdown(int sockfd, int how);   /* SHUT_RD, SHUT_WR, SHUT_RDWR */
int close(int fd);</code></p>
</blockquote>
<pre><code>   graceful close (typical):
   ─────────────────────────
   shutdown(fd, SHUT_WR)   /* send FIN; still can read remaining data */
   drain reads until 0
   close(fd)
</code></pre>
<p><strong>TIME_WAIT</strong> — the side that initiates active close keeps the quad (src/dst IP+port)
in TIME_WAIT ~2× MSL (minutes on Linux) to handle stray packets. High-churn clients
opening many connections to the same server/port can exhaust ephemeral ports.</p>
<p>Mitigations: <code>SO_REUSEADDR</code> on server (Part 6.5), tune <code>ip_local_port_range</code>, or
design connection pooling. TIME_WAIT on server after client close is normal.</p>
<p><strong>Pitfall ▸</strong> <code>close()</code> without reading pending data may send RST instead of FIN →
client sees <code>ECONNRESET</code>. Always drain or use <code>SO_LINGER</code> deliberately (Part 6.5).</p>

<h2 id="626-minimal-echo-server">6.2.6 Minimal echo server</h2>
<pre><code class="language-c">#include &lt;arpa/inet.h&gt;
#include &lt;errno.h&gt;
#include &lt;netinet/in.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;
#include &lt;sys/socket.h&gt;
#include &lt;unistd.h&gt;

#define PORT    9090
#define BACKLOG 16
#define BUF_SZ  4096

static void die(const char *msg) {
    perror(msg);
    exit(1);
}

int main(void) {
    int listen_fd = socket(AF_INET, SOCK_STREAM, 0);
    if (listen_fd == -1)
        die(&quot;socket&quot;);

    int yes = 1;
    if (setsockopt(listen_fd, SOL_SOCKET, SO_REUSEADDR,
                   &amp;yes, sizeof yes) == -1)
        die(&quot;setsockopt&quot;);

    struct sockaddr_in addr;
    memset(&amp;addr, 0, sizeof addr);
    addr.sin_family = AF_INET;
    addr.sin_addr.s_addr = htonl(INADDR_ANY);
    addr.sin_port = htons(PORT);

    if (bind(listen_fd, (struct sockaddr *)&amp;addr, sizeof addr) == -1)
        die(&quot;bind&quot;);
    if (listen(listen_fd, BACKLOG) == -1)
        die(&quot;listen&quot;);

    fprintf(stderr, &quot;echo server on port %d\\n&quot;, PORT);

    for (;;) {
        int conn = accept(listen_fd, NULL, NULL);
        if (conn == -1) {
            if (errno == EINTR)
                continue;
            die(&quot;accept&quot;);
        }

        for (;;) {
            char buf[BUF_SZ];
            ssize_t n = read(conn, buf, sizeof buf);
            if (n == 0)
                break;
            if (n == -1) {
                if (errno == EINTR)
                    continue;
                perror(&quot;read&quot;);
                break;
            }
            ssize_t off = 0;
            while (off &lt; n) {
                ssize_t w = write(conn, buf + off, (size_t)(n - off));
                if (w == -1) {
                    if (errno == EINTR)
                        continue;
                    perror(&quot;write&quot;);
                    off = n;
                    break;
                }
                off += w;
            }
        }
        close(conn);
    }
}

<hr />
<h2 id="627-minimal-echo-client">6.2.7 Minimal echo client</h2>
<pre><code class="language-c">#include &lt;arpa/inet.h&gt;

#include &lt;netinet/in.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;

#include &lt;unistd.h&gt;

#define PORT 9090

static void die(const char *msg) {
    perror(msg);
    exit(1);
}

int main(void) {
    int fd = socket(AF_INET, SOCK_STREAM, 0);
    if (fd == -1)
        die(&quot;socket&quot;);

    struct sockaddr_in addr;
    memset(&amp;addr, 0, sizeof addr);
    addr.sin_family = AF_INET;
    addr.sin_port = htons(PORT);
    if (inet_pton(AF_INET, &quot;127.0.0.1&quot;, &amp;addr.sin_addr) != 1) {
        fprintf(stderr, &quot;invalid address\\n&quot;);
        exit(1);
    }

    if (connect(fd, (struct sockaddr *)&amp;addr, sizeof addr) == -1)
        die(&quot;connect&quot;);

    char line[256];
    while (fputs(&quot;&gt; &quot;, stdout), fgets(line, sizeof line, stdin) != NULL) {
        size_t len = strlen(line);
        ssize_t sent = 0;
        while (sent &lt; (ssize_t)len) {
            ssize_t n = write(fd, line + sent, len - (size_t)sent);
            if (n == -1) {
                if (errno == EINTR)
                    continue;
                die(&quot;write&quot;);
            }
            sent += n;
        }
        ssize_t n = read(fd, line, sizeof line - 1);
        if (n &lt;= 0)
            break;
        line[n] = '\\0';
        fputs(line, stdout);
    }

    close(fd);
    return 0;
}

<p><strong>Errors ▸</strong> (selected)</p>

<th>errno</th>
<th>When</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>EADDRINUSE</code></td>

<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p>TCP server: <code>socket</code> → <code>bind</code> → <code>listen</code> → <code>accept</code> (new fd per connection) →

</li>
<li>
