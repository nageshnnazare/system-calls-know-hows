  { name: `38. Sockets / Udp Sockets`, path: `06-sockets/03-udp-sockets.md`, dir: `06-sockets`, words: 763, mins: 4, body: `<h1 id="63--udp-sockets">6.3 — UDP Sockets</h1>
<p>UDP (<code>SOCK_DGRAM</code>) sends <strong>self-contained datagrams</strong> — no connection setup, no byte-stream
merging, no kernel retransmission. You get message boundaries and low latency; you accept
loss, duplication, and reordering unless your application fixes them. Part 6.2 covered TCP;
this chapter covers <code>sendto</code>/<code>recvfrom</code>, server <code>bind</code>, connected UDP, and MTU realities.</p>
<hr />
<h2 id="631-connectionless-datagram-model">6.3.1 Connectionless datagram model</h2>
<pre><code>   UDP server                         UDP client
   ──────────                         ──────────
   socket(SOCK_DGRAM)                 socket(SOCK_DGRAM)
   bind(fixed port)                   (optional bind)
   recvfrom() ◀──── datagram ──────── sendto(server_addr)
   sendto(client_addr, reply) ─────▶ recvfrom()
   no listen(), no accept()
</code></pre>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <sys/socket.h></h1>
<p>ssize_t sendto(int sockfd, const void <em>buf, size_t len, int flags,
               const struct sockaddr </em>dest_addr, socklen_t addrlen);
ssize_t recvfrom(int sockfd, void <em>buf, size_t len, int flags,
                 struct sockaddr </em>src_addr, socklen_t *addrlen);
<code>\`\`
**Returns:** byte count on success; **-1** +</code>errno\` on error.</p>
</blockquote>
<p>Each <code>sendto</code> becomes <strong>one datagram</strong> (up to size limits). Each <code>recvfrom</code> returns <strong>one
complete datagram</strong> — if your buffer is too small, excess bytes are <strong>discarded</strong> (many
stacks set <code>MSG_TRUNC</code> flag so you can detect truncation).</p>
<p><strong>Pitfall ▸</strong> Assuming <code>recvfrom</code> fills a stream like TCP — message boundaries are
preserved; one send = one recv (unless truncation).</p>
<hr />
<h2 id="632-server-bind-no-accept">6.3.2 Server bind, no accept</h2>
<p>A UDP server must <strong><code>bind()</code></strong> to a well-known port so clients can address it:</p>
<pre><code class="language-c">struct sockaddr_in addr;
memset(&amp;addr, 0, sizeof addr);
addr.sin_family = AF_INET;
addr.sin_addr.s_addr = htonl(INADDR_ANY);
addr.sin_port = htons(53);   /* example: DNS */

if (bind(fd, (struct sockaddr *)&amp;addr, sizeof addr) == -1)
    perror(&quot;bind&quot;);
</code></pre>
<p>There is no connection queue — datagrams arrive and sit in the socket receive buffer until
you <code>recvfrom</code> or the buffer overflows (silent drop).</p>
<p><strong>Errors ▸</strong></p>
<table>
<thead>
<tr>
<th>errno</th>
<th>When</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>EADDRINUSE</code></td>
<td>Port already bound</td>
</tr>
<tr>
<td><code>EMSGSIZE</code></td>
<td>Datagram exceeds path MTU without fragmentation (platform-dependent send path)</td>
</tr>
</tbody>
</table>
<hr />
<h2 id="633-unreliability-and-ordering">6.3.3 Unreliability and ordering</h2>
<pre><code>   sender:  D1  D2  D3
   network: D1  ✗   D3  D2  D2(duplicate)
   receiver must handle:
            • loss (timeout + retry)
            • reorder
            • duplication (IDs / dedup)
</code></pre>
<p><strong>Trade-offs ▸</strong> UDP shines when stale data is worthless (live video), when you implement
your own protocol (QUIC, game state), or when one request → one response fits in one
datagram (DNS). Use TCP when you want the kernel to handle reliability (Part 6.2).</p>
<hr />
<h2 id="634-connected-udp-sockets">6.3.4 Connected UDP sockets</h2>
<blockquote>
<p><strong>The call ▸</strong> <code>int connect(int sockfd, const struct sockaddr *addr, socklen_t addrlen);</code></p>
</blockquote>
<p>On a <strong>datagram</strong> socket, <code>connect()</code> does <strong>not</strong> perform a TCP handshake. It sets a
<strong>default peer address</strong> so you can use <code>send</code>/<code>write</code> and <code>recv</code>/<code>read</code> instead of
<code>sendto</code>/<code>recvfrom</code>:</p>
<pre><code class="language-c">connect(udp_fd, (struct sockaddr *)&amp;server, sizeof server);
send(udp_fd, &quot;ping&quot;, 4, 0);           /* always to server */
recv(udp_fd, buf, sizeof buf, 0);     /* only from connected peer (Linux) */
</code></pre>
<p>Benefits: simpler code, ICMP errors delivered as <code>ECONNREFUSED</code> on subsequent ops,
slightly faster sends (kernel caches route). You can <code>connect()</code> to change peer or
<code>connect(fd, NULL, 0)</code> on Linux to disconnect.</p>
<hr />
<h2 id="635-mtu-and-fragmentation">6.3.5 MTU and fragmentation</h2>
<p>Typical Ethernet MTU = <strong>1500 bytes</strong> → UDP payload ≈ <strong>1472 bytes</strong> (20 B IP + 8 B UDP
header). Larger datagrams may be <strong>IP-fragmented</strong> (bad for loss — lose one fragment,
lose whole datagram) or rejected.</p>
<p><strong>Systems ▸</strong> Stay under path MTU or implement path MTU discovery at application layer.
For LAN benchmarks, jumbo frames change the math. Loopback often allows larger sizes.</p>
<p><strong>Pitfall ▸</strong> Broadcasting/multicasting with oversized payloads — fragmentation + loss =
silent failure modes. Keep DNS-sized (≤512 legacy) or modern EDNS0 limits in mind.</p>
<hr />
<h2 id="636-udp-echo-example">6.3.6 UDP echo example</h2>
<pre><code class="language-c">#include &lt;arpa/inet.h&gt;
#include &lt;errno.h&gt;
#include &lt;netinet/in.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;
#include &lt;sys/socket.h&gt;
#include &lt;unistd.h&gt;

#define PORT 9091

static void die(const char *msg) {
    perror(msg);
    exit(1);
}

int main(void) {
    int fd = socket(AF_INET, SOCK_DGRAM, 0);
    if (fd == -1)
        die(&quot;socket&quot;);

    struct sockaddr_in addr;
    memset(&amp;addr, 0, sizeof addr);
    addr.sin_family = AF_INET;
    addr.sin_addr.s_addr = htonl(INADDR_ANY);
    addr.sin_port = htons(PORT);

    if (bind(fd, (struct sockaddr *)&amp;addr, sizeof addr) == -1)
        die(&quot;bind&quot;);

    for (;;) {
        char buf[2048];
        struct sockaddr_in peer;
        socklen_t peer_len = sizeof peer;

        ssize_t n = recvfrom(fd, buf, sizeof buf, 0,
                             (struct sockaddr *)&amp;peer, &amp;peer_len);
        if (n == -1) {
            if (errno == EINTR)
                continue;
            die(&quot;recvfrom&quot;);
        }

        char ip[INET_ADDRSTRLEN];
        inet_ntop(AF_INET, &amp;peer.sin_addr, ip, sizeof ip);
        fprintf(stderr, &quot;%zd bytes from %s:%u\\n&quot;,
                n, ip, (unsigned)ntohs(peer.sin_port));

        ssize_t sent = sendto(fd, buf, (size_t)n, 0,
                              (struct sockaddr *)&amp;peer, peer_len);
        if (sent != n)
            perror(&quot;sendto&quot;);
    }
}
</code></pre>
<p>Client one-liner test: <code>echo hello | nc -u 127.0.0.1 9091</code></p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>UDP is datagram-oriented: <code>sendto</code>/<code>recvfrom</code>, server <code>bind</code>, no <code>listen</code>/<code>accept</code>.</li>
<li>Message boundaries preserved; undersized <code>recvfrom</code> buffers truncate and drop excess.</li>
<li>Connected UDP (<code>connect</code> on datagram socket) sets default peer for <code>send</code>/<code>recv</code>.</li>
<li>Respect MTU; fragmentation hurts reliability; application owns retries and ordering.</li>
</ul>

<p><strong>Unix domain sockets</strong> (<code>AF_UNIX</code>) communicate between processes on the <strong>same host</strong> via
kernel memory — no IP stack, no port exhaustion, often half the latency of TCP loopback.
They support stream and datagram modes like TCP/UDP, plus superpowers: <strong>passing file
descriptors</strong> and <strong>peer credentials</strong>. Part 6.1&rsquo;s socket model applies; addressing uses
filesystem paths or the abstract namespace.</p>
<hr />
<h2 id="641-af_unix-stream-and-datagram">6.4.1 AF_UNIX stream and datagram</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <sys/un.h></h1>
<p>struct sockaddr_un {
    sa_family_t sun_family;   /<em> AF_UNIX </em>/
    char        sun_path[108];  /<em> pathname or abstract name </em>/
};
\`\`\`</p>
</blockquote>
<table>
<thead>
<tr>
<th>Type</th>
<th>Behavior</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>SOCK_STREAM</code></td>
<td>Reliable byte stream (like TCP) — <code>listen</code>/<code>accept</code>/<code>connect</code></td>
</tr>
<tr>
<td><code>SOCK_DGRAM</code></td>
<td>Datagram boundaries preserved (like UDP) — <code>sendto</code>/<code>recvfrom</code></td>
</tr>
</tbody>
</table>
<pre><code>   process A                    kernel                    process B
   unix stream socket ◀════ socket buffer ════▶ unix stream socket
   (no network stack traversal)
</code></pre>
<p><strong>Trade-offs ▸</strong> vs TCP <code>127.0.0.1</code>: lower overhead, fd passing, credential checks.
vs shared memory (Part 3.5): socket API gives framing + fd delivery; shm wins on bulk
throughput with careful synchronization.</p>
<hr />
<h2 id="642-filesystem-path-vs-abstract-namespace">6.4.2 Filesystem path vs abstract namespace</h2>
<p><strong>Path-bound</strong> — bind to a path in the filesystem:</p>
<pre><code class="language-c">struct sockaddr_un addr;
memset(&amp;addr, 0, sizeof addr);
addr.sun_family = AF_UNIX;
snprintf(addr.sun_path, sizeof addr.sun_path, &quot;/tmp/myapp.sock&quot;);

unlink(addr.sun_path);   /* remove stale socket file */
bind(fd, (struct sockaddr *)&amp;addr, sizeof addr);
</code></pre>
<p>Clients <code>connect()</code> to the same path. The inode persists until <code>unlink</code> + last <code>close</code>.</p>
<p><strong>Abstract namespace</strong> — Linux-specific; <strong>leading NUL</strong> in <code>sun_path[0]</code>, name in
<code>sun_path[1…]</code> (no filesystem entry):</p>
<pre><code class="language-c">addr.sun_path[0] = '\\0';
strncpy(addr.sun_path + 1, &quot;myapp.session&quot;, sizeof addr.sun_path - 2);
bind(fd, (struct sockaddr *)&amp;addr,
     offsetof(struct sockaddr_un, sun_path) + 1 + strlen(&quot;myapp.session&quot;));
</code></pre>
<p>No stale files on crash; not visible in <code>ls</code>. <strong>Pitfall ▸</strong> Abstract sockets are
Linux-only — not portable to BSD/macOS the same way.</p>
<hr />
<h2 id="643-socketpair">6.4.3 socketpair()</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include_1">include <sys/socket.h></h1>
<p>int socketpair(int domain, int type, int protocol, int sv[2]);
<code>\`\`
**Returns:**</code>0<code>on success; **-1** +</code>errno<code>.</code>sv[0]<code>and</code>sv[1]<code>are connected</code>AF_UNIX\` sockets.</p>
</blockquote>
<pre><code>   parent                                 child (after fork)
   sv[0] ◀══════════════════════════════▶ sv[1]
         bidirectional pipe-like channel
</code></pre>
<p>Classic pattern: <code>socketpair</code> + <code>fork</code> — parent keeps one end, child the other (Part 4.1
pipes compare). Unlike pipes, <code>socketpair</code> is <strong>full-duplex</strong> and supports <code>sendmsg</code> fd
passing.</p>
<pre><code class="language-c">int sv[2];
if (socketpair(AF_UNIX, SOCK_STREAM, 0, sv) == -1) {
    perror(&quot;socketpair&quot;);
    exit(1);
}
/* sv[0] ↔ sv[1] already connected — no bind/connect */
</code></pre>
<hr />
<h2 id="644-passing-file-descriptors-scm_rights">6.4.4 Passing file descriptors: SCM_RIGHTS</h2>
<p>Send an <strong>already open fd</strong> from one process to another via <code>sendmsg</code>/<code>recvmsg</code> and
<strong>ancillary data</strong> (<code>struct cmsghdr</code>).</p>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include_2">include <sys/socket.h></h1>
<p>ssize_t sendmsg(int sockfd, const struct msghdr <em>msg, int flags);
ssize_t recvmsg(int sockfd, struct msghdr </em>msg, int flags);
\`\`\`</p>
</blockquote>
<pre><code>   sender                              receiver
   sendmsg(data + SCM_RIGHTS fd=7)  →  recvmsg → new fd=3 (different number!)
                                       same open file description (Part 0.5)
</code></pre>
<p>Sender sketch:</p>
<pre><code class="language-c">char byte = 'F';
struct iovec io = { .iov_base = &amp;byte, .iov_len = 1 };

char cmsgbuf[CMSG_SPACE(sizeof(int))];
struct msghdr msg = { 0 };
msg.msg_iov = &amp;io;
msg.msg_iovlen = 1;
msg.msg_control = cmsgbuf;
msg.msg_controllen = sizeof cmsgbuf;

struct cmsghdr *c = CMSG_FIRSTHDR(&amp;msg);
c-&gt;cmsg_level = SOL_SOCKET;
c-&gt;cmsg_type  = SCM_RIGHTS;
c-&gt;cmsg_len   = CMSG_LEN(sizeof(int));
*(int *)CMSG_DATA(c) = fd_to_pass;

if (sendmsg(sock, &amp;msg, 0) == -1)
    perror(&quot;sendmsg&quot;);
</code></pre>
<p>Receiver: <code>recvmsg</code>, parse <code>CMSG_FIRSTHDR</code>, copy <code>*(int *)CMSG_DATA(c)</code> — a <strong>new</strong>
fd in the receiving process pointing at the shared file description.</p>
<p><strong>Pitfall ▸</strong> Must send at least one byte of regular data (some stacks require it) so
the receiver can distinguish fd-pass messages. Pass <code>O_CLOEXEC</code> fds if the child might
exec (Part 2.1).</p>
<hr />
<h2 id="645-scm_credentials">6.4.5 SCM_CREDENTIALS</h2>
<p>Linux can pass <strong>process credentials</strong> (PID, UID, GID) over <code>AF_UNIX</code> sockets for
authentication:</p>
<pre><code class="language-c">struct ucred cred = { .pid = getpid(), .uid = getuid(), .gid = getgid() };
struct cmsghdr *c = CMSG_FIRSTHDR(&amp;msg);
c-&gt;cmsg_level = SOL_SOCKET;
c-&gt;cmsg_type  = SCM_CREDENTIALS;
c-&gt;cmsg_len   = CMSG_LEN(sizeof cred);
memcpy(CMSG_DATA(c), &amp;cred, sizeof cred);
</code></pre>
<p>Enable on receiver with <code>setsockopt(SOL_SOCKET, SO_PASSCRED, …)</code> and verify peer before
trusting. <strong>Systems ▸</strong> systemd, D-Bus, and container runtimes use this pattern.</p>
<hr />
<h2 id="646-performance-vs-tcp-loopback">6.4.6 Performance vs TCP loopback</h2>
<p>Benchmarks vary by message size, but Unix sockets typically win on small messages because
data stays in-kernel without IP/TCP processing. For <strong>large bulk transfers</strong>, shared
memory or <code>splice</code>/<code>sendfile</code> (Part 7.4) may dominate.</p>
<table>
<thead>
<tr>
<th>Mechanism</th>
<th>fd passing</th>
<th>cross-host</th>
<th>typical latency</th>
</tr>
</thead>
<tbody>
<tr>
<td>TCP loopback</td>
<td>✗</td>
<td>✗ (same host only in practice)</td>
<td>higher</td>
</tr>
<tr>
<td>Unix stream</td>
<td>✓ SCM_RIGHTS</td>
<td>✗</td>
<td>lower</td>
</tr>
<tr>
<td>Pipe</td>
<td>✗</td>
<td>✗</td>
<td>similar, half-duplex</td>
</tr>
</tbody>
</table>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li><code>AF_UNIX</code> sockets use <code>sockaddr_un</code> — filesystem path or Linux abstract namespace.</li>
<li>Stream mode mirrors TCP; datagram mode mirrors UDP; <code>socketpair</code> gives connected pairs.</li>
<li>
<p><code>sendmsg</code>/<code>recvmsg</code> with <code>SCM_RIGHTS</code> duplicate fds across processes (same open file
  description, new fd number — Part 0.5).</p>
</li>
<li>
<p><code>SCM_CREDENTIALS</code> authenticates peers on local sockets; faster than TCP loopback for
  control-plane IPC.</p>
</li>
</ul>

<p><code>setsockopt</code> and <code>getsockopt</code> tune socket behavior without changing your application
protocol — reuse addresses, disable Nagle, resize buffers, set timeouts. Part 6.2
mentioned <code>SO_REUSEADDR</code> and TIME_WAIT; this chapter covers the options production
servers actually set.</p>
<hr />
<h2 id="651-the-setsockopt-interface">6.5.1 The setsockopt interface</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <sys/socket.h></h1>
<p>int getsockopt(int sockfd, int level, int optname,
               void <em>restrict optval, socklen_t </em>restrict optlen);
int setsockopt(int sockfd, int level, int optname,
               const void *optval, socklen_t optlen);
<code>\`\`
**Returns:**</code>0<code>on success; **-1** +</code>errno\` on error.</p>
</blockquote>
<table>
<thead>
<tr>
<th>Level</th>
<th>Scope</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>SOL_SOCKET</code></td>
<td>Generic (all socket types)</td>
</tr>
<tr>
<td><code>IPPROTO_TCP</code></td>
<td>TCP-only (<code>TCP_NODELAY</code>, …)</td>
</tr>
<tr>
<td><code>IPPROTO_IP</code> / <code>IPPROTO_IPV6</code></td>
<td>IP-layer options</td>
</tr>
</tbody>
</table>
<pre><code>   setsockopt(fd, SOL_SOCKET, SO_REUSEADDR, &amp;yes, sizeof yes)
        │
        ▼
   kernel socket structure fields updated in place
</code></pre>
<p><strong>Errors ▸</strong></p>
<table>
<thead>
<tr>
<th>errno</th>
<th>When</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>EINVAL</code></td>
<td>Unknown option or wrong level</td>
</tr>
<tr>
<td><code>ENOPROTOOPT</code></td>
<td>Option not supported for this socket type</td>
</tr>
<tr>
<td><code>EBADF</code></td>
<td>Not a socket fd</td>
</tr>
</tbody>
</table>
<hr />
<h2 id="652-so_reuseaddr-and-so_reuseport">6.5.2 SO_REUSEADDR and SO_REUSEPORT</h2>
<blockquote>
<p><strong>The call ▸</strong>
<code>c
int yes = 1;
setsockopt(fd, SOL_SOCKET, SO_REUSEADDR, &amp;yes, sizeof yes);
setsockopt(fd, SOL_SOCKET, SO_REUSEPORT, &amp;yes, sizeof yes);</code></p>
</blockquote>
<p><strong>SO_REUSEADDR</strong> — allows <code>bind()</code> to a port in <strong>TIME_WAIT</strong> from a <strong>previous</strong>
connection with the same local tuple (common on servers restarting quickly). Also allows
binding wildcard when a specific address is in TIME_WAIT (with nuances).</p>
<p><strong>SO_REUSEPORT</strong> (Linux) — multiple sockets <strong>bind to the same port</strong>; kernel load-
balances incoming connections across them. Enables <strong>multi-process</strong> accept pools
(nginx, SO_REUSEPORT workers) without a single accept bottleneck.</p>
<pre><code>   without REUSEADDR on restart:
   bind:8080 → EADDRINUSE (old socket in TIME_WAIT)

   with REUSEADDR:
   bind:8080 → OK (rules satisfied)
</code></pre>
<p><strong>Pitfall ▸</strong> <code>SO_REUSEADDR</code> does <strong>not</strong> mean &ldquo;two unrelated processes bind the same
port&rdquo; on all OSes — behavior differs. Use <code>SO_REUSEPORT</code> for deliberate sharing.</p>
<hr />
<h2 id="653-tcp_nodelay-nagles-algorithm">6.5.3 TCP_NODELAY (Nagle&rsquo;s algorithm)</h2>
<blockquote>
<p><strong>The call ▸</strong>
<code>c
int one = 1;
setsockopt(fd, IPPROTO_TCP, TCP_NODELAY, &amp;one, sizeof one);</code></p>
</blockquote>
<p>Nagle coalesces small writes until an outstanding segment is ACK&rsquo;d — reduces packet count,
adds latency for tiny messages (telnet, RPC, games).</p>
<p><strong>Trade-offs ▸</strong></p>
<table>
<thead>
<tr>
<th>Nagle ON (default)</th>
<th>TCP_NODELAY</th>
</tr>
</thead>
<tbody>
<tr>
<td>Fewer packets</td>
<td>Lower latency for small sends</td>
</tr>
<tr>
<td>Buffered small writes</td>
<td>More packets on wire</td>
</tr>
</tbody>
</table>
<p>Combine with <strong>TCP_CORK</strong> (Linux) or write buffering in application for bulk + low latency.</p>
<p><strong>Pitfall ▸</strong> Classic <strong>deadlock</strong>: thread sends small request with Nagle on while waiting
for reply before sending rest — pair with <code>TCP_NODELAY</code> or buffer full requests.</p>
<hr />
<h2 id="654-so_rcvbuf-and-so_sndbuf">6.5.4 SO_RCVBUF and SO_SNDBUF</h2>
<blockquote>
<p><strong>The call ▸</strong>
<code>c
int sz = 256 * 1024;
setsockopt(fd, SOL_SOCKET, SO_RCVBUF, &amp;sz, sizeof sz);
setsockopt(fd, SOL_SOCKET, SO_SNDBUF, &amp;sz, sizeof sz);</code></p>
</blockquote>
<p>Kernel <strong>doubles</strong> the value you set internally (documented Linux behavior) for overhead
accounting. Larger buffers absorb bursts without dropping (TCP backpressure) or blocking
sender — at memory cost per connection.</p>
<p><strong>Systems ▸</strong> Tune with <code>ss -tm</code> / <code>/proc/sys/net/core/rmem_max</code> caps. High-throughput
servers scale buffer size × connection count carefully.</p>
<hr />
<h2 id="655-so_keepalive">6.5.5 SO_KEEPALIVE</h2>
<blockquote>
<p><strong>The call ▸</strong>
<code>c
int yes = 1;
setsockopt(fd, SOL_SOCKET, SO_KEEPALIVE, &amp;yes, sizeof yes);</code></p>
</blockquote>
<p>Enables TCP keepalive probes on idle connections to detect dead peers (crashed host,
NAT timeout). Probe timing via <code>TCP_KEEPIDLE</code>, <code>TCP_KEEPINTVL</code>, <code>TCP_KEEPCNT</code>
(<code>IPPROTO_TCP</code>).</p>
<p><strong>Trade-offs ▸</strong> Detects half-open connections; adds idle traffic. Not a substitute for
application-level heartbeats with shorter deadlines.</p>
<hr />
<h2 id="656-so_linger">6.5.6 SO_LINGER</h2>
<blockquote>
<p><strong>The call ▸</strong>
<code>c
struct linger lg = { .l_onoff = 1, .l_linger = 5 };
setsockopt(fd, SOL_SOCKET, SO_LINGER, &amp;lg, sizeof lg);</code></p>
</blockquote>
<p>Controls <code>close()</code> behavior when unsent data exists:</p>
<table>
<thead>
<tr>
<th><code>l_onoff</code></th>
<th><code>l_linger</code></th>
<th>Effect</th>
</tr>
</thead>
<tbody>
<tr>
<td>0</td>
<td>—</td>
<td><code>close</code> returns immediately (default)</td>
</tr>
<tr>
<td>1</td>
<td>&gt; 0</td>
<td>Block up to <code>l_linger</code> seconds flushing data</td>
</tr>
<tr>
<td>1</td>
<td>0</td>
<td><strong>Abort</strong> — send RST, discard data</td>
</tr>
</tbody>
</table>
<p><strong>Pitfall ▸</strong> <code>l_linger = 0</code> causes RST — peer gets <code>ECONNRESET</code>. Use deliberately for
error paths, not graceful shutdown (prefer <code>shutdown(SHUT_WR)</code> — Part 6.2).</p>
<hr />
<h2 id="657-so_rcvtimeo-and-so_sndtimeo">6.5.7 SO_RCVTIMEO (and SO_SNDTIMEO)</h2>
<blockquote>
<p><strong>The call ▸</strong>
<code>c
struct timeval tv = { .tv_sec = 5, .tv_usec = 0 };
setsockopt(fd, SOL_SOCKET, SO_RCVTIMEO, &amp;tv, sizeof tv);</code></p>
</blockquote>
<p>Blocking <code>read</code>/<code>recv</code> returns <code>-1</code> with <code>EAGAIN</code>/<code>EWOULDBLOCK</code> after timeout (Linux
uses <code>EAGAIN</code>). Alternative: non-blocking fd + <code>poll</code>/<code>epoll</code> (Part 6.6) for finer control.</p>
<p>Modern code often prefers <code>poll</code> with timeout or <code>SO_RCVTIMEO</code> on worker threads only.</p>
<hr />
<h2 id="658-typical-server-bootstrap">6.5.8 Typical server bootstrap</h2>
<pre><code class="language-c">#include &lt;netinet/tcp.h&gt;
#include &lt;sys/socket.h&gt;
#include &lt;string.h&gt;

static int tune_server_socket(int fd) {
    int yes = 1;
    if (setsockopt(fd, SOL_SOCKET, SO_REUSEADDR, &amp;yes, sizeof yes) == -1)
        return -1;
#ifdef SO_REUSEPORT
    if (setsockopt(fd, SOL_SOCKET, SO_REUSEPORT, &amp;yes, sizeof yes) == -1)
        return -1;
#endif
    return 0;
}

static int tune_connected_tcp(int fd) {
    int nodelay = 1;
    if (setsockopt(fd, IPPROTO_TCP, TCP_NODELAY, &amp;nodelay, sizeof nodelay) == -1)
        return -1;
    int keep = 1;
    if (setsockopt(fd, SOL_SOCKET, SO_KEEPALIVE, &amp;keep, sizeof keep) == -1)
        return -1;
    return 0;
}
</code></pre>
<p>Apply <code>tune_server_socket</code> before <code>bind</code>; <code>tune_connected_tcp</code> on each <code>accept</code> fd if
needed.</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li><code>setsockopt</code>/<code>getsockopt(level, optname, …)</code> adjust kernel socket state in place.</li>
<li>
<p><code>SO_REUSEADDR</code> eases TIME_WAIT restart pain; <code>SO_REUSEPORT</code> enables multi-process
  accept on one port.</p>
</li>
<li>
<p><code>TCP_NODELAY</code> trades packets for latency; buffer sizes affect throughput vs memory.</p>
</li>
<li><code>SO_KEEPALIVE</code>, <code>SO_LINGER</code>, and <code>SO_RCVTIMEO</code> control idle detection, close behavior,
  and read timeouts.</li>
</ul>
<p>Next: <a href="06-io-multiplexing.md">6.6 — I/O multiplexing: select, poll &amp; epoll</a></p>` },
  { name: `41. Sockets / Io Multiplexing`, path: `06-sockets/06-io-multiplexing.md`, dir: `06-sockets`, words: 1095, mins: 5, body: `<h1 id="66--io-multiplexing-select-poll--epoll">6.6 — I/O Multiplexing: select, poll &amp; epoll</h1>
<p>A thread blocked in <code>accept()</code> or <code>read()</code> on one socket cannot serve others. <strong>I/O
multiplexing</strong> waits on <strong>many fds at once</strong> and returns those ready for I/O — the
foundation of the <strong>C10k problem</strong> (10 000 concurrent connections on one machine). Part 6.2
showed blocking TCP; Part 7.2 goes deeper on <code>epoll</code>; this chapter compares <code>select</code>,
<code>poll</code>, and <code>epoll</code> mechanically.</p>
<hr />
<h2 id="661-the-c10k-problem">6.6.1 The C10k problem</h2>
<pre><code>   blocking model (one thread per connection):
   ───────────────────────────────────────────
   10 000 connections → 10 000 threads
   → 10 000 stacks (GBs RAM), scheduler thrashing, context switches

   event-driven model (multiplexing):
   ─────────────────────────────────
   one thread (or few) + epoll_wait → handle only ready fds
</code></pre>
<p><strong>Systems ▸</strong> nginx, redis, and modern game servers combine non-blocking sockets +
<code>epoll</code> (or <code>io_uring</code> — Part 7.3) with worker threads for CPU-bound work (Part 5).</p>
<hr />
<h2 id="662-select">6.6.2 select()</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <sys/select.h></h1>
<p>int select(int nfds, fd_set <em>restrict readfds, fd_set </em>restrict writefds,
           fd_set <em>restrict exceptfds, struct timeval </em>restrict timeout);
<code>\`\`
**Returns:** count of ready fds;</code>0<code>on timeout; **-1** +</code>errno\`.</p>
</blockquote>
<pre><code>   user space                    kernel
   fd_set (bitmap)  ──copy──▶   scan fds 0..nfds-1  O(n)
   ◀── modified ────          set bits for ready fds
</code></pre>
<table>
<thead>
<tr>
<th>Aspect</th>
<th>Detail</th>
</tr>
</thead>
<tbody>
<tr>

<h2 id="667-minimal-epoll-echo-server-sketch">6.6.7 Minimal epoll echo server sketch</h2>
<pre><code class="language-c">#include &lt;errno.h&gt;
#include &lt;fcntl.h&gt;
#include &lt;netinet/in.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;
#include &lt;sys/epoll.h&gt;
#include &lt;sys/socket.h&gt;
#include &lt;unistd.h&gt;

#define MAX_EVENTS 64
#define PORT 9092

static void die(const char *msg) {
    perror(msg);
    exit(1);
}

static void set_nonblock(int fd) {
    int flags = fcntl(fd, F_GETFL, 0);
    if (flags == -1 || fcntl(fd, F_SETFL, flags | O_NONBLOCK) == -1)
        die(&quot;fcntl&quot;);
}

int main(void) {
    int listen_fd = socket(AF_INET, SOCK_STREAM, 0);
    if (listen_fd == -1)
        die(&quot;socket&quot;);

    int yes = 1;
    setsockopt(listen_fd, SOL_SOCKET, SO_REUSEADDR, &amp;yes, sizeof yes);

    struct sockaddr_in addr = { 0 };
    addr.sin_family = AF_INET;
    addr.sin_addr.s_addr = htonl(INADDR_ANY);
    addr.sin_port = htons(PORT);
    if (bind(listen_fd, (struct sockaddr *)&amp;addr, sizeof addr) == -1)
        die(&quot;bind&quot;);
    if (listen(listen_fd, 128) == -1)
        die(&quot;listen&quot;);

    int epfd = epoll_create1(EPOLL_CLOEXEC);
    if (epfd == -1)
        die(&quot;epoll_create1&quot;);

    struct epoll_event ev = { .events = EPOLLIN, .data.fd = listen_fd };
    if (epoll_ctl(epfd, EPOLL_CTL_ADD, listen_fd, &amp;ev) == -1)
        die(&quot;epoll_ctl&quot;);

    struct epoll_event events[MAX_EVENTS];

    for (;;) {
        int n = epoll_wait(epfd, events, MAX_EVENTS, -1);
        if (n == -1) {
            if (errno == EINTR)
                continue;
            die(&quot;epoll_wait&quot;);
        }

        for (int i = 0; i &lt; n; i++) {
            if (events[i].data.fd == listen_fd) {
                int conn = accept(listen_fd, NULL, NULL);
                if (conn == -1) {

                    continue;

                ev.data.fd = conn;

                    perror(&quot;epoll_ctl add&quot;);
            } else {
                char buf[4096];
                ssize_t r = read(events[i].data.fd, buf, sizeof buf);
                if (r &lt;= 0) {
                    close(events[i].data.fd);
                    continue;
                }
                write(events[i].data.fd, buf, (size_t)r);
            }
        }
    }
}
</code></pre>
<p>Requires <code>fcntl.h</code> for <code>O_NONBLOCK</code>. Simplified — production code handles
partial writes and <code>EPOLLRDHUP</code>.</p>

<p>Every <code>read()</code>, <code>write()</code>, <code>accept()</code>, and <code>connect()</code> on a socket or pipe either
<strong>blocks</strong> the calling thread until the kernel can complete the operation, or
<strong>returns immediately</strong> with a status code that tells you to try again later. That

is perfectly fine.</p>
<hr />
<h2 id="711-the-four-io-models">7.1.1 The four I/O models</h2>
<p><img alt="The four I/O models: blocking, non-blocking+poll, multiplexing, async" src="figures/io-models.svg" /></p>
<pre><code>   Model 1 — BLOCKING (default)
   ─────────────────────────────
   thread ──read()──▶ kernel waits for data ──▶ returns bytes
          (thread asleep; scheduler runs other tasks)

   Model 2 — NON-BLOCKING + poll loop
   ───────────────────────────────────
   thread ──read()──▶ EAGAIN (no data yet)
          ──poll()──▶ blocks until readable
          ──read()──▶ returns bytes

   Model 3 — MULTIPLEXING (select / poll / epoll)
   ───────────────────────────────────────────────
   thread ──epoll_wait([fd1,fd2,...])──▶ returns ready set
          ──read/write each ready fd (usually non-blocking)

   Model 4 — ASYNCHRONOUS (io_uring, POSIX AIO)
   ────────────────────────────────────────────
   thread ──submit request──▶ continues other work
          ◀── completion notification ── result ready
</code></pre>
<table>
<thead>
<tr>
<th>Model</th>
<th>Syscall pattern</th>
<th>Thread blocked?</th>
<th>Scales to N fds?</th>
</tr>
</thead>
<tbody>
<tr>
<td>Blocking</td>
<td>one fd per thread</td>
<td>yes, on I/O</td>
<td>poor (thread explosion)</td>
</tr>
<tr>
<td>Non-blocking + poll</td>
<td>poll per fd</td>
<td>yes, on poll</td>
<td>poor</td>
</tr>
<tr>
<td>Multiplexing</td>
<td>one waiter, many fds</td>
<td>yes, on epoll_wait</td>
<td>excellent (Part 7.2)</td>
</tr>
<tr>
<td>Async</td>
<td>submit + reap</td>
<td>optional</td>
<td>excellent (Part 7.3)</td>
</tr>
</tbody>
</table>
<p><strong>Systems ▸</strong> nginx, Redis, and most event-driven servers use <strong>model 3</strong> (epoll +
non-blocking fds). Databases and storage engines increasingly use <strong>model 4</strong>
(io_uring). Model 1 remains correct for CLI tools, batch jobs, and low-concurrency
services.</p>

<h2 id="712-setting-non-blocking-mode">7.1.2 Setting non-blocking mode</h2>
<p>Two equivalent paths
to flip a descriptor into non-blocking mode:</p>
<pre><code class="language-c">// at open time
int fd = open(path, O_RDONLY | O_NONBLOCK);

// or at runtime via fcntl (Part 2.5)
int flags = fcntl(fd, F_GETFL);
if (flags == -1) { perror(&quot;F_GETFL&quot;); return -1; }
if (fcntl(fd, F_SETFL, flags | O_NONBLOCK) == -1) {
    perror(&quot;F_SETFL&quot;);
    return -1;
}
</code></pre>
<p>For sockets, <code>ioctl(fd, FIONBIO, &amp;one)</code> also works (Part 8.3) — same effect,
different API surface.</p>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <fcntl.h></h1>
<p>int fcntl(int fd, int cmd, &hellip;);
// F_GETFL / F_SETFL with O_NONBLOCK

<p><strong>Under the hood ▸</strong> When <code>O_NONBLOCK</code> is set, the kernel&rsquo;s wait queue hook for

<h2 id="713-eagain-and-ewouldblock">7.1.3 EAGAIN and EWOULDBLOCK</h2>
<p>On Linux, <code>EAGAIN</code> and <code>EWOULDBLOCK</code> are <strong>the same value</strong>. A non-blocking
operation that cannot proceed <strong>right now</strong> returns <code>-1</code> with one of these:</p>
<pre><code>   non-blocking read() on empty socket buffer

        │

</code></pre>
<p><strong>Errors ▸</strong></p>
<table>
<thead>
<tr>
<th>errno</th>
<th>when</th>
</tr>

<tbody>
<tr>

<h2 id="714-the-readiness-model">7.1.4 The readiness model</h2>
<p>Multiplexing syscalls (<code>select</code>, <code>poll</code>, <code>epoll_wait</code>) do <strong>not</strong> transfer data.
They answer one question: <strong>&ldquo;which fds can I read/write/accept without blocking
right now?&rdquo;</strong></p>
<pre><code>   epoll_wait returns: fd 7 is EPOLLIN (readable)
        │
        ▼

        │
        ▼
   read may return 1 byte, 4096 bytes, or EAGAIN (edge-triggered edge case)
</code></pre>
<p>This is <strong>level-triggered readiness</strong> by default: as long as data sits in the
socket buffer, <code>epoll_wait</code> keeps reporting <code>EPOLLIN</code>. Edge-triggered mode
(<code>EPOLLET</code>, Part 7.2) fires once per transition — you must drain until <code>EAGAIN</code>.</p>
<p><strong>Trade-offs ▸</strong> Readiness-based I/O keeps <strong>one thread</strong> serving thousands of
connections. The cost is application complexity: you become a manual scheduler,
buffering partial reads/writes yourself (Part 2.2 short-read rules still apply).</p>
<hr />
<h2 id="715-when-blocking-is-fine">7.1.5 When blocking is fine</h2>
<p>Blocking I/O is not legacy — it is the right tool when:</p>
<pre><code>   ✓  one thread, one connection (simple client)
   ✓  low concurrency (≤ tens of concurrent I/O operations)
   ✓  thread-per-connection with bounded pool (some Java servlet containers)
   ✓  disk I/O on fast local SSD where thread count is modest
   ✓  code clarity matters more than tail latency (admin tools, cron jobs)

<p>Blocking fails when:</p>
<pre><code>   ✗  thousands of idle connections (each thread ≈ 8 MB stack + scheduler cost)

   ✗  syscall overhead dominates (Part 7.5)

<pre><code>   10 000 idle TCP connections

   blocking:  10 000 threads  →  ~80 GB virtual stack, context-switch storm
   epoll:     1 thread         →  one epoll_wait, O(ready) work per wakeup
</code></pre>

<pre><code class="language-c">#define _GNU_SOURCE
#include &lt;errno.h&gt;
#include &lt;fcntl.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;
#include &lt;unistd.h&gt;
#include &lt;poll.h&gt;

static int set_nonblock(int fd) {
    int flags = fcntl(fd, F_GETFL);
    if (flags == -1) return -1;
    return fcntl(fd, F_SETFL, flags | O_NONBLOCK);
}

static ssize_t read_all_nonblock(int fd, char *buf, size_t cap) {
    size_t total = 0;

        ssize_t n = read(fd, buf + total, cap - total);
        if (n &gt; 0) {
            total += (size_t)n;
            if (total == cap) break;
            continue;
        }
        if (n == 0) break;                    /* EOF */
        if (errno == EAGAIN || errno == EWOULDBLOCK) break;
        if (errno == EINTR) continue;
        return -1;

<hr />
<h2 id="summary">Summary</h2>
<ul>

</li>
<li>

</li>
</ul>

<p><code>epoll</code> is Linux&rsquo;s scalable I/O multiplexor: one syscall waits on <strong>many</strong> file
descriptors, and the kernel returns only those that are <strong>ready</strong> — O(number ready)
work per wakeup instead of O(total fds) like <code>select()</code>. Part 6.6 introduced the
API; this chapter goes mechanical: <code>epoll_ctl</code> bookkeeping, level- vs edge-triggered
semantics, <code>EPOLLONESHOT</code>, thundering herd, and a production-grade edge-triggered
accept loop.</p>
<hr />
<h2 id="721-architecture">7.2.1 Architecture</h2>
<p><img alt="epoll: epoll instance, interest list, ready list, epoll_wait" src="figures/epoll.svg" /></p>
<pre><code>   your process                          kernel
   ┌─────────────────┐                  ┌──────────────────────────┐

   │                 │                  │    interest list (rbtree)│
   │ monitored fds   │── epoll_ctl ADD  │    ready list (linked)   │
   │  sock 4, 7, 12  │                  │    wait queue for efd     │
   └────────┬────────┘                  └────────────┬─────────────┘
            │                                        │
            │  epoll_wait(efd, events, max, timeout) │
            │◀─────────── returns ready subset ──────┘
            │
            ▼
   for each event: read/write/accept on that fd (non-blocking!)
</code></pre>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <sys/epoll.h></h1>
<p>int epoll_create1(int flags);   /<em> EPOLL_CLOEXEC </em>/
int epoll_ctl(int epfd, int op, int fd, struct epoll_event <em>event);
int epoll_wait(int epfd, struct epoll_event </em>events,

<code>\`\`</code>epoll_create1<code>returns a new epoll fd.</code>epoll_ctl<code>registers interest.</code>epoll_wait\` blocks until ≥1 fd is ready or timeout elapses.</p>

<th><code>epoll_ctl</code> op</th>
<th>effect</th>

<h2 id="722-epoll_event-and-epoll_data">7.2.2 epoll_event and epoll_data</h2>
<pre><code class="language-c">typedef union epoll_data {
    void    *ptr;
    int      fd;
    uint32_t u32;
    uint64_t u64;
} epoll_data_t;

struct epoll_event {
    uint32_t     events;   /* EPOLLIN, EPOLLOUT, EPOLLERR, ... */
    epoll_data_t data;     /* user payload — NOT used by kernel for I/O */
};
</code></pre>
<p>The kernel <strong>stores</strong> <code>data</code> and returns it unchanged in <code>epoll_wait</code>. Common
patterns:</p>
<pre><code>   data.fd = sockfd          simple: event carries the fd
   data.ptr = conn_ctx *     preferred: pointer to per-connection state
</code></pre>
<p><strong>Pitfall ▸</strong> Setting <code>data.fd</code> but reading <code>event.data.ptr</code> (or vice versa) after
<code>epoll_wait</code>. The union is one slot — pick one convention per program.</p>
<p>Event bits (most used):</p>
<table>
<thead>
<tr>
<th>bit</th>
<th>meaning</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>EPOLLIN</code></td>
<td>readable (recv, accept on listening fd)</td>
</tr>
<tr>
<td><code>EPOLLOUT</code></td>
<td>writable (send buffer has space)</td>
</tr>
<tr>
<td><code>EPOLLERR</code></td>
<td>error condition — always check</td>
</tr>
<tr>
<td><code>EPOLLHUP</code></td>
<td>hang up (peer closed write side)</td>
</tr>
<tr>
<td><code>EPOLLET</code></td>
<td>edge-triggered (see below)</td>
</tr>
<tr>
<td><code>EPOLLONESHOT</code></td>
<td>one-shot (see below)</td>
</tr>
<tr>
<td><code>EPOLLEXCLUSIVE</code></td>
<td>exclusive wakeup (accept storm mitigation)</td>
</tr>
</tbody>
</table>

<h2 id="723-level-triggered-default-vs-edge-triggered">7.2.3 Level-triggered (default) vs edge-triggered</h2>
<p><strong>Level-triggered (LT)</strong> — default, no <code>EPOLLET</code>:</p>
<pre><code>   socket recv buffer:  [====data====]
                              │
   epoll_wait:  EPOLLIN fires
   read 1 byte: [===data=====]
   epoll_wait:  EPOLLIN fires again  ← still data left
</code></pre>
<p>As long as the condition holds (data in buffer), <code>epoll_wait</code> keeps reporting the
fd. Forgiving — you can read lazily.</p>
<p><strong>Edge-triggered (ET)</strong> — <code>events | EPOLLET</code>:</p>
<pre><code>   empty ──▶ data arrives ──▶ EPOLLIN (one edge)
   read partial ──▶ NO new edge until empty ──▶ full again ──▶ EPOLLIN
</code></pre>
<blockquote>
<p><strong>Under the hood ▸</strong> ET mode clears the &ldquo;already notified&rdquo; edge when the fd
transitions to not-ready. If you read one byte and stop, <strong>you will not get
another notification</strong> until the fd goes not-ready and ready again. You must
<strong>drain until <code>EAGAIN</code></strong>.</p>
</blockquote>
<p><strong>Pitfall ▸</strong> ET + blocking fd = deadlock risk in a shared event loop. ET + partial
read without drain = stuck connection until more data arrives.</p>
<p>ET drain pattern (mandatory):</p>
<pre><code class="language-c">for (;;) {
    ssize_t n = read(fd, buf, sizeof buf);
    if (n &gt; 0) { /* process */ continue; }
    if (n == 0) { /* EOF */ break; }
    if (errno == EAGAIN || errno == EWOULDBLOCK) break;
    if (errno == EINTR) continue;
    /* real error */
}
</code></pre>
<p><strong>Trade-offs ▸</strong> LT: simpler, slightly more wakeups. ET: fewer syscalls, stricter
discipline, higher bug rate if fds aren&rsquo;t non-blocking. nginx uses ET; many apps
use LT successfully.</p>
<hr />
<h2 id="724-epolloneshot">7.2.4 EPOLLONESHOT</h2>
<p><code>EPOLLONESHOT</code> disables the fd in the epoll set after one event until you
<code>EPOLL_CTL_MOD</code> re-arms it:</p>
<pre><code>   event fires ──▶ fd masked off ──▶ your handler runs (maybe in thread pool)
   handler done ──▶ epoll_ctl(MOD) re-enable
</code></pre>
<p>Useful with <strong>thread pools</strong>: one event dispatched to a worker; no other thread
gets a duplicate wakeup for the same fd until re-armed. Pairs naturally with
non-blocking I/O and careful serialization.</p>
<hr />
<h2 id="725-thundering-herd-and-epollexclusive">7.2.5 Thundering herd and EPOLLEXCLUSIVE</h2>
<p>When many threads block on the <strong>same</strong> epoll fd (or many processes on a
listening socket), one readiness event can wake <strong>all</strong> of them — the <strong>thundering
herd</strong>:</p>
<pre><code>   listen fd readable (many connections queued)
        │
        ▼
   wake thread 1, 2, 3, ... N   (all compete for accept)
        │
        ▼
   one wins, N-1 go back to sleep — wasted scheduler work
</code></pre>
<p><code>EPOLLEXCLUSIVE</code> (since Linux 4.5) on a listening fd: only <strong>one</strong> epoll waiter
gets woken per readiness edge. Combine with <code>EPOLLET</code> on the listen socket for
accept loops at high connection rates.</p>
<blockquote>
<p><strong>Under the hood ▸</strong> Exclusive wakeups use a flag on the wait queue entry so
the kernel stops after the first successful wakeup for that event.</p>
</blockquote>
<hr />
<h2 id="726-common-bugs-checklist">7.2.6 Common bugs checklist</h2>
<pre><code>   ✗  blocking I/O inside epoll handler
   ✗  ET without drain-until-EAGAIN
   ✗  forgetting EPOLLERR / EPOLLHUP handling
   ✗  ADD same fd twice (EEXIST)
   ✗  close(fd) without EPOLL_CTL_DEL (fd number reuse → wrong handler)
   ✗  epoll_wait maxevents too small — multiple events per fd need slots
   ✗  thundering herd on shared epoll fd without EPOLLEXCLUSIVE
</code></pre>
<p><strong>Errors ▸</strong></p>
<table>
<thead>
<tr>
<th>errno</th>
<th>when</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>EEXIST</code></td>
<td><code>EPOLL_CTL_ADD</code> on fd already in set</td>
</tr>
<tr>
<td><code>ENOENT</code></td>
<td><code>EPOLL_CTL_MOD</code>/<code>DEL</code> on fd not in set</td>
</tr>
<tr>
<td><code>EBADF</code></td>
<td>invalid epfd or fd</td>
</tr>
<tr>
<td><code>EINTR</code></td>
<td>signal during <code>epoll_wait</code> — retry</td>
</tr>
</tbody>
</table>
<p>Always <code>EPOLL_CTL_DEL</code> before <code>close</code>, or close the epoll fd last and let kernel
cleanup handle it — but fd reuse makes explicit DEL safer.</p>

<h2 id="727-minimal-edge-triggered-accept-loop">7.2.7 Minimal edge-triggered accept loop</h2>
<pre><code class="language-c">#define _GNU_SOURCE
#include &lt;errno.h&gt;
#include &lt;fcntl.h&gt;
#include &lt;netinet/in.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;
#include &lt;sys/epoll.h&gt;
#include &lt;sys/socket.h&gt;
#include &lt;unistd.h&gt;

static int set_nonblock(int fd) {
    int fl = fcntl(fd, F_GETFL);
    if (fl == -1) return -1;
    return fcntl(fd, F_SETFL, fl | O_NONBLOCK);
}

static int create_listener(uint16_t port) {
    int fd = socket(AF_INET, SOCK_STREAM, 0);
    if (fd == -1) return -1;

    int one = 1;
    setsockopt(fd, SOL_SOCKET, SO_REUSEADDR, &amp;one, sizeof one);

    struct sockaddr_in addr = {
        .sin_family = AF_INET,
        .sin_port   = htons(port),
        .sin_addr.s_addr = htonl(INADDR_ANY),
    };
    if (bind(fd, (struct sockaddr *)&amp;addr, sizeof addr) == -1) goto fail;
    if (listen(fd, SOMAXCONN) == -1) goto fail;
    if (set_nonblock(fd) == -1) goto fail;
    return fd;

fail:
    close(fd);
    return -1;
}

static void accept_drain(int efd, int listen_fd) {
    for (;;) {
        int conn = accept(listen_fd, NULL, NULL);
        if (conn == -1) {
            if (errno == EAGAIN || errno == EWOULDBLOCK) break;
            if (errno == EINTR) continue;
            perror(&quot;accept&quot;);
            break;
        }
        /* handle conn — register on efd with EPOLLIN | EPOLLET, etc. */
        fprintf(stderr, &quot;accepted fd %d\\n&quot;, conn);
        close(conn);
    }
}

int main(void) {
    int listen_fd = create_listener(8080);
    if (listen_fd == -1) { perror(&quot;listen&quot;); return 1; }

    int efd = epoll_create1(EPOLL_CLOEXEC);
    if (efd == -1) { perror(&quot;epoll_create1&quot;); return 1; }

    struct epoll_event ev = {
        .events = EPOLLIN | EPOLLET | EPOLLEXCLUSIVE,
        .data.fd = listen_fd,
    };
    if (epoll_ctl(efd, EPOLL_CTL_ADD, listen_fd, &amp;ev) == -1) {
        perror(&quot;epoll_ctl&quot;);
        return 1;
    }

    struct epoll_event events[64];
    for (;;) {
        int n = epoll_wait(efd, events, 64, -1);
        if (n == -1) {
            if (errno == EINTR) continue;
            perror(&quot;epoll_wait&quot;);
            return 1;
        }
        for (int i = 0; i &lt; n; i++) {
            if (events[i].data.fd == listen_fd)
                accept_drain(efd, listen_fd);
        }
    }
}
</code></pre>
<p>Pair with Part 6.2 (TCP sockets) and Part 7.1 (<code>O_NONBLOCK</code>). Part 7.3 covers
io_uring as an alternative when syscall batching matters more.</p>

<h2 id="summary">Summary</h2>
<ul>
<li>

<li>

</li>

</li>
<li>

</li>
<li>
<p>Delete from epoll before close, handle <code>EPOLLERR</code>/<code>EPOLLHUP</code>, never block in the
  handler.</p>
</li>
</ul>

<p>POSIX asynchronous I/O (<code>aio_read</code>, <code>aio_write</code>) promised &ldquo;submit and forget.&rdquo;
On Linux it disappointed: limited op types, thread-pool emulation in glibc, poor
socket support. <strong>io_uring</strong> (Linux 5.1+, mature by 5.10+) is the kernel-native
answer: shared <strong>submission</strong> and <strong>completion</strong> ring buffers mapped into your
address space, batched syscalls, and optional kernel-side polling. Part 7.2&rsquo;s epoll
tells you when to I/O; io_uring can <strong>perform</strong> the I/O asynchronously.</p>
<hr />
<h2 id="731-why-posix-aio-failed-on-linux">7.3.1 Why POSIX AIO failed on Linux</h2>
<pre><code>   POSIX AIO (libaio / glibc aio)
   ───────────────────────────────
   • historically disk-only in kernel
   • sockets often emulated with threads
   • no unified completion model
   • clunky API, poor ecosystem

   io_uring
   ────────
   • reads, writes, accept, connect, splice, fsync, ...
   • true async completion via CQ ring
   • batched io_uring_enter — one syscall, many ops
   • liburing wraps it cleanly
</code></pre>
<p><strong>Trade-offs ▸</strong> epoll + non-blocking I/O remains simpler for classic network
servers. io_uring wins when syscall rate, disk I/O depth, or mixed op types dominate
( databases, proxies, high-QPS storage ).</p>
<hr />
<h2 id="732-architecture-sq-and-cq-rings">7.3.2 Architecture: SQ and CQ rings</h2>
<p><img alt="io_uring: submission queue, completion queue, shared mmap rings" src="figures/io-uring.svg" /></p>
<pre><code>   user space                              kernel
   ┌─────────────────────────────────────────────────────────────┐
   │  SQ ring  ──▶  [ SQE | SQE | SQE | ... ]  tail/head indices │
   │  CQ ring  ◀──  [ CQE | CQE | ... ]                         │
   │  SQE array (mmap) — 64-byte submission entries               │
   └───────────────────────────┬─────────────────────────────────┘
                               │ io_uring_setup / io_uring_enter
                               ▼
                    kernel submits ops, posts completions
</code></pre>
<p>Three mmap regions from <code>io_uring_setup</code>:</p>
<ol>
<li><strong>SQ ring</strong> — indices + flags (<code>IORING_SQ_NEED_WAKEUP</code>)</li>
<li><strong>CQ ring</strong> — completion indices + overflow count</li>
<li><strong>SQEs</strong> — array of <code>struct io_uring_sqe</code> (your actual requests)</li>
</ol>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <linux/io_uring.h></h1>
<h1 id="include_1">include <sys/mman.h></h1>
<h1 id="include_2">include <unistd.h></h1>
<p>int io_uring_setup(unsigned entries, struct io_uring_params <em>p);
int io_uring_enter(int fd, unsigned to_submit, unsigned min_complete,
                   unsigned flags, sigset_t </em>sig);
int io_uring_register(int fd, unsigned opcode, void *arg, unsigned nr_args);
\`\`\`</p>
</blockquote>
<p><code>entries</code> must be power of two (e.g. 256). Returns an <strong>uring fd</strong> used for
subsequent calls. Most programs use <strong>liburing</strong> instead of raw syscalls.</p>
<blockquote>
<p><strong>Under the hood ▸</strong> You fill an SQE, advance the SQ tail. <code>io_uring_enter</code>
(or SQPOLL kernel thread) picks up entries, executes them, writes CQEs with
<code>user_data</code> and <code>res</code> (result or <code>-errno</code>). You reap CQEs by advancing CQ head.</p>
</blockquote>
<hr />
<h2 id="733-sqes-and-cqes">7.3.3 SQEs and CQEs</h2>
<p>Submission queue entry (conceptual fields):</p>
<pre><code>   struct io_uring_sqe {
       __u8    opcode;      /* IORING_OP_READ, WRITE, ACCEPT, ... */
       __s32   fd;
       __u64   off;
       __u64   addr;        /* buffer pointer */
       __u32   len;
       __u64   user_data;   /* echoed in CQE — your cookie */
       ...
   };
</code></pre>
<p>Completion queue entry:</p>
<pre><code>   struct io_uring_cqe {
       __u64   user_data;
       __s32   res;         /* byte count, or negative errno */
       __u32   flags;
   };
</code></pre>
<p>Typical flow:</p>
<pre><code>   1. io_uring_get_sqe()           grab empty SQE slot
   2. io_uring_prep_read(sqe,...)  fill opcode + args
   3. sqe-&gt;user_data = cookie
   4. io_uring_submit()            io_uring_enter — push to kernel
   5. io_uring_wait_cqe() / peek   reap completion
   6. cqe-&gt;res                     bytes transferred or -errno
   7. io_uring_cqe_seen()           advance CQ head
</code></pre>
<p><strong>Errors ▸</strong> (in <code>cqe-&gt;res</code>, negated errno)</p>
<table>
<thead>
<tr>
<th>value</th>
<th>when</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>-EAGAIN</code></td>
<td>non-blocking op not ready (if IOSQE_ASYNC)</td>
</tr>
<tr>
<td><code>-EBADF</code></td>
<td>invalid fd in SQE</td>
</tr>
<tr>
<td><code>-EINVAL</code></td>
<td>malformed SQE</td>
</tr>
<tr>
<td><code>-ENOMEM</code></td>
<td>kernel couldn&rsquo;t allocate for op</td>
</tr>
</tbody>
</table>
<hr />
<h2 id="734-sqpoll-zero-syscall-submission-mode">7.3.4 SQPOLL: zero-syscall submission mode</h2>
<p><code>IORING_SETUP_SQPOLL</code> spawns a <strong>kernel thread</strong> that polls the SQ ring:</p>
<pre><code>   without SQPOLL:  user ──io_uring_enter──▶ kernel (per batch)
   with SQPOLL:     kernel thread polls SQ ──▶ picks up SQEs automatically
                    user wakes kernel only if IORING_SQ_NEED_WAKEUP set
</code></pre>
<p>Requires root or <code>CAP_SYS_ADMIN</code> / <code>RLIMIT_MEMLOCK</code> on some configs. Trades CPU
(pinned kernel thread) for lower latency and fewer boundary crossings — useful at
extreme IOPS. Part 7.5 discusses syscall amortization.</p>
<hr />
<h2 id="735-liburing-high-level-api">7.3.5 liburing high-level API</h2>
<p>Install: <code>liburing-dev</code> (Debian/Ubuntu) or build from source. Link <code>-luring</code>.</p>
<pre><code class="language-c">#include &lt;liburing.h&gt;

struct io_uring ring;
io_uring_queue_init(256, &amp;ring, 0);          /* 256 SQ entries */
io_uring_queue_exit(&amp;ring);
</code></pre>
<p><code>io_uring_prep_*</code> helpers set opcode fields. <code>IOSQE_IO_LINK</code> chains ops (write
after read). <code>IORING_OP_READ_FIXED</code> uses registered buffers (zero-copy friendly).</p>

<h2 id="736-liburing-read-example">7.3.6 liburing read example</h2>

        io_uring_queue_exit(&amp;ring);

    struct io_uring_cqe *cqe;

    io_uring_queue_exit(&amp;ring);
    close(fd);
    return 0;
}

<h2 id="737-io_uring-vs-epoll">7.3.7 io_uring vs epoll</h2>
<pre><code>   ┌────────────────────┬─────────────────────┬─────────────────────┐
   │                    │ epoll               │ io_uring            │
   ├────────────────────┼─────────────────────┼─────────────────────┤
   │ Primary role       │ readiness notify      │ submit + complete   │

   │ Maturity / tooling │ universal on Linux    │ newer, fast moving  │
   │ Complexity         │ moderate              │ higher              │
   └────────────────────┴─────────────────────┴─────────────────────┘
</code></pre>
<p>Many designs combine both: io_uring for disk, epoll for network — or use
<code>IORING_OP_POLL_ADD</code> to integrate. Part 7.5 covers batching economics.</p>
<p><strong>Pitfall ▸</strong> Assuming io_uring replaces non-blocking discipline. Linked ops,

does not make your protocol state machine free.</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p>POSIX AIO on Linux was limited; io_uring provides kernel-native async I/O via
  mmap&rsquo;d SQ/CQ rings and <code>io_uring_setup</code> / <code>io_uring_enter</code> / <code>io_uring_register</code>.</p>
</li>
<li>

</li>

<li>epoll = readiness; io_uring = submission + completion — complementary, not always
  interchangeable.</li>
</ul>

<p>Every byte copied between kernel buffers and user space costs CPU cycles and cache
lines. A naive static-file HTTP server does <strong>four</strong> copies and <strong>four</strong> context
heavy trips for file→socket service. Zero-copy syscalls keep data in kernel space,
moving pages between subsystems without touching your <code>buf</code>. Part 3.3 (<code>mmap</code>) and
Part 7.5 (syscall batching) complement this chapter.</p>
<hr />
<h2 id="741-the-naive-path-read--write">7.4.1 The naive path: read() + write()</h2>
<p><img alt="Zero-copy paths vs read/write copies" src="figures/zero-copy.svg" /></p>
<pre><code>   DISK ──▶ page cache ──▶ copy ──▶ user buf ──▶ copy ──▶ socket skbuff ──▶ NIC
            (kernel)        ▲                    ▲
                            │                    │
                         read()               write()
                         (syscall)            (syscall)
</code></pre>
<p>Four copies (DMA → cache → user → cache → DMA) and two full user/kernel round
trips per chunk. For multi-GB file serving at 10 GbE, this dominates.</p>
<pre><code>   copy 1: disk → page cache        (DMA, unavoidable for cold cache)
   copy 2: page cache → user buf    (read)
   copy 3: user buf → socket buf    (write)
   copy 4: socket buf → NIC         (DMA)
</code></pre>
<p>Goal: eliminate copies 2 and 3.</p>
<hr />
<h2 id="742-sendfile">7.4.2 sendfile()</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <sys/sendfile.h></h1>
<p>ssize_t sendfile(int out_fd, int in_fd, off_t <em>offset, size_t count);
<code>\`\`
Transfer up to</code>count<code>bytes from</code>in_fd<code>(must be readable, usually regular
file) to</code>out_fd<code>(must be socket on Linux historically; now also file→file on
some kernels). If</code>offset<code>non-NULL, reads from</code></em>offset\` and advances it.</p>
</blockquote>
<pre><code>   page cache pages ──▶ splice-like path ──▶ socket skbuff ──▶ NIC
                        (no user-space buffer)
</code></pre>
<blockquote>
<p><strong>Under the hood ▸</strong> Kernel wires the file&rsquo;s page cache directly into the socket
send path (<code>tcp_sendpage</code> / <code>splice</code> internally). User never maps the bytes.</p>
</blockquote>
<pre><code class="language-c">#include &lt;fcntl.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;sys/sendfile.h&gt;
#include &lt;sys/socket.h&gt;
#include &lt;unistd.h&gt;

static int send_all_file(int out_fd, int in_fd) {

    struct stat st;
    if (fstat(in_fd, &amp;st) == -1) { perror(&quot;fstat&quot;); return -1; }

    }
    return 0;

<p><strong>Trade-offs ▸</strong> File must be in page cache for best results; cold reads still hit
disk. TLS encryption requires user-space plaintext — <code>sendfile</code> bypasses SSL
libraries. nginx uses <code>sendfile</code> for plain HTTP static files.</p>
<p><strong>Errors ▸</strong></p>
<table>
<thead>
<tr>
<th>errno</th>
<th>when</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>EINVAL</code></td>
<td>out_fd not socket (older kernels) or unsupported combo</td>
</tr>
<tr>
<td><code>EAGAIN</code></td>
<td>non-blocking socket not ready</td>
</tr>
<tr>
<td><code>EPIPE</code> / <code>ECONNRESET</code></td>
<td>peer closed</td>
</tr>
</tbody>
</table>
<hr />
<h2 id="743-splice-vmsplice-tee">7.4.3 splice(), vmsplice(), tee()</h2>
<p><strong>splice</strong> moves data between two fds <strong>without</strong> user space, via an internal
kernel pipe buffer:</p>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include_1">include <fcntl.h></h1>
<h1 id="define-_gnu_source">define _GNU_SOURCE</h1>
<h1 id="include_2">include <unistd.h></h1>
<p>ssize_t splice(int fd_in, loff_t <em>off_in, int fd_out, loff_t </em>off_out,
               size_t len, unsigned int flags);
\`\`\`</p>
</blockquote>
<p>At least one fd must be a pipe. Typical pattern: file → pipe → socket (two
splices) or file → pipe (one splice) depending on kernel support.</p>
<p>Flags:</p>
<table>
<thead>
<tr>
<th>flag</th>
<th>effect</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>SPLICE_F_MOVE</code></td>
<td>hint: move pages instead of copy (best-effort)</td>
</tr>
<tr>
<td><code>SPLICE_F_NONBLOCK</code></td>
<td>non-blocking</td>
</tr>
<tr>
<td><code>SPLICE_F_MORE</code></td>
<td>more data coming — batch TCP segments</td>
</tr>
</tbody>
</table>
<p><strong>vmsplice</strong> maps <strong>user</strong> pages into a pipe (opposite direction — user → kernel
pipe without copy). <strong>tee</strong> duplicates data in a pipe (one reader, two consumers).</p>
<pre><code>   file fd ──splice──▶ pipe ──splice──▶ socket fd
          (kernel)         (kernel)
</code></pre>
<p><strong>Pitfall ▸</strong> Forgetting the pipe intermediary — <code>splice</code> between file and socket
directly is not always supported; check <code>man splice</code> for your kernel.</p>
<hr />
<h2 id="744-msg_zerocopy-send-path">7.4.4 MSG_ZEROCOPY (send path)</h2>
<p>Since Linux 4.14, <code>send()</code>/<code>sendmsg()</code> with <code>MSG_ZEROCOPY</code> on TCP can avoid copying
user buffers into skbuffs — the NIC DMAs from pinned user pages:</p>
<pre><code class="language-c">send(sockfd, buf, len, MSG_ZEROCOPY);
/* completion notification via SO_EE_ORIGIN_ZEROCOPY / errqueue */
</code></pre>
<p>You <strong>must</strong> reap completions (via <code>recvmsg</code> + <code>MSG_ERRQUEUE</code> or <code>SO_ZEROCOPY</code>)
before reusing the buffer — async ownership transfer. High complexity; wins at large
payloads and high throughput.</p>
<hr />
<h2 id="745-mmap-based-approaches">7.4.5 mmap-based approaches</h2>
<p>Part 3.3&rsquo;s <code>mmap()</code> maps file pages into your address space:</p>
<pre><code>   mmap file ──▶ read by touching pages (no read() syscall per chunk)
   write(sock, mapped_region, len)  ──▶ still copies to socket unless sendfile
</code></pre>
<p><code>mmap</code> + <code>write</code> eliminates the <code>read()</code> syscall loop but <strong>not</strong> the copy to
socket. For read-heavy indexing (search engines scanning indices), mmap avoids
copy-to-user; for network egress, prefer <code>sendfile</code>/<code>splice</code>.</p>
<hr />
<h2 id="746-when-zero-copy-actually-helps">7.4.6 When zero-copy actually helps</h2>
<pre><code>   ✓  large static files → socket (CDN, HTTP file server)
   ✓  warm page cache (repeated sends of same file)
   ✓  high bandwidth, CPU-bound copy overhead visible in perf
   ✓  kernel-to-kernel proxy (splice between sockets/pipes)

   ✗  small messages (&lt; few KB) — syscall setup dominates
   ✗  TLS/encryption in user space
   ✗  cold cache streaming (disk I/O bound, not copy bound)
   ✗  need to transform bytes (compression, JSON parsing)
</code></pre>
<p><strong>Systems ▸</strong> Measure before optimizing:</p>
<pre><code class="language-bash">perf stat -e cpu-cycles,instructions,cache-misses ./server
# compare read+write vs sendfile at your target file size
</code></pre>
<p>Profile with <code>strace -c</code> (Part 8.4): zero-copy should drop <code>read</code>/<code>write</code> counts
and user CPU.</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p>Naive <code>read()</code> + <code>write()</code> file→socket costs four copies and two syscalls per
  chunk; zero-copy removes user-space involvement.</p>
</li>
<li>
<p><code>sendfile()</code> is the simplest file→socket path; <code>splice</code>/<code>vmsplice</code>/<code>tee</code> generalize
  kernel-side moves via pipes.</p>
</li>
<li>
<p><code>MSG_ZEROCOPY</code> avoids send-side copies but requires completion handling.</p>
</li>
<li>
<p><code>mmap</code> avoids read syscalls but not socket copies; use when access pattern is
  random read, not bulk egress.</p>
</li>
<li>
<p>Zero-copy helps at large, warm, unencrypted bulk transfers — not every workload.</p>
</li>
</ul>

<p>Part 0.1 quoted ~100–300 ns per syscall on modern x86-64. That number is the
<strong>floor</strong> — the mode switch, register save, validation, and return path — before
the kernel does real work. In hot loops, syscalls also evict caches, miss TLB
entries, and (on mitigated kernels) pay <strong>KPTI</strong> costs for Meltdown-class bugs.
This chapter makes the cost measurable, then shows how buffering, vector I/O,
message batching, io_uring, and vDSO reduce boundary crossings.</p>
<hr />
<h2 id="751-what-you-pay-per-crossing">7.5.1 What you pay per crossing</h2>
<pre><code>   user                          kernel
   ────                          ──────
   setup rax/rdi/rsi/rdx/...     entry_SYSCALL_64
   SYSCALL instruction    ──▶   save pt_regs, stack switch
                                 syscall table dispatch
                                 validate pointers (copy_from_user)
                                 do work
                                 copy_to_user if needed
   SYSRET                 ◀──   restore, return
   libc: -1 → errno
</code></pre>
<p>Components of cost:</p>
<table>
<thead>
<tr>
<th>component</th>
<th>typical impact</th>
</tr>
</thead>
<tbody>
<tr>
<td>instruction + pipeline flush</td>
<td>tens of ns</td>
</tr>
<tr>
<td>kernel entry/exit stub</td>
<td>~100–300 ns baseline</td>
</tr>
<tr>
<td>argument validation</td>
<td>varies (pointer checks, fd lookup)</td>
</tr>
<tr>
<td>actual work</td>
<td>unbounded (disk, network)</td>
</tr>
<tr>
<td>cache/TLB pollution</td>
<td>hard to isolate; shows up in follow-on user code</td>
</tr>
<tr>
<td>KPTI (user→kernel page table switch)</td>
<td>+30–50% boundary cost on affected CPUs</td>
</tr>
</tbody>
</table>
<p><strong>Systems ▸</strong> Meltdown mitigation (<strong>Kernel Page Table Isolation</strong>) keeps separate
page tables for user and kernel. Every syscall switches CR3 — extra TLB flushes.
Cloud providers felt this in 2018; still relevant when micro-benchmarking syscalls
on laptop vs bare metal vs VM.</p>
<hr />
<h2 id="752-measuring-syscall-overhead">7.5.2 Measuring syscall overhead</h2>
<p><strong>Micro-benchmark</strong> (isolate empty syscall):</p>
<pre><code class="language-c">#define _GNU_SOURCE
#include &lt;stdio.h&gt;
#include &lt;sys/syscall.h&gt;
#include &lt;time.h&gt;
#include &lt;unistd.h&gt;

static inline long sys_getpid_raw(void) {
    long ret;
    __asm__ volatile (&quot;syscall&quot;
        : &quot;=a&quot;(ret)
        : &quot;a&quot;(SYS_getpid)
        : &quot;rcx&quot;, &quot;r11&quot;, &quot;memory&quot;);
    return ret;
}

int main(void) {
    struct timespec ts;
    const int N = 1000000;
    long sum = 0;

    for (int i = 0; i &lt; N; i++)
        sum += sys_getpid_raw();   /* warm */
    (void)sum;

    clock_gettime(CLOCK_MONOTONIC, &amp;ts);
    long long t0 = ts.tv_sec * 1000000000LL + ts.tv_nsec;

    sum = 0;
    for (int i = 0; i &lt; N; i++)
        sum += sys_getpid_raw();

    clock_gettime(CLOCK_MONOTONIC, &amp;ts);
    long long t1 = ts.tv_sec * 1000000000LL + ts.tv_nsec;

    double ns = (double)(t1 - t0) / N;
    printf(&quot;getpid syscall: %.1f ns/call (sum=%ld)\\n&quot;, ns, sum);
    return 0;
}
</code></pre>
<p>Expect ~150–350 ns depending on CPU, kernel, mitigations. <code>getpid()</code> via libc
may hit <strong>vDSO</strong> instead (see §7.5.6) — this raw loop measures true syscall cost.</p>
<p><strong>Application-level profiling:</strong></p>
<pre><code class="language-bash">strace -c ./myserver          # syscall counts + cumulative time
perf stat -e syscalls:sys_enter_* ./myserver
perf record -g ./myserver &amp;&amp; perf report
</code></pre>
<p>Part 8.4 expands tracing tools.</p>
<hr />
<h2 id="753-amortization-buffering">7.5.3 Amortization: buffering</h2>
<p>The oldest strategy — fewer, larger transfers:</p>
<pre><code>   per-character write():  1 byte × 1 syscall × 300 ns  = disaster

</code></pre>
<p>Part 0.1: <code>printf</code> buffers for a reason. Read side: accumulate into a ring buffer,
process in user space, refill with one <code>read()</code>.</p>
<p><strong>Trade-offs ▸</strong> Buffering adds latency (Nagle-like trade-off) and memory. Flush
policy matters for interactive UIs vs batch ETL.</p>

<h2 id="754-vector-io-readv--writev">7.5.4 Vector I/O: readv / writev</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <sys/uio.h></h1>
<p>ssize_t readv(int fd, const struct iovec <em>iov, int iovcnt);
ssize_t writev(int fd, const struct iovec </em>iov, int iovcnt);
\`\`\`</p>
</blockquote>

<ul>
<li>payload without <code>memcpy</code> concat:</li>
</ul>
<pre><code class="language-c">struct iovec iov[2] = {
    { .iov_base = header, .iov_len = header_len },
    { .iov_base = body,   .iov_len = body_len   },

</code></pre>
<p>Same boundary crossing as one <code>write()</code>, two logical regions.</p>
<hr />
<h2 id="755-socket-batching-sendmmsg--recvmmsg">7.5.5 Socket batching: sendmmsg / recvmmsg</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include_1">include <sys/socket.h></h1>
<p>int sendmmsg(int sockfd, struct mmsghdr <em>msgvec,

int recvmmsg(int sockfd, struct mmsghdr </em>msgvec,

gaming, telemetry at high PPS:</p>
<pre><code>   1000 UDP packets
   ────────────────
   recvfrom × 1000  →  1000 boundary crossings
   recvmmsg × 10    →  10 crossings (100 msgs each)
</code></pre>
<p>Part 6.3 (UDP) benefits directly.</p>
<hr />
<h2 id="756-vdso-syscalls-without-crossing">7.5.6 vDSO: syscalls without crossing</h2>
<p>Some &ldquo;syscalls&rdquo; never trap — the kernel maps a <strong>vDSO</strong> (virtual dynamic shared
object) page into every process:</p>
<pre><code>   clock_gettime(CLOCK_MONOTONIC)  ──▶  vDSO stub in user space  (no SYSCALL)
   gettimeofday()                  ──▶  often vDSO
   getpid()                        ──▶  may be cached in libc after first call
   time()                          ──▶  vDSO on modern glibc
</code></pre>
<p>Check: <code>ldd /bin/date</code> or <code>man 7 vdso</code>. <strong>Under the hood ▸</strong> The kernel publishes

trap cost. Use a real trap (<code>getpid</code> raw, <code>read</code> on <code>/dev/zero</code>, etc.).</p>
<hr />
<h2 id="757-io_uring-batching">7.5.7 io_uring batching</h2>
<p>Part 7.3: fill many SQEs, one <code>io_uring_submit()</code>:</p>
<pre><code>   64 reads queued in SQ ring ──▶ one io_uring_enter ──▶ 64 CQEs
</code></pre>
<p>SQPOLL mode can eliminate even the enter call when the kernel thread keeps up.
This is the modern answer when epoll + non-blocking still spends too much time in
<code>read</code>/<code>write</code> traps.</p>
<hr />
<h2 id="758-avoiding-syscalls-in-hot-loops">7.5.8 Avoiding syscalls in hot loops</h2>
<pre><code>   ✓  batch work (mmsg, writev, io_uring)
   ✓  cache fd lookups — don't open/close per request
   ✓  use vDSO time sources (CLOCK_MONOTONIC via clock_gettime)
   ✓  memory-map config read once (Part 3.3) vs stat/open each tick
   ✓  event-driven I/O (Part 7.2) vs poll-by-sleep loop
   ✗  don't &quot;optimize&quot; away necessary security checks or error handling
</code></pre>
<p>Anti-pattern:</p>
<pre><code class="language-c">while (running) {
    usleep(1000);              /* nanosleep syscall */
    if (poll(state)) handle(); /* another syscall */
}
</code></pre>
<p>Better: block in one waiter (<code>epoll_wait</code>) with timeout, or io_uring timeout op.</p>
<hr />
<h2 id="759-profiling-workflow">7.5.9 Profiling workflow</h2>
<pre><code>   1. strace -c ./app     → which syscalls dominate count/time?
   2. perf record -g      → user stacks leading to those syscalls
   3. fix highest ROI     → batch, buffer, zero-copy (Part 7.4), io_uring
   4. re-measure          → strace -c + workload benchmark
</code></pre>
<p>Example <code>strace -c</code> reading:</p>
<pre><code>   % time    syscall        calls

   30.00    write           500000

    5.00    epoll_wait       8000     ← expected for event loop
</code></pre>
<p><strong>Errors ▸</strong> Profiling itself adds overhead — <code>strace</code> slows programs 10–100×. Use
<code>-c</code> summary for counts; <code>perf</code> for production-like load.</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p>Syscall baseline ~100–300 ns plus cache/TLB effects; KPTI adds measurable cost
  on mitigated kernels.</p>
</li>
<li>
<p>Measure with raw micro-benchmarks, <code>strace -c</code>, and <code>perf</code> — not assumptions.</p>
</li>
<li>
<p>Amortize via buffering, <code>readv</code>/<code>writev</code>, <code>sendmmsg</code>/<code>recvmmsg</code>, and io_uring
  SQ batching.</p>
</li>
<li>
<p>vDSO provides user-space fast paths for time — not a general escape hatch.</p>
</li>
<li>Profile first, batch the syscalls that dominate count or wall time.</li>
</ul>

<p><code>/proc</code> looks like a directory tree on disk. It is not. Every path is <strong>synthesized
on read</strong> (and sometimes on write) by kernel handlers — a text API to live kernel
state. <code>ps</code>, <code>top</code>, <code>free</code>, and <code>lsof</code> are thin parsers over <code>/proc</code>. Part 0.5
established that &ldquo;everything is a file&rdquo;; procfs is the clearest proof for process and
system introspection without custom kernel modules.</p>
<hr />
<h2 id="811-procfs-is-not-on-disk">8.1.1 procfs is not on disk</h2>
<p><img alt="The /proc filesystem: virtual tree synthesized by kernel handlers" src="figures/proc-fs.svg" /></p>
<pre><code>   ls /proc/1234/status
        │
        ▼
   openat(&quot;/proc/1234/status&quot;, O_RDONLY)   ← normal syscall
        │
        ▼
   VFS → procfs inode → kernel formats struct task_struct fields → copy to user
        │
        ▼
   read() returns text like &quot;Name:\\tbash\\nState:\\tS (sleeping)\\n...&quot;
</code></pre>
<p>No persistent storage. Reboot clears nothing because nothing was stored. inode
numbers and content can change between reads as the kernel state changes.</p>
<blockquote>
<p><strong>Under the hood ▸</strong> procfs registers with the VFS (Part 2.7). Each file type has
<code>seq_show</code> or <code>read</code> handlers that walk kernel data structures and <code>sprintf</code> into
your buffer. Writes hit different handlers — often permission-checked tunables.</p>
</blockquote>
<p><strong>Trade-offs ▸</strong> Human-readable, script-friendly, stable enough for decades of
tooling. Not a high-performance binary API — parsing text costs CPU. Race-prone for
atomic snapshots (read <code>stat</code> twice, PID may have exited).</p>
<hr />
<h2 id="812-procpid--per-process-entries">8.1.2 /proc/[pid]/ — per-process entries</h2>
<p>For each live process <code>PID</code>:</p>
<table>
<thead>
<tr>
<th>path</th>
<th>content</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>status</code></td>
<td>human summary: name, state, uid/gid, vm peak, threads</td>
</tr>
<tr>
<td><code>stat</code></td>
<td>one-line machine parse: state, utime, stime, vsize, rss, &hellip;</td>
</tr>
<tr>
<td><code>statm</code></td>
<td>memory page counts</td>
</tr>
<tr>
<td><code>maps</code></td>
<td>memory mappings (Part 3.1) — VMA list with permissions</td>
</tr>
<tr>
<td><code>smaps</code></td>
<td>maps + per-mapping RSS/PSS detail</td>
</tr>
<tr>
<td><code>fd/</code></td>
<td>symlinks <code>0</code>→<code>/dev/pts/0</code>, <code>3</code>→<code>socket:[...]</code></td>
</tr>
<tr>
<td><code>fdinfo/N</code></td>
<td>offset, flags, mount id per fd</td>
</tr>
<tr>
<td><code>cmdline</code></td>
<td>NUL-separated argv (may be empty for kernel threads)</td>
</tr>
<tr>
<td><code>environ</code></td>
<td><code>KEY=value\\0...</code> (root or same uid to read)</td>
</tr>
<tr>
<td><code>limits</code></td>
<td>soft/hard rlimits (Part 1.6)</td>
</tr>
<tr>
<td><code>cwd</code>, <code>exe</code>, <code>root</code></td>
<td>symlinks to working dir, binary, chroot root</td>
</tr>
<tr>
<td><code>task/</code></td>
<td>thread subdirs (<code>/proc/PID/task/TID/...</code>)</td>
</tr>
</tbody>
</table>
<p>Reading <code>status</code>:</p>
<pre><code class="language-c">#include &lt;errno.h&gt;
#include &lt;fcntl.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;
#include &lt;unistd.h&gt;

static int read_proc_status(pid_t pid) {
    char path[64];
    snprintf(path, sizeof path, &quot;/proc/%d/status&quot;, pid);

    int fd = open(path, O_RDONLY);
    if (fd == -1) { perror(&quot;open&quot;); return -1; }

    char buf[4096];
    ssize_t n = read(fd, buf, sizeof buf - 1);
    if (n == -1) { perror(&quot;read&quot;); close(fd); return -1; }
    buf[n] = '\\0';

    char *line = strstr(buf, &quot;VmRSS:&quot;);

    return 0;

<h2 id="813-procpidmaps-and-debugging-memory">8.1.3 /proc/[pid]/maps and debugging memory</h2>
<pre><code>   00400000-00401000 r-xp ... /bin/cat          ← executable text
   00600000-00601000 rw-p ... [heap]             ← brk heap
   7f....-7f.... rw-p ... [stack]
   7f....-7f.... r--p ... /lib/libc.so.6

<h2 id="814-procpidfd-and-lsof">8.1.4 /proc/[pid]/fd/ and lsof</h2>
<p>Each numeric name is a <strong>duplicate</strong> of the process&rsquo;s fd table entry (Part 0.5):</p>
<pre><code>   /proc/1234/fd/3 → socket:[12345]
   /proc/1234/fd/4 → /var/log/app.log
</code></pre>

do the same in C with <code>readlink</code>.</p>

<thead>

<th>errno</th>
<th>when</th>

</tbody>
</table>

<thead>

<th>exposes</th>

<tr>
<td><code>loadavg</code></td>
<td>1/5/15 min load + runnable/total entities</td>

<tr>
<td><code>stat</code></td>
<td>aggregate CPU ticks, context switches, boot time</td>
</tr>
<tr>
<td><code>uptime</code></td>
<td>seconds since boot, idle sum</td>
</tr>
<tr>
<td><code>sys/</code></td>
<td>sysctl tunables (Part 8.2)</td>
</tr>
<tr>
<td><code>self</code></td>
<td>symlink to calling process&rsquo;s <code>/proc/PID</code></td>
</tr>
</tbody>
</table>
<p><code>free</code> reads <code>meminfo</code>. <code>uptime</code> reads <code>uptime</code> + <code>loadavg</code>. <code>top</code> combines
<code>/proc/stat</code>, <code>/proc/[pid]/stat</code>, and <code>meminfo</code>.</p>
<p>Parse <code>meminfo</code> pattern:</p>
<pre><code class="language-c">static long parse_meminfo_kb(const char *key) {

            strstr(line, key)) {

    return -1;

<hr />
<h2 id="816-writing-to-proc-for-tunables">8.1.6 Writing to /proc for tunables</h2>
<p>Many <code>/proc/sys/*</code> and some <code>/proc</code> files accept writes (Part 8.2). Example —

<h2 id="817-how-tools-map-to-procfs">8.1.7 How tools map to procfs</h2>

<ul>
<li>
<p><code>/proc</code> is a virtual filesystem: kernel generates content on read from live
  structures — nothing persists on disk.</p>
</li>
<li>

</li>
</ul>

blocking toggles, disk geometry, Wi-Fi scans — Unix provides <strong><code>ioctl()</code></strong>: a typed-
ish catch-all control channel on an open fd. Part 2.5 covered <code>fcntl</code>; ioctl is the
parallel path for <strong>devices</strong>, <strong>sockets</strong>, and <strong>ttys</strong>. It is powerful, weakly
typed, and a frequent source of portability bugs.</p>
<hr />
<h2 id="831-the-catch-all-control-syscall">8.3.1 The catch-all control syscall</h2>
<blockquote>
<p><strong>The call ▸</strong>
\`\`\`c</p>
<h1 id="include">include <sys/ioctl.h></h1>
<p>int ioctl(int fd, unsigned long request, &hellip; /<em> arg </em>/ );
<code>\`\`
On success: often</code>0<code>, sometimes a non-negative driver-specific value. On failure:</code>-1<code>,</code>errno\` set.</p>
</blockquote>
<pre><code>   read/write  ──▶  byte streams (data plane)
   ioctl       ──▶  side operations (control plane)
                    &quot;set MTU&quot;, &quot;get window size&quot;, &quot;eject tray&quot;
</code></pre>
<p>Every fd type supports a <strong>different</strong> request set. Passing a terminal ioctl to a
regular file fails with <code>ENOTTY</code> (&ldquo;Not a typewriter&rdquo; — historical name).</p>
<blockquote>
<p><strong>Under the hood ▸</strong> The VFS dispatches <code>ioctl</code> to the file&rsquo;s <code>f_op-&gt;unlocked_ioctl</code>
(or compat variant). Drivers switch on <code>request</code> and copy arguments with
<code>copy_from_user</code> / <code>copy_to_user</code> (Part 0.2).</p>
</blockquote>
<hr />
<h2 id="832-request-encoding-_io--_ior--_iow--_iowr">8.3.2 Request encoding: _IO / _IOR / _IOW / _IOWR</h2>
<p>Requests are 32-bit integers built from macros in <code>&lt;sys/ioctl.h&gt;</code>:</p>
<pre><code>   request bits:
   ┌──────────┬──────────┬──────────┬──────────┐
   │ direction│   size   │   type   │    nr    │
   │  2 bits  │ 14 bits  │  8 bits  │  8 bits  │
   └──────────┴──────────┴──────────┴──────────┘

   _IO(type, nr)              no argument
   _IOR(type, nr, struct)     read from kernel → user
   _IOW(type, nr, struct)     write user → kernel
   _IOWR(type, nr, struct)   both directions
</code></pre>
<p>Example — terminal window size:</p>
<pre><code class="language-c">#include &lt;sys/ioctl.h&gt;

<h2 id="833-terminal-and-socket-ioctls">8.3.3 Terminal and socket ioctls</h2>
<p>Common terminal requests:</p>
<table>
<thead>
<tr>
<th>request</th>
<th>direction</th>
<th>purpose</th>
</tr>
</thead>
<tbody>

<td><code>TIOCGWINSZ</code></td>
<td>read</td>
<td>get rows/cols</td>
</tr>
<tr>
<td><code>TIOCSWINSZ</code></td>

<td>set window size</td>

</table>

<table>
<thead>
<tr>
<th>request</th>
<th>purpose</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>FIONREAD</code></td>
<td>bytes available to read</td>
</tr>
<tr>

<td>set/clear non-blocking (int arg)</td>
</tr>
<tr>
<td><code>SIOCGIFADDR</code></td>
<td>get interface IP (via socket fd)</td>
</tr>
</tbody>

<p>Part 7.1 non-blocking via <code>FIONBIO</code>:</p>

<p>Equivalent to <code>fcntl(fd, F_SETFL, flags | O_NONBLOCK)</code>.</p>

<p>Block device (<code>/dev/sda</code>) ioctls include <code>BLKGETSIZE64</code>, <code>BLKFLSBUF</code> (flush cache).
Network <code>SIOCSIF*</code> / <code>SIOCGIF*</code> configure interfaces. DRM/KMS graphics ioctls use

<p>Each subsystem documents its ioctl set in <code>man 4</code>, driver headers (<code>&lt;linux/fs.h&gt;</code>,
<code>&lt;sys/mount.h&gt;</code>), or kernel <code>Documentation/userspace-api/ioctl/</code>.</p>
<hr />
<h2 id="835-why-ioctl-is-untyped-and-dangerous">8.3.5 Why ioctl is untyped and dangerous</h2>
<pre><code>   problems with ioctl
   ───────────────────
   • request number collisions across drivers (mitigated by type byte)
   • any pointer arg — kernel must validate size + direction
   • 32-bit compat on 64-bit (compat_ioctl handlers)
   • no compile-time check that fd matches request family

</code></pre>

and block devices.</p>

use kernel-defined types and zero-init:</p>

<pre><code class="language-c">int avail = 0;
